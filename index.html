<script>
/* assets/js/app.js */
/* =========================================================================
   地產代理資格考試 · 互動溫習站
   app.js — 路由、狀態、練習引擎、模擬考試、查冊、工具
   ========================================================================= */
(function () {
  "use strict";

  /* ------------------------------ 工具 ------------------------------ */
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));

  // 輕量文字標記：**粗體**、`code`、以及（English term）自動淡化
  function md(s) {
    let t = esc(s);
    t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    t = t.replace(/`([^`]+)`/g, '<code class="mono">$1</code>');
    const skip = (g) => /^[a-z]{1,4}$/i.test(g);   // (i) (ii) (a) 等不當作英文術語
    t = t.replace(/（([A-Za-z][^（）]{0,60})）/g, (m, g) => skip(g) ? m : "（<span class=\"en\">" + g + "</span>）");
    t = t.replace(/\(([A-Za-z][A-Za-z0-9 ,.\-\/&']{0,60})\)/g, (m, g) => skip(g) ? m : "(<span class=\"en\">" + g + "</span>)");
    return t;
  }
  const pad2 = (n) => (n < 10 ? "0" : "") + n;
  function fmtClock(sec) {
    sec = Math.max(0, Math.round(sec));
    const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
    return (h > 0 ? h + ":" + pad2(m) : pad2(m)) + ":" + pad2(s);
  }
  const LETTERS = ["A", "B", "C", "D", "E", "F"];

  function toast(msg) {
    const t = $("#toast");
    t.textContent = msg;
    t.classList.add("on");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => t.classList.remove("on"), 1900);
  }
  function modal(html) {
    $("#modalBox").innerHTML = html;
    $("#modal").classList.add("on");
  }
  function closeModal() { $("#modal").classList.remove("on"); }

  /* ------------------------------ 儲存 ------------------------------ */
  const KEY = "eaqe.v1";
  const DEFAULT_STORE = {
    v: 1,
    settings: { examDate: "2026-12-15", theme: "light", shuffleOpts: true },
    stats: {},          // qid -> {a,c,w,s}
    notesRead: {},      // noteId -> ts
    mocks: [],          // {id, ts, score, p1, p2, total, pass, secs, answers}
    flags: {},          // qid -> ts  標記／待重溫
    streak: { days: [], last: null }
  };
  let S = load();
  function load() {
    try {
      const raw = localStorage.getItem(KEY);
      if (!raw) return JSON.parse(JSON.stringify(DEFAULT_STORE));
      const o = JSON.parse(raw);
      return Object.assign(JSON.parse(JSON.stringify(DEFAULT_STORE)), o, {
        settings: Object.assign({}, DEFAULT_STORE.settings, o.settings || {})
      });
    } catch (e) { return JSON.parse(JSON.stringify(DEFAULT_STORE)); }
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
  function todayKey() { const d = new Date(); return d.getFullYear() + "-" + pad2(d.getMonth() + 1) + "-" + pad2(d.getDate()); }
  function touchStreak() {
    const t = todayKey();
    if (S.streak.last === t) return;
    if (S.streak.days.indexOf(t) < 0) S.streak.days.push(t);
    if (S.streak.days.length > 400) S.streak.days = S.streak.days.slice(-400);
    S.streak.last = t;
    save();
  }
  function recordAttempt(qid, correct) {
    const st = S.stats[qid] || { a: 0, c: 0, w: 0, s: 0 };
    st.a++; st.s = Date.now();
    if (correct) st.c++; else st.w++;
    S.stats[qid] = st;
    touchStreak(); save();
  }

  /* ------------------------------ 資料 ------------------------------ */
  const EXAM = window.EXAM || {};
  const SYLLABUS = window.SYLLABUS || [];
  const NOTES = window.NOTES || [];
  const BANK = window.BANK || [];
  const MOCKS = window.MOCKS || [];
  const LSDOCS = window.LSDOCS || [];
  const LAWS = window.LAWS || [];
  const CIRCULARS = window.CIRCULARS || [];
  const TERMS = window.TERMS || [];
  const FORMS = window.FORMS || [];

  const BANK_BY_ID = {}; BANK.forEach((q) => { BANK_BY_ID[q.id] = q; });
  const NOTE_BY_REF = {}; NOTES.forEach((n) => { (n.ref || []).forEach((r) => { (NOTE_BY_REF[r] = NOTE_BY_REF[r] || []).push(n.id); }); });
  const PART_TITLE = {}; SYLLABUS.forEach((p) => { PART_TITLE[p.id] = p.title; });

  function partOf(q) { return q.p || 1; }
  function questionsOfPart(p) { return BANK.filter((q) => partOf(q) === p); }

  /* ---- 選項顯示次序：以固定規則平均分佈正確答案的位置 ---- */
  const KEYPOS = new Map();
  (function () {
    const all = BANK.slice();
    (MOCKS || []).forEach((m) => {
      (m.part1 || []).forEach((q) => all.push(q));
      ((m.part2 && m.part2.qs) || []).forEach((q) => all.push(q));
    });
    (LSDOCS || []).forEach((d) => (d.qs || []).forEach((q, i) => all.push(Object.assign({ id: "ls:" + d.id + ":" + i }, q))));
    const seen = new Set();
    let gi = 0;
    all.forEach((q) => {
      const k = q.id || (q.q || "").slice(0, 28);
      if (seen.has(k)) return;
      seen.add(k);
      KEYPOS.set(k, gi % 5);
      gi++;
    });
  })();
  function qkey(q) { return q.id || (q.q || "").slice(0, 28); }
  function permFor(q) {
    const k1 = qkey(q), k2 = (q.q || "").slice(0, 28);
    const target = KEYPOS.has(k1) ? KEYPOS.get(k1) : (KEYPOS.has(k2) ? KEYPOS.get(k2) : 0);
    const rest = [0, 1, 2, 3, 4].filter((i) => i !== q.a);
    const out = [];
    for (let p = 0; p < 5; p++) out[p] = (p === target) ? q.a : rest.shift();
    return out;
  }

  /* 熟練度：以練習正確率 + 覆蓋率計算 */
  function partMastery(p) {
    const qs = questionsOfPart(p);
    if (!qs.length) return { pct: 0, seen: 0, total: 0, acc: 0 };
    let seen = 0, hits = 0, tries = 0;
    qs.forEach((q) => {
      const st = S.stats[q.id];
      if (st && st.a) { seen++; hits += st.c; tries += st.a; }
    });
    const coverage = seen / qs.length;
    const acc = tries ? hits / tries : 0;
    const pct = Math.round((coverage * 0.45 + acc * 0.55) * 100);
    return { pct, seen, total: qs.length, acc: tries ? Math.round(acc * 100) : 0 };
  }
  function overallReadiness() {
    let sum = 0;
    SYLLABUS.forEach((p) => { sum += partMastery(p.id).pct; });
    return Math.round(sum / Math.max(1, SYLLABUS.length));
  }

  /* ------------------------------ 路由 ------------------------------ */
  const ROUTES = [
    { h: "#/home", t: "儀表板", c: "EAQE · 香港地產代理監管局資格考試", go: viewHome },
    { h: "#/exam", t: "考試資訊", c: "考試模式、合格準則、報名與規則", go: viewExam },
    { h: "#/syllabus", t: "考試大綱", c: "八個部份 · 認知水平 · 命題範圍", go: viewSyllabus },
    { h: "#/notes", t: "溫習手冊", c: "按考試大綱編排的重點筆記", go: viewNotesIndex },
    { h: "#/practice", t: "題庫練習", c: "逐題講解 · 錯題重練", go: viewPracticeSetup },
    { h: "#/mock", t: "模擬考試", c: "50 題 · 3 小時 · 真實計分", go: viewMockSetup },
    { h: "#/landsearch", t: "文件與範本", c: "查冊文件 · 法定表格 · 合約範本", go: viewLandSearch },
    { h: "#/law", t: "法例原文", c: "條文摘錄 · 中英對照", go: viewLaw },
    { h: "#/circulars", t: "執業通告", c: "監管局通告要點 · 考試必讀", go: viewCirculars },
    { h: "#/tools", t: "實用工具", c: "印花稅計算 · 估價計算 · 表格 · 術語", go: viewTools },
    { h: "#/stats", t: "學習紀錄", c: "進度、弱項與模擬成績", go: viewStats },
    { h: "#/settings", t: "設定", c: "考試日期、主題、資料備份", go: viewSettings }
  ];

  function buildNav() {
    const groups = [
      { name: "開始", items: ["#/home", "#/exam", "#/syllabus"] },
      { name: "學習", items: ["#/notes", "#/practice"] },
      { name: "實戰", items: ["#/mock", "#/landsearch"] },
      { name: "參考", items: ["#/law", "#/circulars", "#/tools", "#/stats", "#/settings"] }
    ];
    const ic = { "#/home": "◉", "#/exam": "▣", "#/syllabus": "☰", "#/notes": "✎", "#/practice": "✓", "#/mock": "⏱", "#/landsearch": "⌕", "#/law": "§", "#/circulars": "◈", "#/tools": "⚒", "#/stats": "▤", "#/settings": "⚙" };
    $("#nav").innerHTML = groups.map((g) =>
      '<div class="grp">' + g.name + "</div>" + g.items.map((h) => {
        const r = ROUTES.find((x) => x.h === h);
        return '<a href="' + h + '" data-h="' + h + '"><span class="ic">' + ic[h] + "</span><span>" + r.t + "</span></a>";
      }).join("")
    ).join("");
  }

  function route() {
    const h = (location.hash || "#/home").split("?")[0];
    const seg = h.replace(/^#\//, "").split("/");
    const base = "#/" + seg[0];
    const r = ROUTES.find((x) => x.h === base) || ROUTES[0];
    $("#pageTitle").textContent = r.t;
    $("#pageCrumb").textContent = r.c;
    $$("#nav a").forEach((a) => a.classList.toggle("on", a.dataset.h === base));
    $("#sidebar").classList.remove("open");
    hideGlobalSearch(base);
    closeModal();
    window.scrollTo(0, 0);
    const sub = seg.slice(1);
    if (base === "#/notes" && sub.length) { viewNotes(sub); return; }
    r.go(sub);
  }

  /* ------------------------------ 共用元件 ------------------------------ */
  function ring(pct, label) {
    const r = 44, c = 2 * Math.PI * r, off = c * (1 - Math.min(1, Math.max(0, pct / 100)));
    return '<div class="ring"><svg viewBox="0 0 104 104">' +
      '<circle cx="52" cy="52" r="' + r + '" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="8"/>' +
      '<circle cx="52" cy="52" r="' + r + '" fill="none" stroke="#8fe0d4" stroke-width="8" stroke-linecap="round" ' +
      'stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"/>' +
      "</svg><div style=\"text-align:center\"><div class=\"val\">" + pct + '%</div><div class="lbl">' + esc(label) + "</div></div></div>";
  }
  function countdown() {
    const d = S.settings.examDate;
    if (!d) return null;
    const t = new Date(d + "T00:00:00+08:00").getTime();
    const days = Math.ceil((t - Date.now()) / 86400000);
    return { days, date: d };
  }
  function pillForLevel(lv) {
    if (!lv) return "";
    const m = String(lv).match(/(\d)/);
    const n = m ? m[1] : "";
    const cls = { "1": "blue", "2": "green", "3": "gold", "4": "violet" }[n] || "gray";
    return '<span class="pill ' + cls + '">第' + n + "級</span>";
  }

  function quickCard(t, d, href, ic) {

  function scheduleCard() {
    const s = window.EXAM_SCHEDULE;
    if (!s) return "";
    const daysTo = (d) => Math.ceil((new Date(d + "T00:00:00+08:00").getTime() - Date.now()) / 86400000);
    const reg = daysTo(s.openReg), exam = daysTo(s.examDate);
    const items = [
      ["報名開始", s.openReg, reg >= 0 ? "距今 " + reg + " 天" : "已開始"],
      ["郵寄截止", s.closePost, daysTo(s.closePost) >= 0 ? "距今 " + daysTo(s.closePost) + " 天" : "已截止"],
      ["網上截止", s.closeOnline, daysTo(s.closeOnline) >= 0 ? "距今 " + daysTo(s.closeOnline) + " 天" : "已截止"],
      ["考試日期", s.examDate, exam >= 0 ? "距今 " + exam + " 天" : "已舉行"],
      ["成績發放", s.results, ""]
    ];
    return '<div class="card pad" style="margin-top:16px;border-color:color-mix(in srgb,var(--gold) 34%,var(--line))">' +
      '<div class="between"><div><h3 style="font-size:15px">最新考試期 · 2026 年 10–12 月</h3>' +
      '<div class="tiny muted">資料來源：地產代理監管局公佈的考試時間表（' + esc(s.examTime || "") + " 開考）</div></div>" +
      '<a class="btn sm" href="#/exam">詳情 →</a></div>' +
      '<div class="grid g4" style="margin-top:12px">' +
      items.slice(0, 4).map((it) => '<div><div class="tiny muted">' + it[0] + '</div><div style="font-weight:700;font-size:14px" class="num">' + it[1] +
        '</div><div class="tiny" style="color:var(--gold)">' + esc(it[2]) + "</div></div>").join("") +
      "</div>" +
      '<div class="tiny muted" style="margin-top:10px">報名由 ' + esc(s.openReg) + " 上午 9 時開始，名額先到先得；若額滿會提早截止。以上日期或會更改，報考前請查閱監管局網頁。</div>" +
      "</div>";

  /* ------------------------------ 筆記 ------------------------------ */
  function notesOfPart(p) { return NOTES.filter((n) => n.part === Number(p)); }

  function viewNotesIndex() {
    $("#view").innerHTML =
      '<div class="card pad"><h2 style="font-size:19px">溫習手冊</h2>' +
      '<p class="sub" style="margin-top:4px">共 ' + NOTES.length + " 篇重點筆記，按考試大綱八個部份編排。每篇附「法例依據」「考試貼士」與英文術語，讀完可即場練習該部份。</p></div>" +
      '<div class="grid g2" style="margin-top:14px">' +
      SYLLABUS.map((p) => {
        const ns = notesOfPart(p.id);
        const read = ns.filter((n) => S.notesRead[n.id]).length;
        return '<div class="card pad hov">' +
          '<div class="row"><div style="width:34px;height:34px;border-radius:10px;background:var(--brand-soft);color:var(--brand-ink);display:grid;place-items:center;font-weight:800">' + p.id + "</div>" +

          '<div class="bar" style="margin-top:10px"><i style="width:' + (ns.length ? Math.round(read / ns.length * 100) : 0) + '%"></i></div>' +

  function viewNotes(seg) {
    const part = Number(seg[0] === "part" ? seg[1] : seg[0]);
    const focus = seg[2] || null;
    const p = SYLLABUS.find((x) => x.id === part);
    if (!p) { location.hash = "#/notes"; return; }
    const ns = notesOfPart(part);
    $("#pageTitle").textContent = "第 " + part + " 部份 · " + p.title;
    $("#pageCrumb").textContent = "溫習手冊 / 第 " + part + " 部份";

    const html =
      '<div class="card pad" style="background:linear-gradient(120deg,var(--brand-soft),transparent)">' +
        '<div class="between"><div><div class="pill">第 ' + part + " 部份 " + pillForLevel(p.level) + "</div>" +
        '<h2 style="font-size:20px;margin-top:8px">' + esc(p.title) + '</h2>' +
        '<div class="tiny muted">' + esc(p.en || "") + "</div>" +
        '<p class="sub small" style="margin-top:8px;max-width:70ch">' + md(p.intro || "") + "</p></div></div>" +
        '<div class="btn-row" style="margin-top:12px">' +
          '<a class="btn" href="#/notes/part/' + (part > 1 ? part - 1 : part) + '">← 上一部份</a>' +
          '<a class="btn" href="#/notes/part/' + (part < 8 ? part + 1 : part) + '">下一部份 →</a>' +
          '<span class="spacer"></span>' +
          '<button class="btn primary" data-act="markAll" data-part="' + part + '">標記全部為已讀</button>' +

      "</div>" +
      '<div class="grid" style="grid-template-columns:210px minmax(0,1fr);gap:18px;margin-top:16px;align-items:start">' +
        '<div class="notetoc card pad" style="padding:10px"><div class="tiny muted" style="padding:4px 10px 6px;letter-spacing:.1em">目錄</div>' +
          ns.map((n) => '<a href="#/notes/part/' + part + "/" + n.id + '" data-note="' + n.id + '" class="' + (focus === n.id ? "on" : "") + '">' + esc(n.title) + "</a>").join("") +

        '<div id="noteBody">' + ns.map((n) => renderNote(n)).join("") + "</div>" +

  function renderNote(n) {
    const read = !!S.notesRead[n.id];
    return '<section class="card note-sec" id="n_' + n.id + '">' +
      '<div class="between"><h2>' + esc(n.title) + "</h2>" +
        '<button class="btn sm ' + (read ? "ghost" : "") + '" data-act="markRead" data-note="' + n.id + '">' +
        (read ? "✓ 已讀" : "標記已讀") + "</button></div>" +
      '<div class="ref">' + esc((n.ref || []).join(" · ")) + (n.level ? " · " + esc(n.level) : "") + "</div>" +
      (n.blocks || []).map(renderBlock).join("") +
      (n.tip ? '<div class="callout tip"><div class="ct">◆ 考試貼士</div>' + md(n.tip) + "</div>" : "") +
      "</section>";
  }

  function renderBlock(b) {
    switch (b.t) {
      case "p": return "<p>" + (b.h ? "<strong>" + md(b.h) + "</strong>" : "") + md(b.text) + "</p>";
      case "ul": return "<ul>" + b.items.map((i) => "<li>" + md(i) + "</li>").join("") + "</ul>";
      case "ol": return "<ol>" + b.items.map((i) => "<li>" + md(i) + "</li>").join("") + "</ol>";
      case "h": return "<h4>" + md(b.text) + "</h4>";
      case "table": return '<table class="tb">' + (b.head ? "<thead><tr>" + b.head.map((h) => "<th>" + md(h) + "</th>").join("") + "</tr></thead>" : "") +
        "<tbody>" + b.rows.map((r) => "<tr>" + r.map((c) => "<td>" + md(c) + "</td>").join("") + "</tr>").join("") + "</tbody></table>";
      case "law": return '<div class="callout law"><div class="ct">§ 法例依據</div>' + md(b.text) + "</div>";
      case "tip": return '<div class="callout tip"><div class="ct">◆ 貼士</div>' + md(b.text) + "</div>";
      case "eg": return '<div class="callout eg"><div class="ct">● 例子</div>' + md(b.text) + "</div>";
      case "warn": return '<div class="callout warn"><div class="ct">▲ 易錯</div>' + md(b.text) + "</div>";
      case "def": return '<table class="tb"><thead><tr><th style="width:26%">術語</th><th>解釋</th></tr></thead><tbody>' +
        b.items.map((d) => "<tr><td><b>" + esc(d.zh) + '</b><div class="tiny muted">' + esc(d.en || "") + "</div></td><td>" + md(d.d) + "</td></tr>").join("") + "</tbody></table>";
      default: return "";
    }
  }

  /* ------------------------------ 練習 ------------------------------ */
  let PR = null; // practice session

  function viewPracticeSetup(params) {
    const pre = new URLSearchParams((location.hash.split("?")[1] || ""));
    const prePart = pre.get("part");
    $("#view").innerHTML =
      '<div class="card pad"><h2 style="font-size:19px">題庫練習</h2>' +
      '<p class="sub" style="margin-top:4px">共 ' + BANK.length + " 題。每題作答後即時顯示答案、解釋與法例依據；答錯的題目會自動進入「錯題本」，可隨時重練。</p></div>" +
      '<div class="card pad" style="margin-top:14px"><h3 style="font-size:15px;margin-bottom:10px">選擇範圍</h3>' +
        '<div class="btn-row" id="partChips">' +
          SYLLABUS.map((p) => '<button class="chip' + (prePart == p.id ? " on" : "") + '" data-part="' + p.id + '">第' + p.id + " 部份 · " + esc(p.title) + "</button>").join("") +
        "</div>" +
        '<div class="btn-row" style="margin-top:12px">' +
          '<button class="chip" data-act="selAll">全選</button><button class="chip" data-act="selNone">全部取消</button>' +
          '<button class="chip" data-act="selWeak">只選未做／答錯</button>' +
        "</div>" +
      "</div>" +
      '<div class="grid g2" style="margin-top:14px">' +
        '<div class="card pad"><h3 style="font-size:15px;margin-bottom:10px">題數</h3>' +
          '<div class="btn-row" id="countChips">' + [10, 20, 30, 0].map((c) => '<button class="chip' + (c === 20 ? " on" : "") + '" data-count="' + c + '">' + (c === 0 ? "全部" : c + " 題") + "</button>").join("") + "</div>" +
          '<div class="callout tip" style="margin-top:14px"><div class="ct">◆ 建議</div>首次溫習用「即時對答 + 10 題」，先建立概念；臨考前用 30 題混合作答，訓練速度。</div>' +
        "</div>" +
        '<div class="card pad"><h3 style="font-size:15px;margin-bottom:10px">模式</h3>' +
          '<div class="btn-row" id="modeChips">' +
            '<button class="chip on" data-mode="instant">即時對答（推薦）</button>' +
            '<button class="chip" data-mode="exam">連續作答（最後才對答案）</button>' +
          "</div>" +
          '<div class="row" style="margin-top:14px;color:var(--muted)" class="small"><span class="tiny">選項次序會自動打亂；作答時可按鍵盤 <span class="kbd">A</span>–<span class="kbd">E</span> 選擇，<span class="kbd">Enter</span> 確認／下一題。</span></div>' +
        "</div>" +
      "</div>" +
      '<div class="card pad" style="margin-top:14px;text-align:center">' +
        '<button class="btn primary lg" data-act="startPractice">開始練習</button>' +
        '<div class="tiny muted" style="margin-top:8px">已選 <b id="pickCount">—</b> 題</div>' +
      "</div>" +
      '<div class="card pad" style="margin-top:14px"><div class="between"><h3 style="font-size:15px">錯題本</h3>' +
        '<span class="pill red">' + Object.keys(S.stats).filter((k) => S.stats[k] && S.stats[k].w > 0 && (S.stats[k].w > S.stats[k].c)).length + " 題待克服</span></div>" +
        '<p class="small sub" style="margin-top:6px">「答錯次數多於答對次數」的題目會被列為待克服。用上方「只選未做／答錯」即可集中重練。</p></div>';

    if (prePart) { setTimeout(updatePickCount, 0); }
    else { $$("#partChips .chip").forEach((c) => c.classList.remove("on")); }
    $("#partChips").addEventListener("click", (e) => {
      const c = e.target.closest(".chip"); if (!c || !c.dataset.part) return;
      c.classList.toggle("on"); updatePickCount();
    });
    $("#countChips").addEventListener("click", (e) => {
      const c = e.target.closest(".chip"); if (!c) return;
      $$("#countChips .chip").forEach((x) => x.classList.remove("on")); c.classList.add("on"); updatePickCount();
    });
    $("#modeChips").addEventListener("click", (e) => {
      const c = e.target.closest(".chip"); if (!c) return;
      $$("#modeChips .chip").forEach((x) => x.classList.remove("on")); c.classList.add("on");
    });
    $$('[data-act="selAll"]').forEach((b) => b.onclick = () => { $$("#partChips .chip").forEach((c) => c.classList.add("on")); updatePickCount(); });
    $$('[data-act="selNone"]').forEach((b) => b.onclick = () => { $$("#partChips .chip").forEach((c) => c.classList.remove("on")); updatePickCount(); });
    $$('[data-act="selWeak"]').forEach((b) => b.onclick = () => {
      $$("#partChips .chip").forEach((c) => c.classList.remove("on"));
      updatePickCount();
      PR = { weak: true };
    });
    updatePickCount();
  }

  function selectedParts() {
    return $$("#partChips .chip.on").map((c) => Number(c.dataset.part));
  }
  function selectedCount() {
    const c = $("#countChips .chip.on");
    return c ? Number(c.dataset.count) : 20;
  }
  function updatePickCount() {
    const parts = selectedParts();
    let pool = parts.length ? BANK.filter((q) => parts.indexOf(partOf(q)) >= 0) : BANK;
    const n = selectedCount();
    const c = Math.min(n || pool.length, pool.length);
    const el = $("#pickCount"); if (el) el.textContent = c;
  }

  function startPractice() {
    let parts = selectedParts();
    let pool = parts.length ? BANK.filter((q) => parts.indexOf(partOf(q)) >= 0) : BANK.slice();
    if (PR && PR.weak) {
      pool = pool.filter((q) => {
        const st = S.stats[q.id];
        return !st || !st.a || (st.w > st.c);
      });
      if (!pool.length) { toast("太好了，沒有待克服的題目"); PR = null; return; }
      PR = null;
    }
    const n = selectedCount();
    const mode = ($("#modeChips .chip.on") || {}).dataset ? $("#modeChips .chip.on").dataset.mode : "instant";
    const shuffle = true;
    pool = shuffleArr(pool);
    if (n) pool = pool.slice(0, n);
    PR = {
      mode, shuffle, list: pool, i: 0, answers: {}, revealed: {},
      startTs: Date.now(), order: pool.map((q) => q.id)
    };
    runPractice();
  }

  function shuffleArr(a) { const b = a.slice(); for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; }

  function runPractice() {
    if (!PR) { location.hash = "#/practice"; return; }
    const q = PR.list[PR.i];
    if (!q) return practiceSummary();
    $("#pageTitle").textContent = "題庫練習";
    $("#pageCrumb").textContent = "第 " + (PR.i + 1) + " / " + PR.list.length + " 題 · 第 " + partOf(q) + " 部份";
    const opts = permFor(q);
    PR._optOrder = opts;
    const revealed = PR.revealed[q.id];
    const picked = PR.answers[q.id];
    const isExam = PR.mode === "exam" && !PR._reviewMode;

    $("#view").innerHTML =
      '<div class="progressline" style="margin-bottom:10px"><span>進度</span><div class="bar" style="flex:1"><i style="width:' + Math.round((PR.i) / PR.list.length * 100) + '%"></i></div>' +
        '<span class="num">' + (PR.i + 1) + "/" + PR.list.length + "</span></div>" +

      '<div class="card pad">' +
        '<div class="qhead"><span class="pill">第 ' + partOf(q) + " 部份</span>" + (q.ref ? '<span class="pill gray">' + esc(q.ref) + "</span>" : "") +
          (q.tag ? '<span class="pill gray">' + esc(q.tag) + "</span>" : "") +
          '<span class="spacer"></span><button class="btn sm ghost" data-act="flag" data-q="' + q.id + '">' + (S.flags[q.id] ? "★ 已標記" : "☆ 標記") + "</button></div>" +
        '<div class="qtext">' + md(q.q) + "</div>" +
        '<div class="opts" id="opts">' + opts.map((oi, idx) => {
          const correct = oi === q.a;
          let cls = "opt";
          if (revealed) {
            cls += " dis";
            if (correct) cls += " correct";
            else if (picked === oi) cls += " wrong";
          } else if (picked === oi) cls += " sel";
          return '<button class="' + cls + '" data-oi="' + oi + '"><span class="k">' + LETTERS[idx] + '</span><span class="tx">' + md(q.o[oi]) + "</span></button>";
        }).join("") + "</div>" +

        (revealed ? renderExpl(q) : "") +

        '<div class="between" style="margin-top:16px">' +
          '<button class="btn ghost" data-act="prev"' + (PR.i === 0 ? " disabled" : "") + ">← 上一題</button>" +
          '<div class="btn-row">' +
            (revealed ? "" : '<button class="btn primary" data-act="' + (isExam ? "examNext" : "submit") + '"' + (picked == null ? " disabled" : "") + ">" +
              (isExam ? (PR.i === PR.list.length - 1 ? "完成" : "下一題 →") : "確認答案") + "</button>") +
            (revealed ? '<button class="btn primary" data-act="next">' + (PR.i === PR.list.length - 1 ? (PR._reviewMode ? "返回成績" : "查看成績") : "下一題 →") + "</button>" : "") +
          "</div>" +
        "</div>" +
      "</div>";

    $("#opts").addEventListener("click", (e) => {
      const b = e.target.closest(".opt"); if (!b || PR.revealed[q.id]) return;
      PR.answers[q.id] = Number(b.dataset.oi);
      $$("#opts .opt").forEach((x) => x.classList.toggle("sel", Number(x.dataset.oi) === Number(b.dataset.oi)));
      const sb = $('[data-act="submit"], [data-act="examNext"]'); if (sb) sb.disabled = false;
    });
  }

  function renderExpl(q) {
    const dl = Math.max(0, permFor(q).indexOf(q.a));
    return '<div class="expl"><div class="eh">✓ 答案：' + LETTERS[dl] + "　·　" + esc(q.o[q.a]).slice(0, 60) + "</div>" +
      '<div class="eb">' + md(q.why || "") + "</div>" +
      (q.ref ? '<div class="src">參考：' + esc(q.ref) + (q.note ? "　—　" + esc(q.note) : "") + "</div>" : "") +
      "</div>";
  }

  function submitPractice() {
    const q = PR.list[PR.i];
    if (PR.answers[q.id] == null) return;
    PR.revealed[q.id] = true;
    recordAttempt(q.id, PR.answers[q.id] === q.a);
    runPractice();
  }
  function examNext() {
    const q = PR.list[PR.i];
    if (PR.answers[q.id] == null) return;
    recordAttempt(q.id, PR.answers[q.id] === q.a);
    if (PR.i >= PR.list.length - 1) return practiceSummary();
    PR.i++; runPractice();
  }
  function reviewAll() {
    PR.list.forEach((q) => { PR.revealed[q.id] = true; });
    PR._reviewMode = true; PR.finished = false; PR.i = 0;
    runPractice();
  }
  function nextPractice() {
    if (PR.i >= PR.list.length - 1) return practiceSummary();
    PR.i++; runPractice();
  }

  function practiceSummary() {
    const list = PR.list;
    let right = 0;
    list.forEach((q) => { if (PR.answers[q.id] === q.a) right++; });
    const pct = Math.round(right / list.length * 100);
    const byPart = {};
    list.forEach((q) => {
      const p = partOf(q);
      byPart[p] = byPart[p] || { n: 0, r: 0 };
      byPart[p].n++; if (PR.answers[q.id] === q.a) byPart[p].r++;
    });
    const wrong = list.filter((q) => PR.answers[q.id] !== q.a);

    $("#pageTitle").textContent = "練習結果";
    $("#view").innerHTML =
      '<div class="card pad" style="text-align:center">' +
        '<div style="font-size:13px;color:var(--muted);letter-spacing:.1em">正確率</div>' +
        '<div style="font-size:44px;font-weight:800;color:' + (pct >= 60 ? "var(--green)" : "var(--red)") + '">' + pct + "%</div>" +
        '<div class="sub">' + right + " / " + list.length + " 題答對" + (pct >= 60 ? "　✔ 已達合格水平" : "　▲ 未達 60%") + "</div>" +
        '<div class="btn-row" style="justify-content:center;margin-top:14px">' +
          '<button class="btn primary" data-act="retryWrong">重練答錯的 ' + wrong.length + " 題</button>" +
          (wrong.length ? '<button class="btn" data-act="reviewAll">逐題檢視答案</button>' : "") +
          '<a class="btn" href="#/practice">重新選擇範圍</a>' +
          (wrong.length ? '<a class="btn ghost" href="#/notes/part/' + partOf(wrong[0]) + '">回去讀筆記</a>' : "") +
        "</div>" +
      "</div>" +
      '<div class="grid g2" style="margin-top:14px">' +
        '<div class="card pad"><h3 style="font-size:15px;margin-bottom:10px">各部份表現</h3>' +
          Object.keys(byPart).sort().map((p) => {
            const v = byPart[p], pc = Math.round(v.r / v.n * 100);
            return '<div style="margin-bottom:10px"><div class="between small"><span>第 ' + p + " 部份</span><span class=\"num muted\">" + v.r + "/" + v.n + "（" + pc + "%）</span></div>" +
              '<div class="bar"><i style="width:' + pc + '%;background:' + (pc >= 60 ? "var(--green)" : "var(--red)") + '"></i></div></div>';
          }).join("") + "</div>" +
        '<div class="card pad"><h3 style="font-size:15px;margin-bottom:10px">需要重溫</h3>' +
          (wrong.length ? wrong.slice(0, 8).map((q) =>
            '<a href="#/notes/part/' + partOf(q) + '" class="row" style="padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink)">' +
            '<span class="pill red" style="flex:0 0 auto">' + esc(q.ref || "") + "</span>" +
            '<span class="small" style="flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">' + esc(q.q.slice(0, 46)) + "…</span></a>").join("")
            : '<div class="empty" style="padding:20px"><div class="big">✓</div>全部正確</div>') +
        "</div>" +
      "</div>";

    PR.finished = true;
    $('[data-act="retryWrong"]').onclick = () => {
      PR = { mode: PR.mode, shuffle: PR.shuffle, list: wrong, i: 0, answers: {}, revealed: {}, startTs: Date.now() };
      runPractice();
    };
  }

  /* ------------------------------ 模擬考試 ------------------------------ */
  let MK = null;

  function viewMockSetup() {
    $("#view").innerHTML =
      '<div class="card pad"><h2 style="font-size:19px">模擬考試</h2>' +
      '<p class="sub" style="margin-top:4px">完全依照真實考試結構：第 1 部份 30 條獨立試題（每題 2 分，共 60 分）；第 2 部份 20 條試題（每題 2 分，共 40 分），以一至兩個個案（含土地查冊文件）為基礎。限時 3 小時。</p>' +
      '<div class="callout warn" style="margin-top:10px"><div class="ct">▲ 合格準則</div>總分達 60% <b>且</b> 第 1 部份 ≥ 36 分 <b>且</b> 第 2 部份 ≥ 24 分。任何一部份不達標即屬不合格。</div></div>' +
      '<div class="grid g2" style="margin-top:14px">' +
      (MOCKS.length ? MOCKS.map((m, i) => {
        const done = S.mocks.filter((x) => x.id === m.id);
        const best = done.length ? Math.max.apply(null, done.map((x) => x.total)) : null;
        return '<div class="card pad hov"><div class="between"><div><div class="pill">模擬卷 ' + (i + 1) + "</div>" +
          '<h3 style="font-size:15px;margin-top:6px">' + esc(m.title) + "</h3>" +
          '<div class="tiny muted">' + esc(m.desc || "") + "</div></div>" +
          (best != null ? '<div style="text-align:right"><div style="font-size:22px;font-weight:800" class="num">' + best + '</div><div class="tiny muted">最佳成績</div></div>' : "") +
          "</div>" +
          '<div class="btn-row" style="margin-top:12px"><button class="btn primary" data-act="startMock" data-id="' + m.id + '">開始（180 分鐘）</button>' +
          (done.length ? '<span class="tiny muted">已完成 ' + done.length + " 次</span>" : "") + "</div></div>";
      }).join("") : '<div class="empty" style="grid-column:1/-1">模擬卷載入中…</div>') +
      "</div>" +
      '<div class="card pad" style="margin-top:14px"><h3 style="font-size:15px;margin-bottom:8px">作答介面說明</h3>' +
        '<ul class="small" style="padding-left:20px;margin:0"><li>上方有計時器與答題卡；可按「標記」把題目標為待覆核（答題卡顯示黃色）。</li>' +
        "<li>時間到會自動交卷；亦可隨時按「交卷」。</li>" +
        "<li>交卷後即時計分，並逐題顯示答案與解釋。</li></ul></div>";

    $$('[data-act="startMock"]').forEach((b) => b.onclick = () => {
      modal('<h3 style="font-size:17px">開始模擬考試？</h3><p class="sub small" style="margin-top:6px">計時 180 分鐘即時開始，中途離開頁面計時不會停止。建議找一段完整時間作答。</p>' +
        '<div class="btn-row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" data-act="closeModal">取消</button>' +
        '<button class="btn primary" data-act="go" data-id="' + b.dataset.id + '">開始</button></div>');
      $('[data-act="go"]').onclick = () => { closeModal(); startMock(b.dataset.id); };
    });
  }

  function startMock(id) {
    const m = MOCKS.find((x) => x.id === id);
    if (!m) return;
    const p1 = m.part1.map((q, i) => Object.assign({ _mock: true, _no: i + 1, _sect: "p1" }, q));
    const p2 = (m.part2 && m.part2.qs || []).map((q, i) => Object.assign({ _mock: true, _no: p1.length + i + 1, _sect: "p2" }, q, q.id ? {} : { id: id + "-p2-" + (i + 1) }));
    MK = {
      id: id, title: m.title, case: m.part2 && m.part2.case,
      list: p1.concat(p2), answers: {}, flags: {}, i: 0,
      endAt: Date.now() + 180 * 60 * 1000, secs: 180 * 60, ts: Date.now()
    };
    runMock();
    MK._t = setInterval(() => {
      if (!MK) return;
      MK.secs = Math.round((MK.endAt - Date.now()) / 1000);
      const t = $("#mkTimer");
      if (t) {
        t.textContent = fmtClock(MK.secs);
        t.className = "timer" + (MK.secs < 300 ? " danger" : MK.secs < 900 ? " warn" : "");
      }
      if (MK.secs <= 0) { toast("時間到，自動交卷"); submitMock(); }
    }, 1000);
  }

  function runMock() {
    if (!MK) { location.hash = "#/mock"; return; }
    const q = MK.list[MK.i];
    const picked = MK.answers[q._no];
    $("#pageTitle").textContent = "模擬考試";
    $("#pageCrumb").textContent = q._sect === "p1" ? "第 1 部份 · 獨立試題" : "第 2 部份 · 個案分析";
    const caseHtml = (q._sect === "p2" && MK.case) ? renderCaseBrief(MK.case) : "";

    $("#view").innerHTML =
      '<div class="exambar">' +
        '<div><div class="tiny muted">剩餘時間</div><div class="timer" id="mkTimer">' + fmtClock(MK.secs) + "</div></div>" +
        '<div style="width:1px;height:30px;background:var(--line)"></div>' +
        '<div><div class="tiny muted">題目</div><div class="num" style="font-weight:700">' + q._no + " / " + MK.list.length + "</div></div>" +
        '<div><div class="tiny muted">已作答</div><div class="num" style="font-weight:700">' + Object.keys(MK.answers).length + "</div></div>" +
        '<span class="spacer"></span>' +
        '<button class="btn sm" data-act="flag">' + (MK.flags[q._no] ? "★ 已標記" : "☆ 標記") + "</button>" +
        '<button class="btn sm" data-act="sheet">答題卡</button>' +
        '<button class="btn sm primary" data-act="submitMock">交卷</button>' +
      "</div>" +
      caseHtml +
      '<div class="card pad">' +
        '<div class="qhead"><span class="pill ' + (q._sect === "p1" ? "" : "violet") + '">' + (q._sect === "p1" ? "第 1 部份" : "第 2 部份") + "</span>" +
        '<span class="pill gray">第 ' + q._no + ' 題</span><span class="spacer"></span><span class="tiny muted">每題 2 分</span></div>' +
        '<div class="qtext">' + md(q.q) + "</div>" +
        '<div class="opts" id="opts">' + permFor(q).map((o, oi) =>

    if (!MK) return;
    const answered = Object.keys(MK.answers).length;
    if (answered < MK.list.length && MK.secs > 0) {
      modal('<h3 style="font-size:17px">確定交卷？</h3><p class="sub small" style="margin-top:6px">尚有 <b>' + (MK.list.length - answered) + " 題</b>未作答，未作答會以 0 分計算。</p>" +

        '<button class="btn primary" data-act="confirmSubmit">確定交卷</button></div>');
      $('[data-act="confirmSubmit"]').onclick = () => { closeModal(); doSubmitMock(); };
      return;
    }
    doSubmitMock();
  }

  function doSubmitMock() {
    closeModal();
    clearInterval(MK._t);
    let p1 = 0, p2 = 0;
    MK.list.forEach((q) => {
      const ok = q.a !== undefined ? MK.answers[q._no] === q.a : false;
      if (ok) { if (q._sect === "p1") p1 += 2; else p2 += 2; }
      recordAttempt(q.id || ("mock:" + MK.id + ":" + q._no), ok);
    });
    const total = p1 + p2;
    const pass = total >= 60 && p1 >= 36 && p2 >= 24;
    const rec = { id: MK.id, ts: MK.ts, score: total, p1: p1, p2: p2, total: total, pass: pass, secs: 180 * 60 - Math.max(0, MK.secs) };
    S.mocks.push(rec); save();
    const done = MK;
    showMockResult(done, rec);
  }

  function showMockResult(mk, rec) {
    const p1q = mk.list.filter((q) => q._sect === "p1");
    const p2q = mk.list.filter((q) => q._sect === "p2");
    const right = mk.list.filter((q) => rec && mk.answers[q._no] === q.a).length;
    $("#pageTitle").textContent = "模擬考試結果";
    $("#view").innerHTML =
      '<div class="card pad" style="text-align:center">' +
        '<div class="pill ' + (rec.pass ? "green" : "red") + '">' + (rec.pass ? "合格 PASS" : "未合格 FAIL") + "</div>" +
        '<div style="font-size:52px;font-weight:800;margin-top:6px" class="num">' + rec.total + '<span style="font-size:20px;color:var(--muted)"> / 100</span></div>' +
        '<div class="grid g3" style="margin-top:14px;text-align:left">' +
          mockScoreCard("第 1 部份", rec.p1, 60, 36, "30 題 × 2 分") +
          mockScoreCard("第 2 部份", rec.p2, 40, 24, "20 題 × 2 分") +
          mockScoreCard("總分", rec.total, 100, 60, "60% 合格") +
        "</div>" +
        '<div class="btn-row" style="justify-content:center;margin-top:16px">' +
          '<button class="btn primary" data-act="review">逐題檢討</button>' +
          '<a class="btn" href="#/mock">再做一卷</a>' +
          '<a class="btn ghost" href="#/stats">學習紀錄</a>' +
        "</div>" +
        '<p class="tiny muted" style="margin-top:10px">用時 ' + fmtClock(rec.secs) + "　·　答對 " + right + " / " + mk.list.length + " 題</p>" +
      "</div>" +
      '<div class="grid g2" style="margin-top:14px">' +
        '<div class="card pad"><h3 style="font-size:15px;margin-bottom:8px">弱項分析</h3>' + weakFromList(mk.list, mk.answers) + "</div>" +
        '<div class="card pad"><h3 style="font-size:15px;margin-bottom:8px">下一步</h3>' +
          '<ul class="small" style="padding-left:20px;margin:0"><li>逐題檢討，特別是<b>答錯</b>與<b>猜對</b>的題目。</li>' +
          "<li>把答錯題目對應的筆記章節重讀一次（下方已列出）。</li><li>48 小時後再做同一份卷，確認記憶已鞏固。</li></ul></div>" +
      "</div>";
    $('[data-act="review"]').onclick = () => reviewMock(mk, 0);
    mk._rec = rec;
  }

  function mockScoreCard(t, v, max, passLine, note) {
    const ok = v >= passLine;
    return '<div class="card stat"><div class="k">' + t + '</div><div class="v" style="color:' + (ok ? "var(--green)" : "var(--red)") + '">' + v +
      '<span style="font-size:14px;color:var(--muted)"> / ' + max + '</span></div><div class="d">合格線 ' + passLine + " 分 · " + note + "</div></div>";
  }
  function weakFromList(list, answers) {
    const by = {};
    list.forEach((q) => {
      const p = q.p || (q._sect === "p2" ? 7 : 1);
      by[p] = by[p] || { n: 0, r: 0 };
      by[p].n++; if (answers[q._no] === q.a) by[p].r++;
    });
    return Object.keys(by).sort().map((p) => {
      const v = by[p], pc = Math.round(v.r / v.n * 100);
      return '<div style="margin-bottom:9px"><div class="between small"><span>第 ' + p + " 部份 · " + esc(PART_TITLE[p] || "") + '</span><span class="num muted">' + v.r + "/" + v.n + "</span></div>" +
        '<div class="bar"><i style="width:' + pc + '%;background:' + (pc >= 60 ? "var(--green)" : "var(--red)") + '"></i></div></div>';
    }).join("");
  }

  function reviewMock(mk, i) {
    const q = mk.list[i];
    if (!q) return;
    const picked = mk.answers[q._no];
    const ok = picked === q.a;

    $("#view").innerHTML =
      '<div class="card pad">' +
        '<div class="qhead"><span class="pill ' + (ok ? "green" : "red") + '">' + (ok ? "正確" : picked == null ? "未作答" : "錯誤") + "</span>" +
        '<span class="pill gray">第 ' + q._no + ' 題</span><span class="pill ' + (q._sect === "p1" ? "" : "violet") + '">' + (q._sect === "p1" ? "第 1 部份" : "第 2 部份") + "</span>" +
        '<span class="spacer"></span><a class="btn sm ghost" href="#/notes/part/' + (q.p || 1) + '">相關筆記 →</a></div>' +
        '<div class="qtext">' + md(q.q) + "</div>" +
        '<div class="opts">' + permFor(q).map((oi, idx) => {
          let cls = "opt dis";
          if (oi === q.a) cls += " correct";

          return '<div class="' + cls + '"><span class="k">' + LETTERS[idx] + '</span><span class="tx">' + md(q.o[oi]) + "</span></div>";
        }).join("") + "</div>" +
        renderExpl(q) +
        '<div class="between" style="margin-top:16px">' +
          '<button class="btn ghost" data-act="rvPrev"' + (i === 0 ? " disabled" : "") + ">← 上一題</button>" +
          '<div class="btn-row"><span class="tiny muted num">' + (i + 1) + " / " + mk.list.length + "</span>" +
          '<button class="btn primary" data-act="rvNext"' + (i === mk.list.length - 1 ? " disabled" : "") + ">下一題 →</button></div>" +
        "</div>" +
      "</div>";
    $('[data-act="rvPrev"]').onclick = () => reviewMock(mk, i - 1);
    $('[data-act="rvNext"]').onclick = () => reviewMock(mk, i + 1);

    $$("#docQ > .card").forEach((card, i) => {
      const q = d.qs[i];

      card.querySelector(".opts").addEventListener("click", (e) => {
        const b = e.target.closest(".opt"); if (!b || card.dataset.done) return;
        card.dataset.done = "1";

        $$(".opt", card).forEach((x) => {
          x.classList.add("dis");

          else if (oi === pick) x.classList.add("wrong");

        const ex = card.querySelector(".ex");
        ex.style.display = "";

        recordAttempt("ls:" + d.id + ":" + i, pick === q.a);

  // 現行住宅稅階（稅務局，2025/2026 年起）
  function avdNew(p) {
    if (p <= 4000000) return { d: 100, label: "$100 定額（不超過 $4,000,000）" };
    if (p <= 4323780) return { d: 100 + (p - 4000000) * 0.20, label: "$100 ＋ 超出 $4,000,000 的 20%" };
    if (p <= 4500000) return { d: p * 0.015, label: "1.5%" };
    if (p <= 4935480) return { d: 67500 + (p - 4500000) * 0.10, label: "$67,500 ＋ 超出 $4,500,000 的 10%" };
    if (p <= 6000000) return { d: p * 0.0225, label: "2.25%" };
    if (p <= 6642860) return { d: 135000 + (p - 6000000) * 0.10, label: "$135,000 ＋ 超出 $6,000,000 的 10%" };
    if (p <= 9000000) return { d: p * 0.03, label: "3%" };
    if (p <= 10080000) return { d: 270000 + (p - 9000000) * 0.10, label: "$270,000 ＋ 超出 $9,000,000 的 10%" };
    if (p <= 20000000) return { d: p * 0.0375, label: "3.75%" };
    if (p <= 21739120) return { d: 750000 + (p - 20000000) * 0.10, label: "$750,000 ＋ 超出 $20,000,000 的 10%" };
    if (p <= 100000000) return { d: p * 0.0425, label: "4.25%" };
    if (p <= 109574470) return { d: 4250000 + (p - 100000000) * 0.30, label: "$4,250,000 ＋ 超出 $100,000,000 的 30%" };
    return { d: p * 0.065, label: "6.5%" };
  }
  // 非住宅物業：Scale 3（2026 年起；最高 4.25%，不設 $1 億以上的高稅率段）
  function avdScale3(p) {
    if (p > 21739120) return { d: p * 0.0425, label: "4.25%" };
    return avdNew(p);
  }
  // 《考試手冊》附錄三所載（2025 年 2 月前）稅階
  function avdOld(p) {    if (p <= 3000000) return { d: 100, label: "$100 定額（不超過 $3,000,000）" };
    if (p <= 3528240) return { d: 100 + (p - 3000000) * 0.10, label: "$100 ＋ 超出 $3,000,000 的 10%" };
    if (p <= 4500000) return { d: p * 0.015, label: "1.5%" };
    if (p <= 4935480) return { d: 67500 + (p - 4500000) * 0.10, label: "$67,500 ＋ 超出 $4,500,000 的 10%" };
    if (p <= 6000000) return { d: p * 0.0225, label: "2.25%" };
    if (p <= 6642860) return { d: 135000 + (p - 6000000) * 0.10, label: "$135,000 ＋ 超出 $6,000,000 的 10%" };
    if (p <= 9000000) return { d: p * 0.03, label: "3%" };
    if (p <= 10080000) return { d: 270000 + (p - 9000000) * 0.10, label: "$270,000 ＋ 超出 $9,000,000 的 10%" };
    if (p <= 20000000) return { d: p * 0.0375, label: "3.75%" };
    if (p <= 21739120) return { d: 750000 + (p - 20000000) * 0.10, label: "$750,000 ＋ 超出 $20,000,000 的 10%" };
    return { d: p * 0.0425, label: "4.25%" };

  const roundUp100 = (x) => Math.ceil(x / 100) * 100;

  /* ---------- 租約印花稅：按租金總額／平均年租計算 ---------- */
  function leaseCalc(o) {
    const months = Math.max(0, (o.years || 0) * 12 + (o.months || 0));
    const payable = Math.max(0, months - (o.free || 0));
    let m2 = Math.max(0, Math.min(o.m2 || 0, payable));
    let m1 = payable - m2;
    const total = (o.r1 || 0) * m1 + (o.r2 || 0) * m2;
    const years = months / 12;
    const avg = years > 0 ? total / years : 0;
    let rate, basis, basisLabel;
    if (o.uncertain) { rate = 0.0025; basis = roundUp100(avg); basisLabel = "平均年租 " + fmtMoney(basis) + " × 0.25%"; }
    else if (months <= 12) { rate = 0.0025; basis = roundUp100(total); basisLabel = "租金總額 " + fmtMoney(basis) + " × 0.25%"; }
    else if (months <= 36) { rate = 0.005; basis = roundUp100(avg); basisLabel = "平均年租 " + fmtMoney(basis) + " × 0.5%"; }
    else { rate = 0.01; basis = roundUp100(avg); basisLabel = "平均年租 " + fmtMoney(basis) + " × 1%"; }
    const duty = Math.ceil(basis * rate);
    const copies = Math.max(0, o.copies || 0) * 5;
    return {
      months, payable, m1, m2, total, years, avg,
      basis, basisLabel, rate, duty, copies, sum: duty + copies
    };
  }
  function fmtMoney(n) {
    return "HK$ " + Math.round(n).toLocaleString("en-HK");
  }
  function fmtMoney2(n) {
    const v = Math.round(n * 100) / 100;
    const opts = v % 1 ? { minimumFractionDigits: 2, maximumFractionDigits: 2 } : {};
    return "HK$ " + v.toLocaleString("en-HK", opts);
  }

      if (docMode === "multi") {
        list.forEach((x) => {
          const r = (x.t === "res" ? scaleRes : scaleNon)(x.p);
          rows.push({ n: TYPE_LABEL[x.t] + "（獨立文書）", b: x.p, t: r.label, d: Math.ceil(r.d) });
        });
      } else if (docMode === "one" || ($("#avdJoin").checked && hasRes && hasNon)) {
        const base = sum(list);
        const r = (hasRes ? scaleRes : scaleNon)(base);
        rows.push({ n: hasRes ? "整份文書（以總代價計，含住宅）" : "整份文書（非住宅）", b: base, t: r.label, d: Math.ceil(r.d) });
      } else {
        const base = sum(list);
        if (hasRes) {
          const rAll = scaleRes(base);
          const eff = base > 0 ? rAll.d / base : 0;
          const bRes = sum(list.filter((x) => x.t === "res"));
          rows.push({ n: "住宅部分", b: bRes, t: (eff * 100).toFixed(4).replace(/\.?0+$/, "") + "%（按整份文書 " + fmtMoney(base) + " 定稅率）", d: Math.ceil(bRes * eff) });
        }
        if (hasNon) {
          const rAll = scaleNon(base);
          const eff = base > 0 ? rAll.d / base : 0;
          const bNon = sum(list.filter((x) => x.t !== "res"));
          rows.push({ n: "非住宅部分（車位／商舖／寫字樓等）", b: bNon, t: (eff * 100).toFixed(4).replace(/\.?0+$/, "") + "%（按整份文書 " + fmtMoney(base) + " 定稅率）", d: Math.ceil(bNon * eff) });
        }
      }
      const total = rows.reduce((s, r) => s + r.d, 0);
      const base = sum(list);
      $("#avdOut").textContent = fmtMoney(total);
      $("#avdRate").textContent = (docMode === "multi" ? "分開 " + list.length + " 份文書" : docMode === "split" ? "分拆計算（稅率按總代價）" : "合併計算（以總代價）") +
        "　·　總代價 " + fmtMoney(base) + "　·　實繳 " + (base ? (total / base * 100).toFixed(2) : "0.00") + "%";
      $("#avdRows").innerHTML = rows.map((r) =>
        "• " + r.n + "：" + fmtMoney(r.b) + " × " + r.t + " ＝ <b>" + fmtMoney(r.d) + "</b>").join("<br>");
    };

    renderItems();
    $("#avdItems").addEventListener("input", (e) => {
      const el = e.target.closest("[data-i]"); if (!el) return;
      const i = Number(el.dataset.i);
      if (el.dataset.k === "p") items[i].p = Number(el.value) || 0;
      upAvd();
    });
    $("#avdItems").addEventListener("change", (e) => {
      const el = e.target.closest("[data-i]"); if (!el) return;
      const i = Number(el.dataset.i);
      if (el.dataset.k === "t") { items[i].t = el.value; upAvd(); }
    });
    $("#avdItems").addEventListener("click", (e) => {
      const b = e.target.closest("[data-del]"); if (!b) return;
      items.splice(Number(b.dataset.del), 1); renderItems(); upAvd();
    });
    $("#avdAdd").onclick = () => { items.push({ t: "car", p: 1000000 }); renderItems(); upAvd(); };
    $("#avdJoin").addEventListener("change", upAvd);
    $("#avdDoc").addEventListener("click", (e) => {
      const b = e.target.closest("[data-doc]"); if (!b) return;
      docMode = b.dataset.doc;
      $$("#avdDoc .chip").forEach((x) => x.classList.toggle("on", x === b));
      upAvd();
    });
    const upLease = () => {
      const years = Number($("#ly").value) || 0;
      const months = Number($("#lm").value) || 0;
      const free = Number($("#lf").value) || 0;
      const copies = Number($("#lc").value) || 0;
      const r1 = Number($("#lr1").value) || 0;
      const r2 = Number($("#lr2").value) || 0;
      const m2 = Number($("#lm2").value) || 0;
      const m1In = $("#lm1").value;
      const payable = Math.max(0, years * 12 + months - free);
      const auto1 = Math.max(0, payable - Math.min(m2, payable));
      const calc = leaseCalc({ years, months, free, r1, r2, m2, copies, uncertain: $("#lunc").checked });
      // 若首段月數有指定，覆寫計算
      if (m1In !== "" && !isNaN(Number(m1In))) {
        const m1 = Math.max(0, Number(m1In));
        calc.m1 = m1; calc.m2 = Math.min(m2, payable);
        calc.total = r1 * m1 + r2 * calc.m2;
        calc.years = (years * 12 + months) / 12;
        calc.avg = calc.years > 0 ? calc.total / calc.years : 0;
        const mm = years * 12 + months;
        let rate, basis;
        if ($("#lunc").checked) { rate = 0.0025; basis = roundUp100(calc.avg); }
        else if (mm <= 12) { rate = 0.0025; basis = roundUp100(calc.total); }
        else if (mm <= 36) { rate = 0.005; basis = roundUp100(calc.avg); }
        else { rate = 0.01; basis = roundUp100(calc.avg); }
        calc.rate = rate; calc.basis = basis;
        calc.duty = Math.ceil(basis * rate);
        calc.copies = copies * 5;
        calc.sum = calc.duty + calc.copies;
        calc.basisLabel = (mm <= 12 && !$("#lunc").checked ? "租金總額 " : "平均年租 ") + fmtMoney(basis) + " × " + (rate * 100) + "%";
      }
      if (!calc.months) {
        $("#leaseOut").textContent = "—"; $("#leaseRate").textContent = "請輸入租期"; $("#leaseBreak").innerHTML = "";
        return;
      }
      $("#leaseOut").textContent = $("#lhalf").checked ? fmtMoney2(calc.sum / 2) : fmtMoney(calc.sum);
      $("#leaseRate").textContent = (calc.rate * 100) + "% 　·　" + (calc.uncertain ? "租期不固定" : calc.months + " 個月") +
        ($("#lhalf").checked ? "　·　總額 " + fmtMoney(calc.sum) + "（各半）" : "");
      const shortTerm = (calc.months <= 12) && !calc.uncertain;
      const rawDuty = calc.basis * calc.rate;
      $("#leaseBreak").innerHTML =
        "租金總額：" + fmtMoney(calc.total) +
        "（首段 " + calc.m1 + " 個月" + (calc.m2 ? " ＋ 次段 " + calc.m2 + " 個月" : "") + "；免租 " + free + " 個月）<br>" +
        "租期：<b>" + (calc.years).toFixed(2) + " 年</b>（" + calc.months + " 個月）<br>" +
        (shortTerm
          ? "計稅基準：租金總額 " + fmtMoney(calc.basis) + "（已調高至最接近 $100）<br>"
          : "平均年租：" + fmtMoney(calc.avg) + " → 調高至 " + fmtMoney(calc.basis) + "<br>") +
        "印花稅：" + (Math.abs(rawDuty - calc.duty) > 0.001
          ? fmtMoney2(rawDuty) + " → 不足 $1 作 $1 ＝ <b>" + fmtMoney(calc.duty) + "</b>"
          : "<b>" + fmtMoney(calc.duty) + "</b>") +
        "（" + (shortTerm ? "租金總額" : "平均年租") + " × " + (calc.rate * 100) + "%）" +
        (calc.copies ? "　＋ 副本 " + fmtMoney(calc.copies) : "") +
        "<br>應繳總額：<b>" + fmtMoney(calc.sum) + "</b>" +
        "<br>如業主與租客平均分擔：每位 <b>" + fmtMoney2(calc.sum / 2) + "</b>";
      // 自動首段月數提示
      if (m1In === "") $("#lm1").placeholder = "自動：" + auto1;
    };
    $("#avdTable").addEventListener("click", (e) => {
      const b = e.target.closest("[data-avd]"); if (!b) return;
      avdMode = b.dataset.avd;
      $$("#avdTable .chip").forEach((x) => x.classList.toggle("on", x === b));
      upAvd();
    });
    ["ly", "lm", "lf", "lc", "lr1", "lr2", "lm2", "lm1", "lunc", "lhalf"].forEach((id) => {
      const el = $("#" + id); if (!el) return;
      el.addEventListener("input", upLease); el.addEventListener("change", upLease);
    });
    upAvd(); upLease();
  }

  function toolVal() {

        "物業估價屬<b>第 1 級「初步認識」</b>，考試會考<b>概念</b>與<b>簡單計算</b>（例如以資本化率求價值、餘值法求地價），不會要求專業估價報告的細節。以下四個計算是考試最常見的類型。</div>" +

          '<p class="tiny muted" style="margin-bottom:10px">價值 ＝ 淨租金收入 ÷ 資本化率　<span class="en">(income capitalisation)</span></p>' +
          '<div class="grid g2" style="gap:8px 10px">' +
            '<div><label class="tiny muted">每月租金（HK$）</label><input id="vRent" type="number" value="50000" step="1000"></div>' +
            '<div><label class="tiny muted">空置及支出（%）</label><input id="vOut" type="number" value="20" step="1"></div>' +
            '<div><label class="tiny muted">資本化率（%）</label><input id="vCap" type="number" value="4" step="0.25"></div>' +
            '<div><label class="tiny muted">回報基準</label><select id="vBasis"><option value="net">淨租金</option><option value="gross">毛租金</option></select></div>' +
          "</div>" +
          '<div class="stat" style="padding:12px 0 0"><div class="k">估值</div><div class="v" id="vOut1">—</div><div class="d" id="vWork1">—</div></div>' +
        "</div>" +

        '<div class="card pad"><h3 style="font-size:15px;margin-bottom:4px">② 直接比較法</h3>' +
          '<p class="tiny muted" style="margin-bottom:10px">先求成交呎價，再按面積調整　<span class="en">(direct comparison)</span></p>' +
          '<div class="grid g2" style="gap:8px 10px">' +
            '<div><label class="tiny muted">比較成交價（HK$）</label><input id="cPrice" type="number" value="6000000" step="100000"></div>' +
            '<div><label class="tiny muted">比較面積（呎）</label><input id="cArea" type="number" value="600" step="10"></div>' +
            '<div><label class="tiny muted">目標面積（呎）</label><input id="tArea" type="number" value="650" step="10"></div>' +
            '<div><label class="tiny muted">調整（%）</label><input id="cAdj" type="number" value="0" step="1"></div>' +
          "</div>" +
          '<div class="stat" style="padding:12px 0 0"><div class="k">估值</div><div class="v" id="vOut2">—</div><div class="d" id="vWork2">—</div></div>' +
        "</div>" +

        '<div class="card pad"><h3 style="font-size:15px;margin-bottom:4px">③ 餘值法（地盤）</h3>' +
          '<p class="tiny muted" style="margin-bottom:10px">地價 ＝ 完成後價值 － 建築成本 － 費用 － 利潤　<span class="en">(residual method)</span></p>' +
          '<div class="grid g2" style="gap:8px 10px">' +
            '<div><label class="tiny muted">發展完成後總值（HK$）</label><input id="rGdv" type="number" value="100000000" step="1000000"></div>' +
            '<div><label class="tiny muted">建築成本（HK$）</label><input id="rCost" type="number" value="40000000" step="1000000"></div>' +
            '<div><label class="tiny muted">專業費及利息（HK$）</label><input id="rFee" type="number" value="10000000" step="500000"></div>' +
            '<div><label class="tiny muted">發展商利潤（% 總值）</label><input id="rProfit" type="number" value="20" step="1"></div>' +
          "</div>" +
          '<div class="stat" style="padding:12px 0 0"><div class="k">地盤價值</div><div class="v" id="vOut3">—</div><div class="d" id="vWork3">—</div></div>' +
        "</div>" +

        '<div class="card pad"><h3 style="font-size:15px;margin-bottom:4px">④ 重置成本法</h3>' +
          '<p class="tiny muted" style="margin-bottom:10px">價值 ＝ 重建成本 ＋ 地價 － 折舊　<span class="en">(replacement cost)</span></p>' +
          '<div class="grid g2" style="gap:8px 10px">' +
            '<div><label class="tiny muted">重建成本（HK$）</label><input id="pCost" type="number" value="3000000" step="100000"></div>' +
            '<div><label class="tiny muted">地價（HK$）</label><input id="pLand" type="number" value="5000000" step="100000"></div>' +
            '<div><label class="tiny muted">樓齡（年）</label><input id="pAge" type="number" value="20" step="1"></div>' +
            '<div><label class="tiny muted">耐用年期（年）</label><input id="pLife" type="number" value="50" step="1"></div>' +
          "</div>" +
          '<div class="stat" style="padding:12px 0 0"><div class="k">估值</div><div class="v" id="vOut4">—</div><div class="d" id="vWork4">—</div></div>' +
        "</div>" +
      "</div>" +
      '<div class="card pad" style="margin-top:14px"><h3 style="font-size:15px;margin-bottom:8px">四種方法幾時用？</h3>' +
        '<table class="tb"><thead><tr><th>方法</th><th>適用</th><th>考試提示</th></tr></thead><tbody>' +
        '<tr><td><b>直接比較法</b></td><td>住宅、寫字樓等成交活躍的物業</td><td>用<b>成交價</b>而非叫價；記得按面積、樓層、景觀調整</td></tr>' +
        '<tr><td><b>投資計算法</b></td><td>有穩定租金的收租物業（商舖、寫字樓）</td><td>價值 ＝ 淨租金 ÷ 資本化率；資本化率越低，價值越高</td></tr>' +
        '<tr><td><b>利潤計算法</b></td><td>酒店、戲院、加油站等特殊用途</td><td>以<b>業務利潤</b>推算物業可承擔的租金</td></tr>' +
        '<tr><td><b>重置成本法</b></td><td>缺乏成交的特殊建築（學校、教堂、廠房）</td><td>重建成本 ＋ 地價 － 折舊；<b>不等於</b>投保價（投保價不含地價）</td></tr>' +
        '<tr><td><b>餘值法</b></td><td>未有成交的發展用地</td><td>由「建成後價值」倒扣成本及利潤，求出<b>土地</b>價值</td></tr>' +
        "</tbody></table></div>";

    const money = (n) => (n < 0 ? "-" : "") + "HK$ " + Math.abs(Math.round(n)).toLocaleString("en-HK");
    const upVal = () => {
      // ① 投資計算法
      const rent = Number($("#vRent").value) || 0;
      const outP = Number($("#vOut").value) || 0;
      const cap = (Number($("#vCap").value) || 0) / 100;
      const basis = $("#vBasis").value;
      const grossAnnual = rent * 12;
      const netAnnual = basis === "net" ? grossAnnual * (1 - outP / 100) : grossAnnual;
      const val1 = cap > 0 ? netAnnual / cap : 0;
      $("#vOut1").textContent = money(val1);
      $("#vWork1").textContent = (basis === "net" ? "淨" : "毛") + "年租 " + money(netAnnual) + " ÷ 資本化率 " + (cap * 100).toFixed(2) + "%";
      // ② 比較法
      const cp = Number($("#cPrice").value) || 0, ca = Number($("#cArea").value) || 0;
      const ta = Number($("#tArea").value) || 0, adj = (Number($("#cAdj").value) || 0) / 100;
      const psf = ca > 0 ? cp / ca : 0;
      const val2 = psf * ta * (1 + adj);
      $("#vOut2").textContent = money(val2);
      $("#vWork2").textContent = "成交呎價 " + money(psf) + "/呎 × " + ta + " 呎" + (adj ? " × (1" + (adj > 0 ? "+" : "") + (adj * 100).toFixed(1) + "%)" : "");
      // ③ 餘值法
      const gdv = Number($("#rGdv").value) || 0, cost = Number($("#rCost").value) || 0;
      const fee = Number($("#rFee").value) || 0, pf = (Number($("#rProfit").value) || 0) / 100;
      const profit = gdv * pf;
      const val3 = gdv - cost - fee - profit;
      $("#vOut3").textContent = money(val3);
      $("#vWork3").textContent = money(gdv) + " － 建築 " + money(cost) + " － 費用 " + money(fee) + " － 利潤 " + money(profit);
      // ④ 重置成本
      const pc = Number($("#pCost").value) || 0, pl = Number($("#pLand").value) || 0;
      const age = Number($("#pAge").value) || 0, life = Number($("#pLife").value) || 0;
      const dep = life > 0 ? Math.min(1, age / life) : 0;
      const val4 = pl + pc * (1 - dep);
      $("#vOut4").textContent = money(val4);
      $("#vWork4").textContent = "地價 " + money(pl) + " ＋ 重建 " + money(pc) + " × (1－折舊 " + (dep * 100).toFixed(0) + "%)";
    };
    ["vRent", "vOut", "vCap", "vBasis", "cPrice", "cArea", "tArea", "cAdj", "rGdv", "rCost", "rFee", "rProfit", "pCost", "pLand", "pAge", "pLife"]
      .forEach((id) => { const el = $("#" + id); if (el) { el.addEventListener("input", upVal); el.addEventListener("change", upVal); } });
    upVal();
  }

      ["5 個 / 8 個工作日", "一手住宅物業：買方須於簽署臨時合約後 5 個工作日內簽署買賣合約；買方如此做，擁有人須於 8 個工作日內簽署（第 621 章第 53 條）"],
      ["15 天", "租客欠租 15 天，業主可依《業主與租客（綜合）條例》第 126 條的隱含承諾沒收租賃權"],
      ["30 天", "租約簽立後須於 30 天內加蓋印花；逾期罰款最高為稅款的 10 倍"]
    ];
    $("#toolBody").innerHTML =
      '<div class="card pad"><h3 style="font-size:15px;margin-bottom:4px">數字速記</h3>' +
      '<p class="sub small">這些是選擇題最常見的「數字陷阱」。先背下來，再理解為甚麼是這個數字。</p></div>' +
      '<div class="grid g2" style="margin-top:14px">' +
      nums.map((n) => '<div class="card pad" style="display:flex;gap:14px;align-items:flex-start">' +
        '<div style="flex:0 0 auto;min-width:96px;font-weight:800;font-size:15px;color:var(--brand-ink)" class="num">' + esc(n[0]) + "</div>" +
        '<div class="small sub" style="flex:1">' + md(n[1]) + "</div></div>").join("") +
      "</div>";
  }

  /* ------------------------------ 學習紀錄 ------------------------------ */
  function viewStats() {
    const seen = BANK.filter((q) => S.stats[q.id] && S.stats[q.id].a).map((q) => q.id);
    const totalA = seen.reduce((s, k) => s + S.stats[k].a, 0);
    const totalC = seen.reduce((s, k) => s + S.stats[k].c, 0);
    const acc = totalA ? Math.round(totalC / totalA * 100) : 0;
    const wrongQ = BANK.filter((q) => { const st = S.stats[q.id]; return st && st.w > st.c; });

    $("#view").innerHTML =
      '<div class="grid g4">' +
        stat("已練習題目", seen.length + " / " + BANK.length, "覆蓋率 " + Math.round(seen.length / Math.max(1, BANK.length) * 100) + "%") +
        stat("總作答次數", totalA, "含重複練習") +
        stat("整體正確率", acc + "%", acc >= 60 ? "達合格水平" : "仍需努力") +
        stat("學習日數", (S.streak.days || []).length, "連續學習有助記憶") +
      "</div>" +
      '<div class="grid g2" style="margin-top:14px;align-items:start">' +
        '<div class="card pad"><h3 style="font-size:15px;margin-bottom:10px">各部份掌握度</h3>' +
          SYLLABUS.map((p) => {
            const m = partMastery(p.id);
            return '<div style="margin-bottom:11px"><div class="between small"><span>第 ' + p.id + " 部份 · " + esc(p.title) + '</span><span class="num muted">' + m.pct + "%</span></div>" +
              '<div class="bar"><i style="width:' + m.pct + '%"></i></div></div>';
          }).join("") + "</div>" +
        '<div class="card pad"><h3 style="font-size:15px;margin-bottom:10px">模擬考試紀錄</h3>' +
          (S.mocks.length ? '<table class="tb"><thead><tr><th>日期</th><th>總分</th><th>第1部</th><th>第2部</th><th></th></tr></thead><tbody>' +
            S.mocks.slice(-8).reverse().map((m) => "<tr><td>" + new Date(m.ts).toLocaleDateString("zh-HK") + "</td><td class=\"num\">" + m.total +
              "</td><td class=\"num\">" + m.p1 + "</td><td class=\"num\">" + m.p2 + '</td><td>' + (m.pass ? '<span class="pill green">合格</span>' : '<span class="pill red">未合格</span>') + "</td></tr>").join("") +
            "</tbody></table>" : '<div class="empty" style="padding:24px"><div class="big">📄</div>尚未有紀錄</div>') +
        "</div>" +
      "</div>" +
      '<div class="card pad" style="margin-top:14px"><div class="between"><h3 style="font-size:15px">待克服的題目（' + wrongQ.length + "）</h3>" +
        '<a class="btn sm" href="#/practice">去重練</a></div>' +
        (wrongQ.length ? '<div class="grid g2" style="margin-top:10px">' + wrongQ.slice(0, 12).map((q) =>
          '<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span class="pill red">第' + partOf(q) + '部</span>' +
          '<a class="small" style="flex:1;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap" href="#/notes/part/' + partOf(q) + '">' + esc(q.q.slice(0, 40)) + "…</a></div>").join("") + "</div>"
          : '<div class="empty" style="padding:20px"><div class="big">✓</div>暫無</div>') +
      "</div>";
  }

  /* ------------------------------ 設定 ------------------------------ */
  function viewSettings() {
    $("#view").innerHTML =
      '<div class="grid g2" style="align-items:start">' +
        '<div class="card pad"><h3 style="font-size:15px;margin-bottom:10px">考試日期</h3>' +
          '<input id="examDate" type="date" value="' + esc(S.settings.examDate || "") + '" style="padding:9px 12px;border:1px solid var(--line-2);border-radius:10px">' +
          '<p class="tiny muted" style="margin-top:8px">用於首頁倒數。以監管局公佈的考試日期為準。</p>' +
          '<div class="hr"></div><h3 style="font-size:15px;margin-bottom:10px">外觀</h3>' +
          '<div class="row"><span class="small">深色模式</span><span class="spacer"></span><button class="switch' + (S.settings.theme === "dark" ? " on" : "") + '" data-act="theme"></button></div>' +
        "</div>" +
        '<div class="card pad"><h3 style="font-size:15px;margin-bottom:10px">資料備份</h3>' +
          '<p class="small sub">學習紀錄只儲存在本機瀏覽器。換裝置前可先匯出備份。</p>' +
          '<div class="btn-row" style="margin-top:8px"><button class="btn" data-act="export">匯出 JSON</button>' +
          '<button class="btn" data-act="import">匯入</button>' +
          '<button class="btn danger" data-act="reset">清除全部紀錄</button></div>' +
          '<input type="file" id="fileIn" accept="application/json" style="display:none">' +
        "</div>" +
      "</div>" +
      '<div class="card pad" style="margin-top:14px"><h3 style="font-size:15px">關於本站</h3>' +
        '<p class="small sub" style="margin-top:6px">本溫習站按地產代理監管局《考試手冊》的八個內容綱要編排，法例內容摘錄自香港電子法律（e-Legislation）經核證文本，並以繁體中文撰寫；英文原詞以括號附註。土地查冊等英文文件保留原文。</p>' +
        '<p class="tiny muted">本網站為個人溫習用途，並非監管局的官方材料，亦非任何備試課程。考試細則以監管局及考試中心最新公佈為準。</p></div>';

    $("#examDate").addEventListener("change", (e) => { S.settings.examDate = e.target.value; save(); toast("已更新考試日期"); });
    $('[data-act="export"]').onclick = () => {
      const blob = new Blob([JSON.stringify(S, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "eaqe-progress-" + todayKey() + ".json";
      a.click();
      toast("已匯出");
    };
    $('[data-act="import"]').onclick = () => $("#fileIn").click();
    $("#fileIn").onchange = (e) => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => { try { const o = JSON.parse(r.result); S = Object.assign(S, o); save(); route(); toast("已匯入"); } catch (x) { toast("檔案格式有誤"); } };
      r.readAsText(f);
    };
    $('[data-act="reset"]').onclick = () => {
      modal('<h3 style="font-size:17px">清除全部學習紀錄？</h3><p class="sub small" style="margin-top:6px">所有練習統計、筆記已讀標記與模擬成績都會刪除，無法復原。</p>' +
        '<div class="btn-row" style="justify-content:flex-end;margin-top:16px"><button class="btn ghost" data-act="closeModal">取消</button>' +
        '<button class="btn danger" data-act="confirmReset">確定清除</button></div>');
      $('[data-act="confirmReset"]').onclick = () => {
        S = JSON.parse(JSON.stringify(DEFAULT_STORE)); save(); closeModal(); route(); toast("已清除");
      };
    };
  }

  /* ------------------------------ 搜索 ------------------------------ */
  function globalSearch(k) {
    if (!k) return;
    const q = k.toLowerCase();
    const hits = [];
    NOTES.forEach((n) => {
      const txt = (n.title + " " + JSON.stringify(n.blocks || [])).toLowerCase();
      if (txt.indexOf(q) >= 0) hits.push({ t: "筆記", x: n.title, h: "#/notes/part/" + n.part + "/" + n.id });
    });
    BANK.forEach((b) => {
      if ((b.q + " " + b.o.join(" ") + " " + (b.why || "")).toLowerCase().indexOf(q) >= 0)
        hits.push({ t: "題目", x: b.q.slice(0, 60), h: "#/practice" });
    });
    LAWS.forEach((l) => (l.items || []).forEach((it) => {
      if ((it.h + " " + it.zh).toLowerCase().indexOf(q) >= 0) hits.push({ t: "法例", x: l.title + " 第 " + it.s + " 條 · " + it.h, h: "#/law/" + l.cap });
    }));
    TERMS.forEach((t) => {
      if ((t.zh + t.en + t.d).toLowerCase().indexOf(q) >= 0) hits.push({ t: "術語", x: t.zh + "（" + t.en + "）", h: "#/tools/terms" });
    });
    CIRCULARS.forEach((c) => {
      const txt = (c.no + " " + c.title + " " + (c.points || []).join(" ")).toLowerCase();
      if (txt.indexOf(q) >= 0) hits.push({ t: "通告", x: c.no + "　" + c.title, h: "#/circulars/" + encodeURIComponent(c.no) });
    });

    $("#view").innerHTML =
      '<div class="card pad"><h2 style="font-size:18px">搜尋「' + esc(k) + "」</h2>" +
      '<p class="sub small" style="margin-top:4px">共找到 ' + hits.length + " 項結果</p></div>" +
      (hits.length ? '<div class="card pad" style="margin-top:14px;padding:6px 0">' + hits.slice(0, 60).map((h) =>
        '<a href="' + h.h + '" class="row" style="padding:10px 16px;border-bottom:1px solid var(--line);color:inherit">' +
        '<span class="pill gray" style="flex:0 0 auto">' + h.t + '</span><span class="small" style="flex:1">' + esc(h.x) + "</span><span class=\"muted\">→</span></a>").join("") + "</div>"
        : '<div class="empty"><div class="big">⌕</div>沒有相符結果，試試其他關鍵字。</div>');
  }

  /* ------------------------------ 主題 ------------------------------ */
  function applyTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    S.settings.theme = t; save();
    const b = $("#themeBtn"); if (b) b.classList.toggle("on", t === "dark");
    $$('[data-act="theme"]').forEach((x) => x.classList.toggle("on", t === "dark"));
  }
  function toggleTheme() { applyTheme(S.settings.theme === "dark" ? "light" : "dark"); }

  /* ------------------------------ 事件 ------------------------------ */
  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-act]");
    if (!t) return;
    const act = t.dataset.act;
    if (act === "closeModal") return closeModal();
    if (act === "markRead") {
      const id = t.dataset.note;
      if (S.notesRead[id]) delete S.notesRead[id]; else S.notesRead[id] = Date.now();
      save(); renderNoteRefresh(id);
      return;
    }
    if (act === "markAll") {
      const p = Number(t.dataset.part);
      notesOfPart(p).forEach((n) => { S.notesRead[n.id] = S.notesRead[n.id] || Date.now(); });
      save(); viewNotes(["part", String(p)]); toast("已標記本部份為已讀");
      return;
    }
    if (act === "startPractice") return startPractice();
    if (act === "submit") return submitPractice();
    if (act === "examNext") return examNext();
    if (act === "reviewAll") return reviewAll();
    if (act === "next") return nextPractice();
    if (act === "prev") { if (PR && PR.i > 0) { PR.i--; runPractice(); } return; }
    if (act === "flag") {
      const id = t.dataset.q;
      if (S.flags[id]) delete S.flags[id]; else S.flags[id] = Date.now();
      save(); t.textContent = S.flags[id] ? "★ 已標記" : "☆ 標記";
      return;
    }
    if (act === "flag" && MK) return;
    if (act === "sheet") return mockSheet();
    if (act === "submitMock") return submitMock();
    if (act === "clear") { const q = MK.list[MK.i]; delete MK.answers[q._no]; return runMock(); }
    if (act === "openDoc") return openDocModal(t.dataset.doc);
    if (act === "toggleZh") {
      const zh = $("#docZh");
      if (zh) {
        zh.hidden = !zh.hidden;
        t.textContent = zh.hidden ? "顯示中文對照" : "隱藏中文對照";
        if (!zh.hidden) zh.scrollIntoView({ behavior: "smooth", block: "start" });
        return;
      }
      const box = $("#docBox");
      if (!box) return;
      box.classList.toggle("gloss");
      t.textContent = box.classList.contains("gloss") ? "隱藏中文標註" : "顯示中文標註";
      return;
    }
    if (act === "theme") return toggleTheme();
  });

  // 模擬考試內的標記／上下題（需在 MK 情境）
  document.addEventListener("click", (e) => {
    if (!MK) return;
    const t = e.target.closest("[data-act]");
    if (!t) return;
    if (t.dataset.act === "flag") {
      const q = MK.list[MK.i];
      if (MK.flags[q._no]) delete MK.flags[q._no]; else MK.flags[q._no] = 1;
      t.textContent = MK.flags[q._no] ? "★ 已標記" : "☆ 標記";
    }
    if (t.dataset.act === "next") { if (MK.i < MK.list.length - 1) { MK.i++; runMock(); } else mockSheet(); }
    if (t.dataset.act === "prev") { if (MK.i > 0) { MK.i--; runMock(); } }
  });

  function renderNoteRefresh(id) {
    const n = NOTES.find((x) => x.id === id);
    if (!n) return;
    const el = document.getElementById("n_" + id);
    if (el) {
      const wasRead = !!S.notesRead[id];
      const btn = el.querySelector('[data-act="markRead"]');
      if (btn) { btn.textContent = wasRead ? "✓ 已讀" : "標記已讀"; btn.classList.toggle("ghost", wasRead); }
    }
    const toc = $('[data-note="' + id + '"]');
    if (toc) toc.style.opacity = S.notesRead[id] ? ".55" : "1";
  }

  // 鍵盤
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT" || e.target.tagName === "TEXTAREA") return;
    const k = e.key.toUpperCase();
    if (PR && !PR.finished && PR.list) {
      if ($$("#opts .opt").length) {
        const idx = LETTERS.indexOf(k);
        if (idx >= 0) {
          const opts = $$("#opts .opt");
          if (opts[idx]) opts[idx].click();
        }
        if (e.key === "Enter") {
          const sb = $('[data-act="submit"]');
          if (sb && !sb.disabled) sb.click();
          else { const nb = $('[data-act="next"]'); if (nb) nb.click(); }
        }
      }
    }
    if (MK) {
      const idx = LETTERS.indexOf(k);
      if (idx >= 0) { const opts = $$("#opts .opt"); if (opts[idx]) opts[idx].click(); }
      if (e.key === "ArrowRight") { const b = $('[data-act="next"]'); if (b) b.click(); }
      if (e.key === "ArrowLeft") { const b = $('[data-act="prev"]'); if (b) b.click(); }
    }
  });

  $("#themeBtn").onclick = toggleTheme;
  $("#menuBtn").onclick = () => $("#sidebar").classList.toggle("open");
  $("#modal").onclick = (e) => { if (e.target.id === "modal") closeModal(); };
  let searchT;
  $("#globalSearch").addEventListener("input", (e) => {
    clearTimeout(searchT);
    const v = e.target.value.trim();
    searchT = setTimeout(() => { if (v.length >= 1) globalSearch(v); else route(); }, 260);
  });

  /* ------------------------------ 啟動 ------------------------------ */
  buildNav();
  applyTheme(S.settings.theme || "light");
  window.addEventListener("hashchange", route);
  route();
})();

</script>
</body>
</html>
