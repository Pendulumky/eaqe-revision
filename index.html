<!DOCTYPE html>
<html lang="zh-Hant-HK" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="description" content="香港地產代理資格考試（EAQE）互動溫習站：考試大綱、溫習手冊、題庫、模擬考試、土地查冊實戰、法例原文。">
<title>地產代理資格考試 · 互動溫習站</title>
<style>
/* ==========================================================================
   地產代理資格考試溫習站 — design system
   ========================================================================== */
:root{
  color-scheme: light;
  --paper:#f5f6f8;
  --card:#ffffff;
  --ink:#14202e;
  --ink-2:#33445a;
  --sub:#5c6c82;
  --muted:#8b98a9;
  --line:#e4e8ee;
  --line-2:#d3dae4;
  --brand:#0f5c63;
  --brand-2:#127c74;
  --brand-soft:#e6f2f1;
  --brand-ink:#0b4348;
  --gold:#a9761f;
  --gold-soft:#fbf3e2;
  --red:#c0392b;
  --red-soft:#fdecea;
  --green:#1c7c54;
  --green-soft:#e7f5ee;
  --blue:#2b5f9e;
  --blue-soft:#eaf1fa;
  --violet:#6b4ea8;
  --violet-soft:#f1ecfa;
  --shadow-sm:0 1px 2px rgba(20,32,46,.05);
  --shadow:0 1px 3px rgba(20,32,46,.06), 0 8px 24px -12px rgba(20,32,46,.16);
  --shadow-lg:0 18px 44px -20px rgba(20,32,46,.30);
  --r:14px;
  --r-sm:10px;
  --sidebar:246px;
  --maxw:1080px;
  --mono:"SFMono-Regular",Menlo,Consolas,"Liberation Mono",monospace;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --paper:#0e141b;
  --card:#161e27;
  --ink:#e8eef5;
  --ink-2:#c3cfdc;
  --sub:#9aa9ba;
  --muted:#71818f;
  --line:#26313d;
  --line-2:#33414f;
  --brand:#4bb3aa;
  --brand-2:#5fc7bc;
  --brand-soft:#122e2d;
  --brand-ink:#a7e4dd;
  --gold:#d8ac5c;
  --gold-soft:#2b2418;
  --red:#f08a80;
  --red-soft:#331a17;
  --green:#5cc38f;
  --green-soft:#122a20;
  --blue:#7aa9dd;
  --blue-soft:#15202f;
  --violet:#b39ae6;
  --violet-soft:#221b33;
  --shadow:0 1px 3px rgba(0,0,0,.4), 0 10px 30px -16px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Noto Sans HK","PingFang HK","PingFang TC","Microsoft JhengHei","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15.5px;line-height:1.8;letter-spacing:.01em;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0;line-height:1.45;font-weight:700;letter-spacing:.005em}
p{margin:0 0 .7em}
a{color:var(--brand);text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit}

/* 表單控制項：跟隨頁面主題，避免跟隨系統深色模式而出現「深底深字」 */
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]),
select,
textarea{
  background:var(--card);
  color:var(--ink);
  border:1px solid var(--line-2);
  border-radius:10px;
  color-scheme:inherit;
}
input:not([type="checkbox"]):not([type="radio"]):not([type="range"]):not([type="file"]):focus,
select:focus,
textarea:focus{
  outline:none;
  border-color:var(--brand);
  box-shadow:0 0 0 3px var(--brand-soft);
}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:1}
input[type="checkbox"],input[type="radio"]{accent-color:var(--brand)}
.card label{display:block}
.card select{width:100%}
select{appearance:none;padding-right:32px;
  background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),
                   linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;}
::selection{background:#cfe8e5}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* ---------- layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{
  width:var(--sidebar);flex:0 0 var(--sidebar);position:sticky;top:0;height:100vh;
  background:var(--card);border-right:1px solid var(--line);
  display:flex;flex-direction:column;z-index:40;
}
.brand{padding:20px 18px 14px;border-bottom:1px solid var(--line)}
.brand .mark{
  display:flex;align-items:center;gap:10px;
}
.brand .seal{
  width:38px;height:38px;border-radius:11px;flex:0 0 38px;
  background:linear-gradient(140deg,var(--brand) 0%,var(--brand-2) 100%);
  color:#fff;display:grid;place-items:center;font-weight:800;font-size:17px;
  box-shadow:0 4px 12px -4px rgba(15,92,99,.55);
}
.brand h1{font-size:15.5px;letter-spacing:.02em}
.brand .sub{font-size:11.5px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:1px}
.nav{padding:12px 10px;overflow-y:auto;flex:1}
.nav .grp{font-size:11px;letter-spacing:.14em;color:var(--muted);padding:12px 10px 6px;text-transform:uppercase}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;
  color:var(--ink-2);font-size:14px;font-weight:500;margin-bottom:1px;
  transition:background .15s,color .15s;
}
.nav a .ic{width:18px;text-align:center;font-size:15px;opacity:.85}
.nav a:hover{background:var(--brand-soft);color:var(--brand-ink)}
.nav a.on{background:var(--brand);color:#fff;font-weight:600;box-shadow:var(--shadow-sm)}
.nav a.on .ic{opacity:1}
.nav .badge{margin-left:auto;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--line);color:var(--sub)}
.nav a.on .badge{background:rgba(255,255,255,.22);color:#fff}
.sidefoot{padding:12px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}

.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
  padding:10px 22px;display:flex;align-items:center;gap:14px;min-height:54px;
}
.topbar .ttl{font-weight:700;font-size:15px}
.topbar .crumb{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.wrap{max-width:var(--maxw);width:100%;margin:0 auto;padding:22px 22px 90px}
.mobilebar{display:none}

/* ---------- primitives ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  border:1px solid var(--line-2);background:var(--card);color:var(--ink);
  padding:8px 15px;border-radius:10px;font-size:13.5px;font-weight:600;
  transition:transform .08s,box-shadow .15s,background .15s,border-color .15s;
  white-space:nowrap;
}
.btn:hover{border-color:var(--brand);color:var(--brand-ink);background:var(--brand-soft)}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 14px -8px rgba(15,92,99,.9)}
.btn.primary:hover{background:var(--brand-2);border-color:var(--brand-2);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--sub)}
.btn.ghost:hover{background:var(--brand-soft);color:var(--brand-ink)}
.btn.sm{padding:5px 11px;font-size:12.5px;border-radius:8px}
.btn.lg{padding:11px 22px;font-size:15px;border-radius:12px}
.btn.danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 35%,var(--line))}
.btn.danger:hover{background:var(--red-soft);border-color:var(--red);color:var(--red)}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn-row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card.pad{padding:18px 20px}
.card.hov{transition:box-shadow .2s,transform .2s,border-color .2s}
.card.hov:hover{box-shadow:var(--shadow);transform:translateY(-1px);border-color:var(--line-2)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;
  padding:2px 9px;border-radius:20px;background:var(--brand-soft);color:var(--brand-ink);letter-spacing:.02em}
.pill.gray{background:var(--line);color:var(--sub)}
.pill.gold{background:var(--gold-soft);color:var(--gold)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.green{background:var(--green-soft);color:var(--green)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.violet{background:var(--violet-soft);color:var(--violet)}

.row{display:flex;gap:12px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.muted{color:var(--muted)}
.sub{color:var(--sub)}
.small{font-size:13px}
.tiny{font-size:12px}
.hr{height:1px;background:var(--line);margin:16px 0;border:0}

/* ---------- dashboard ---------- */
.hero{
  position:relative;overflow:hidden;border-radius:18px;padding:26px 26px 24px;
  background:linear-gradient(135deg,#0b4348 0%,#0f5c63 45%,#157f74 100%);
  color:#eaf5f3;box-shadow:var(--shadow-lg);
}
.hero:after{
  content:"";position:absolute;right:-70px;top:-90px;width:290px;height:290px;border-radius:50%;
  background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.18),transparent 62%);
}
.hero h2{font-size:23px;letter-spacing:.01em}
.hero p{color:#bfdcd8;font-size:13.5px;margin:6px 0 0;max-width:62ch}
.hero .meta{display:flex;gap:22px;margin-top:18px;flex-wrap:wrap}
.hero .meta div{font-size:12px;color:#a8cfca}
.hero .meta b{display:block;font-size:19px;color:#fff;letter-spacing:.01em}
.ring{width:104px;height:104px;flex:0 0 104px;position:relative;display:grid;place-items:center}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring .val{font-size:22px;font-weight:800;color:#fff;line-height:1}
.ring .lbl{font-size:10.5px;color:#a8cfca;letter-spacing:.08em;margin-top:2px;text-align:center}

.stat{padding:15px 16px}
.stat .k{font-size:11.5px;color:var(--muted);letter-spacing:.06em;font-weight:600}
.stat .v{font-size:24px;font-weight:800;letter-spacing:.01em;margin-top:2px}
.stat .d{font-size:12px;color:var(--sub)}

.bar{height:7px;border-radius:20px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:20px;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .5s}

.partcard{display:flex;gap:14px;align-items:flex-start;padding:16px 17px}
.partcard .no{
  width:38px;height:38px;flex:0 0 38px;border-radius:11px;display:grid;place-items:center;
  font-weight:800;font-size:15px;background:var(--brand-soft);color:var(--brand-ink)
}
.partcard h3{font-size:14.5px}
.partcard .lvl{font-size:11.5px;color:var(--muted);margin-top:1px}

/* ---------- notes ---------- */
.notetoc{position:sticky;top:70px;align-self:start}
.notetoc a{display:block;font-size:13px;color:var(--sub);padding:5px 10px;border-radius:8px;border-left:2px solid transparent}
.notetoc a:hover{background:var(--brand-soft);color:var(--brand-ink)}
.notetoc a.on{color:var(--brand-ink);border-left-color:var(--brand);background:var(--brand-soft);font-weight:600}
.note-sec{padding:20px 22px;margin-bottom:14px}
.note-sec h2{font-size:18px;margin-bottom:2px}
.note-sec .ref{font-size:11.5px;color:var(--muted);letter-spacing:.04em;margin-bottom:14px}
.note-sec h4{font-size:14px;margin:16px 0 6px;color:var(--brand-ink)}
.note-sec ul,.note-sec ol{margin:6px 0 10px;padding-left:22px}
.note-sec li{margin:3px 0}
.note-sec strong{color:var(--ink);font-weight:700;background:linear-gradient(transparent 62%,var(--gold-soft) 62%)}
.term{color:var(--violet);font-weight:600}
.en{color:var(--muted);font-size:.92em}

.callout{border-radius:var(--r-sm);padding:12px 14px;margin:12px 0;font-size:14px;border:1px solid transparent}
.callout .ct{font-size:11.5px;font-weight:800;letter-spacing:.08em;margin-bottom:4px;display:flex;gap:6px;align-items:center}
.callout.law{background:var(--blue-soft);border-color:color-mix(in srgb,var(--blue) 22%,transparent)}
.callout.law .ct{color:var(--blue)}
.callout.tip{background:var(--gold-soft);border-color:color-mix(in srgb,var(--gold) 26%,transparent)}
.callout.tip .ct{color:var(--gold)}
.callout.eg{background:var(--green-soft);border-color:color-mix(in srgb,var(--green) 22%,transparent)}
.callout.eg .ct{color:var(--green)}
.callout.warn{background:var(--red-soft);border-color:color-mix(in srgb,var(--red) 22%,transparent)}
.callout.warn .ct{color:var(--red)}
.callout p:last-child{margin-bottom:0}

table.tb{width:100%;border-collapse:collapse;font-size:13.5px;margin:10px 0}
table.tb th,table.tb td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
table.tb th{background:var(--brand-soft);color:var(--brand-ink);font-weight:700;font-size:12.5px}
table.tb tr:nth-child(even) td{background:color-mix(in srgb,var(--line) 28%,transparent)}

/* ---------- question ---------- */
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.qtext{font-size:16px;line-height:1.85;margin:6px 0 16px;font-weight:500}
.qtext .lead{font-weight:700}
.opts{display:flex;flex-direction:column;gap:9px}
.opt{
  display:flex;gap:11px;align-items:flex-start;padding:11px 14px;border-radius:11px;
  border:1.5px solid var(--line-2);background:var(--card);text-align:left;width:100%;
  transition:border-color .12s,background .12s,transform .08s;
}
.opt:hover:not(.dis){border-color:var(--brand);background:var(--brand-soft)}
.opt .k{
  flex:0 0 24px;height:24px;border-radius:7px;display:grid;place-items:center;
  background:var(--line);font-weight:800;font-size:12.5px;color:var(--sub);margin-top:1px
}
.opt .tx{flex:1;font-size:14.5px;line-height:1.7}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .k{background:var(--brand);color:#fff}
.opt.correct{border-color:var(--green);background:var(--green-soft)}
.opt.correct .k{background:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .k{background:var(--red);color:#fff}
.opt.dis{cursor:default}
.expl{margin-top:16px;border-radius:12px;border:1px solid var(--line);overflow:hidden}
.expl .eh{padding:9px 14px;background:var(--brand-soft);font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--brand-ink);
  display:flex;gap:8px;align-items:center}
.expl .eb{padding:13px 15px;font-size:14px}
.expl .src{font-size:12px;color:var(--muted);padding:0 15px 13px}
.progressline{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--sub)}

/* ---------- exam ---------- */
.exambar{
  position:sticky;top:54px;z-index:20;background:var(--card);border:1px solid var(--line);
  border-radius:12px;padding:9px 14px;display:flex;align-items:center;gap:14px;
  box-shadow:var(--shadow);margin-bottom:16px;flex-wrap:wrap
}
.timer{font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.04em;color:var(--brand-ink)}
.timer.warn{color:var(--gold)}
.timer.danger{color:var(--red);animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.5}}
.sheet{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:5px}
.sheet button{
  height:32px;border-radius:7px;border:1px solid var(--line-2);background:var(--card);
  font-size:12px;font-weight:700;color:var(--sub);padding:0
}
.sheet button.done{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.sheet button.flag{background:var(--gold-soft);border-color:var(--gold);color:var(--gold)}
.sheet button.cur{outline:2px solid var(--brand);outline-offset:1px}
.sheet button.p2{border-style:dashed}

/* ---------- land search ---------- */
.doc{
  background:#fdfdfb;color:#1a1a1a;border:1px solid #dcd6c8;border-radius:10px;
  padding:22px 26px;font-family:"Times New Roman",Georgia,serif;font-size:13.5px;line-height:1.65;
  box-shadow:inset 0 0 0 1px #f0ece0;
}
html[data-theme="dark"] .doc{background:#e9e4d8;color:#1a1a1a}
.doc h5{font-family:"Times New Roman",Georgia,serif;font-size:14px;margin:0 0 2px;letter-spacing:.02em}
.doc .dh{text-align:center;border-bottom:2px solid #333;padding-bottom:8px;margin-bottom:14px}
.doc .dh .t{font-size:16px;font-weight:700;letter-spacing:.06em}
.doc .dh .s{font-size:11.5px;color:#444;letter-spacing:.04em}
.doc table{width:100%;border-collapse:collapse;font-size:12.5px;margin:8px 0}
.doc table th,.doc table td{border:1px solid #b9b2a2;padding:4px 7px;text-align:left;vertical-align:top}
.doc table th{background:#efe9db;font-weight:700;font-size:11.5px;letter-spacing:.03em}
.doc .lbl{font-size:11px;color:#6b6558;letter-spacing:.04em;text-transform:uppercase}
.doc ol,.doc ul{margin:6px 0;padding-left:20px}
.doc .sig{border-bottom:1px solid #333;display:inline-block;min-width:180px}
.doc table td:first-child{font-weight:600}
.docmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
.doc.zhbox{margin-top:16px;border-top:2px dashed #c9c2b0;padding-top:14px}
.doc.zhbox .dh{border-bottom-color:#b58a00}
.hl{background:#fff2a8;border-radius:3px;padding:0 2px;cursor:help;border-bottom:1px dashed #b58a00}
.hl.red{background:#ffd9d4;border-bottom-color:#c0392b}
.hl.blue{background:#d8ebff;border-bottom-color:#2b5f9e}
.zhgloss{display:none;margin-top:14px;padding:10px 12px;border-left:3px solid #b58a00;background:#fffaea;
  font-family:"Noto Sans HK","Microsoft JhengHei",sans-serif;font-size:12.5px;line-height:1.75;color:#4a4231;border-radius:0 8px 8px 0}
.doc.gloss .zhgloss{display:block}

/* ---------- misc ---------- */
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;
  border:1px solid var(--line-2);background:var(--card);font-size:13px;font-weight:600;color:var(--sub)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.search{position:relative;flex:1;max-width:420px}
.search input{
  width:100%;padding:8px 12px 8px 34px;border-radius:10px;border:1px solid var(--line-2);
  background:var(--card);font-size:13.5px;outline:none
}
.search input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.search .ic{position:absolute;left:11px;top:7px;color:var(--muted);font-size:14px}
.kbd{font-family:var(--mono);font-size:11px;padding:1px 5px;border:1px solid var(--line-2);border-bottom-width:2px;
  border-radius:5px;background:var(--card);color:var(--sub)}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.empty .big{font-size:34px;margin-bottom:8px;opacity:.5}
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:var(--paper);padding:10px 20px;border-radius:12px;font-size:13.5px;
  font-weight:600;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.28s;z-index:200
}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(10,16,24,.55);display:none;place-items:center;z-index:150;padding:20px}
.modal.on{display:grid}
.modal .box{background:var(--card);border-radius:16px;max-width:560px;width:100%;padding:24px;box-shadow:var(--shadow-lg)}
.switch{position:relative;width:40px;height:22px;border-radius:20px;background:var(--line-2);border:0;flex:0 0 40px}
.switch:after{content:"";position:absolute;width:16px;height:16px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s}
.switch.on{background:var(--brand)}
.switch.on:after{left:21px}

/* ---------- responsive ---------- */
@media (max-width:1023px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:.25s;box-shadow:var(--shadow-lg)}
  .sidebar.open{transform:none}

{
  id: "n1-1", part: 1, ref: ["1.1", "1.2"], title: "香港地產代理業的發展歷程", level: "第2級",
  blocks: [
    { t: "p", text: "香港的地產代理業由**個體經營**起步，戰後初期多由「經紀」以個人身分在茶樓、街頭促成交易，既無牌照亦無專業標準。隨着房地產成為重要投資工具，行業逐步公司化，再發展為今日的**大型連鎖集團**，分行遍佈全港，並設有中央盤源系統、法務及合規部門。" },

{
  id: "n1-2", part: 1, ref: ["1.3", "1.3.1"], title: "房屋政策、土地政策與樓價周期", level: "第2級",
  blocks: [
    { t: "p", text: "物業價格並非只由「供求」決定，而是**房屋政策**與**土地政策**長期作用的結果。房屋政策決定資助房屋（居屋、綠置居、租置）的供應比例；土地政策決定住宅用地從何而來（賣地、改劃、填海、收回棕地）。" },
    { t: "h", text: "影響樓價的主要因素" },
    { t: "ul", items: [
      "**政治因素**：政策轉向（如「辣招」推出或撤銷）、社會事件、國際關係，會改變投資者預期。",
      "**經濟轉型**：由製造業轉向金融服務業，令就業與收入結構改變，帶動核心區寫字樓與住宅需求。",
      "**移民與人口流動**：人口流入增加住屋需求；人口流出則可能令租金與售價受壓。",
      "**利率與按揭政策**：利率上升令每月供款增加、購買力下降；按揭成數與壓力測試收緊會直接壓縮需求。",
      "**經濟指數**：本地生產總值、失業率、消費物價指數、恒生指數等，反映整體經濟氣氛。",
      "**季節性變動**：農曆新年、暑假、年底等傳統淡旺季，成交量會出現規律性起伏。"
    ]},
    { t: "eg", text: "利率由 2% 升至 4%，同樣月供一萬元可負擔的貸款額大約減少三成。即使樓價不變，買家的實際購買力已下降，成交量通常率先反映。" },
    { t: "h", text: "北部都會區（Northern Metropolis）" },
    { t: "p", text: "政府在新界北部推動的長遠發展計劃，涵蓋元朗、天水圍、洪水橋、古洞北／粉嶺北、新田、坪輋／打鼓嶺等地，按**四大區域**規劃：（1）**高端專業服務和物流樞紐**；（2）**創新科技地帶**（新田科技城、河套）；（3）**口岸商貿及產業區**；（4）**藍綠康樂旅遊生態圈**。" },
    { t: "ul", items: [
      "**落實模式**：包括「**片區開發**」（由市場力量統籌發展大片土地）、「加強版傳統新市鎮發展模式」（原址換地）、產業用地等；",
      "**運輸基建**：**北環線**主線連接屯馬線與東鐵線，錦上路及古洞設轉乘站，並設新田、牛潭尾、凹頭等中途站；",
      "對代理的意義：新發展區涉及**收地、換地、補地價、農地及村屋交易**，代理須熟悉查冊、規劃及補償程序，並避免就政府決定作出保證。"
    ]},
    { t: "eg", text: "客戶查詢「洪水橋農地會否被收」，代理只可提供公開的規劃及收地資料，並建議客戶向地政總署查詢及徵詢律師意見，不可說「一定收」或「賠償一定夠」。" },
    { t: "warn", text: "「辣招」（額外印花稅、買家印花稅、雙倍印花稅）屬**需求管理措施**，並非直接的價格管制。政府在 2024 年 2 月撤銷全部住宅需求管理措施，考試若問「現行是否有買家印花稅」，須按最新情況回答。" }
  ],
  tip: "考「哪一項不是影響樓價的政策因素」時，留意「天氣」「建築材料價格」這類屬技術或短期因素，而非房屋／土地政策。"
},

{

{

{
  id: "n1-6", part: 1, ref: ["1.6"], title: "《地產代理條例》的立法由來", level: "第2級",
  blocks: [

{

{

  blocks: [
    { t: "p", text: "**地產代理監管局**（Estate Agents Authority, EAA）是根據《地產代理條例》設立的法定機構，並非政府部門。它同時負責**發牌**、**規管**、**調查與紀律處分**，以及推動行業專業水平。" },

      "審批牌照申請及續期，並可附加條件；",
      "備存**登記冊**（register）供公眾查閱；",
      "規管地產代理及營業員的執業，包括發出**操守守則**、**執業通告**及指引；",
      "就投訴進行調查，並可轉介紀律委員會；",
      "裁定**佣金爭議**；",
      "推廣行業的專業水平與誠信（持續專業進修、消費者教育）。"
    ]},
    { t: "h", text: "組織架構" },
    { t: "p", text: "監管局由**主席、副主席及一般成員**組成，成員由行政長官委任，並設多個常設委員會（例如紀律委員會、上訴相關機制、CPD 委員會等）。日常運作由**行政總裁**（Chief Executive Officer）領導的秘書處執行。" },
    { t: "ul", items: [
      "**行政總裁**：處理投訴、進行調查、執行監管局決定；不得擔任其他職位。",
      "**紀律委員會**：由監管局設立的常設委員會，負責研訊並行使紀律制裁權。",
      "**上訴委員團**（Appeal Board Panel）：由行政長官委任，組成審裁小組處理不服決定的上訴。"
    ]},
    { t: "law", text: "第 8 條：監管局可設立委員會；紀律委員會是根據第 8(1) 條設立的**常設委員會**，執行第 29 及 30 條所指的職能。第 10 條要求成員披露利害關係。" },
    { t: "warn", text: "監管局**不是**政府部門，亦不是法定「局」；其職員不是公務員。考試常以「監管局屬政府部門」作錯誤選項。" }
  ],
  tip: "記住三條線：發牌（第 III 部）、調查與紀律（第 IV 部）、實務責任（第 V–VIII 部）。題目問「哪項不是監管局的職能」，通常會混入「制定《地產代理條例》」——立法是立法會的權力。"
},

{
  id: "n2-2", part: 2, ref: ["2.2", "2.3.1", "2.3.2"], title: "三類牌照、定義與執業前提", level: "第4級",
  blocks: [
    { t: "table", head: ["牌照", "持有人可做甚麼"], rows: [
      ["地產代理（個人）牌照", "可以**經營**地產代理業務（獨資、合夥人或有限公司董事），亦可受僱為另一持牌地產代理的**營業員**，或出任分行**經理**"],
      ["地產代理（公司）牌照", "以公司名義經營地產代理業務，須有持牌個人董事及獲委任的經理"],
      ["營業員牌照", "**只可**受僱為持牌地產代理的營業員；**不可**經營業務，亦**不可**出任經理"]
    ]},
    { t: "h", text: "定義（第 2 條）" },
    { t: "def", items: [
      { zh: "地產代理", en: "estate agent", d: "在**業務過程中**進行地產代理工作的人，不論是否經營該業務或其他業務。" },
      { zh: "營業員", en: "salesperson", d: "在**受僱於地產代理的過程中**，或以**地產代理的董事**身分，進行地產代理工作的**個人**。" },
      { zh: "地產代理工作", en: "estate agency work", d: "在業務過程中為客戶進行、並符合以下任一情況的工作：(a) 向客戶介紹一名意欲取得或處置物業的第三者，或為達成客戶取得／處置物業而作商議；或 (b) 在介紹或商議之後，就客戶對該物業的取得或處置而進行的工作。" },
      { zh: "客戶", en: "client", d: "以個人身分或代他人聘用或使用地產代理服務的人。" },
      { zh: "物業", en: "property", d: "**土地權益**（interest in land），包括位於香港以外地方的物業。" }
    ]},
    { t: "h", text: "兩個重要限制" },
    { t: "ul", items: [
      "**不包括**測量、估值，或藉**拍賣或投標**作出的處置（第 2(3)(a) 條）。",
      "沒有修飾詞的「地產代理」，**不包括**營業員，亦**不包括**拍賣人（第 2(3)(b) 條）。"
    ]},
    { t: "h", text: "執業前提" },
    { t: "p", text: "第 15 及 16 條：任何人不得在**無有效牌照**的情況下經營地產代理業務或擔任營業員；亦不得以地產代理或營業員身分**顯示自己**。這是第 55(1)(a)、(b) 條罪行的基礎。" },
    { t: "eg", text: "某公司只有一名持牌營業員，卻以公司名義與客人簽署代理協議並收取佣金——公司本身無牌，已違反第 15 條；該營業員亦不可「經營業務」。" }
  ],
  tip: "「營業員可否出任分行經理？」答案永遠是不可以。經理必須持有**地產代理牌照**（第 38(1)(a) 條）。"
},

{
  id: "n2-3", part: 2, ref: ["2.2.3", "2.3.3", "2.3.4"], title: "登記冊、登記地址與營業詳情說明書", level: "第4級",
  blocks: [
    { t: "p", text: "監管局須備存**登記冊**（the register），記錄持牌人的資料，供公眾查閱。登記冊分為四部分：地產代理（個人）、地產代理（公司）、營業員，以及**營業詳情說明書**。" },
    { t: "table", head: ["部分", "記載內容"], rows: [
      ["甲部：地產代理（個人）", "牌照號碼、姓名、通訊用登記地址、有效期、暫時吊銷期間、撤銷日期、終止從業日期"],
      ["乙部：地產代理（公司）", "牌照號碼、公司名稱、營業名稱、營業地點、登記地址、有效期等"],
      ["丙部：營業員", "牌照號碼、姓名、登記地址、有效期等"],
      ["丁部：營業詳情說明書", "說明書號碼、持牌地產代理名稱、營業名稱、營業地點、有效期"]
    ]},
    { t: "h", text: "登記地址（registered address）" },
    { t: "ul", items: [
      "持牌人須有一個**登記地址**，用作通訊及送達文件；",
      "登記地址可以是住宅或商業地址，但必須是持牌人**可接收文件**的地址；",
      "更改登記地址須**通知監管局**（實務上以指定表格辦理）。"
    ]},
    { t: "h", text: "營業詳情說明書（SPOB）" },
    { t: "p", text: "每一**營業地點**（總行及每間分行）都須有**營業詳情說明書**（Statement of Particulars of Business），列明營業名稱、地址、經理的姓名及牌照號碼等。分行開業前須先取得說明書；分行搬遷、改名或更換經理，均須更新。" },
    { t: "law", text: "第 13 條：監管局須設立和備存登記冊。第 14 條：登記地址。第 55(1)(k) 條：非執行職務而**揑改、毀損登記冊**或作新記項，屬犯罪。" },
    { t: "warn", text: "「登記地址」≠「營業地點」。登記地址是通訊地址；營業地點是實際做生意的地方，須有營業詳情說明書。題目常把兩者對調作陷阱。" }
  ],
  tip: "問「公司在同一地址以兩個營業名稱經營」時，須就**每個營業名稱**分別申請營業詳情說明書（費用亦按每個名稱及每個地點計算）。"
},

{
  id: "n2-4", part: 2, ref: ["2.3.5", "2.3.6", "2.3.7", "2.3.8"], title: "牌照申請、續期、條件、吊銷與撤銷", level: "第4級",
  blocks: [
    { t: "h", text: "發牌基本條件" },
    { t: "ul", items: [
      "完成**中學五年級**或同等程度教育；",
      "申請當日**年滿 18 歲**；",
      "在申請前**12 個月內**通過有關資格考試（EAQE 或 SQE）；",
      "獲監管局認為是持牌的**適當人選**（fit and proper person）。"
    ]},
    { t: "p", text: "「適當人選」沒有單一定義，監管局會考慮：是否**未獲解除破產**的破產人、是否《精神健康條例》所指的精神紊亂人士、是否曾因**欺詐性、舞弊或不誠實**罪行被定罪、是否有相關經驗或紀律記錄等。" },
    { t: "h", text: "有效期與續期" },
    { t: "ul", items: [
      "牌照有效期一般為 **12 個月**，亦可申請 **24 個月**；",
      "續期申請須於有效期屆滿前 **3 個月至 1 個月**內提出（或監管局書面准許的其他期間）；",
      "**臨時牌照**（provisional licence）只在特定情況（如續期申請未及批出）下批給。"
    ]},
    { t: "h", text: "附加條件（conditions）" },
    { t: "p", text: "監管局可在牌照上附加條件（例如要求完成指定進修、由持牌人監督等），並可**更改**已附加的條件。違反牌照條件屬違紀事項，可招致紀律處分。" },
    { t: "h", text: "暫時吊銷與撤銷" },
    { t: "p", text: "第 27 條容許監管局在指明情況下**暫時吊銷**或**撤銷**牌照（例如持牌人不再符合發牌條件、以欺詐手段取得牌照）。因紀律研訊而作的吊銷或撤銷，則依第 30 條處理。**已繳費用不獲退還**。" },
    { t: "law", text: "第 19–21 條分別限制向個人、公司及營業員批給牌照的條件；第 24 條列出可拒絕批給或續期的情況；第 26 條規定牌照格式、費用及有效期。" }
  ],
  tip: "牌照續期「3 個月至 1 個月」是高頻考點，容易與第 40 條的「31 天」混淆：續期是**屆滿前 3–1 個月**；通知是**事發後 31 天內**。"
},

{
  id: "n2-5", part: 2, ref: ["2.3.9.1"], title: "第 36 條：物業資料的管有、核實與披露", level: "第4級",
  blocks: [
    { t: "p", text: "第 36 條是整個條例中**最重要**的實務條文。凡持牌地產代理就某物業訂立了地產代理協議，他對該物業負有以下責任（只適用於**住宅物業**）：" },
    { t: "ol", items: [
      "在代賣方行事期間，**管有或控制**訂明的資料（prescribed information）；",
      "在合理範圍內確保自己**信納資料準確**；",
      "向訂明類別的人士**提供**該等資料；",
      "在提供資料時遵守訂明的規定；",
      "將接獲的**每一項要約**通知賣方客戶——除非客戶以**明示方式**指示無須通知；",
      "向客戶**全面披露**自己對該物業的任何金錢上或其他實益權益，以及物業獲處置時可得的任何利益（包括佣金或任何種類權益）；",
      "如**同時為買賣雙方行事**，須通知雙方，並應一方要求提供另一方就該物業提供的資料（除另一方明示指示不得提供）。"
    ]},
    { t: "h", text: "訂明的資料包括甚麼？" },
    { t: "ul", items: [
      "物業當時的**擁有權及有效產權負擔**（以土地紀錄為準）；",
      "物業的**總計或全部面積**（按訂明方式計算及表達，即實用面積）；",
      "**落成年份或期間**（以佔用許可證為準）；",
      "物業**用途的任何限制**；",
      "政府租契或其他租契的**未滿年期**，以及是否有**續期權利**；",
      "如將批給租契，**建議的租契年期**；",
      "**賣方的聲明**：所知悉的結構上增建或改建、以及規定或建議進行的修葺／改善。"
    ]},
    { t: "h", text: "違反的後果" },
    { t: "p", text: "沒有遵守第 36(1) 條而令客戶蒙受損失，即構成**訴因**（cause of action），客戶可追討損害賠償。第 36(5) 條設有**推定**：持牌人須推定為知悉或理應知悉須提供的資料；免責辯護是證明已採取**一切合理步驟**並已盡**一切應盡的努力**。" },
    { t: "law", text: "第 36(3) 條：營業員只承擔第 (1)(a)(v)、(vi)、(vii) 節的責任（要約通知、披露利益、同時代表雙方）。" },
    { t: "warn", text: "「客戶口頭說不用通知要約」**不足夠**——法例要求**明示方式**的指示，實務上應以書面記錄。" }
  ],
  tip: "第 36 條的七項責任用「**管、核、供、守、通、披、雙**」記憶：管有、核實、提供、遵守規定、通知要約、披露利益、披露雙方代理。"
},

{
  id: "n2-6", part: 2, ref: ["2.3.9.3"], title: "對辦事處的有效控制與經理（第 38 條）", level: "第4級",
  blocks: [
    { t: "p", text: "持牌地產代理須確保其**主要辦事處或唯一辦事處**，以及**每一個其他辦事處**（不論稱為分行、支行或其他名稱）的業務，均由**一名由其委任的經理**在**有效和獨立的控制**下經營。" },
    { t: "h", text: "三個關鍵要求" },
    { t: "ol", items: [
      "經理必須是**個人**，並**持有地產代理牌照**（營業員牌照不符合資格）；",
      "經理須**通常**在該辦事處**以經理身分行事**，並在該辦事處**管理地產代理業務**；",
      "一名經理**不可**同時控制同一代理的多於一個辦事處，亦**不可**同時控制另一名代理的辦事處（合夥情況除外）。"
    ]},
    { t: "h", text: "自己管理與例外" },
    { t: "ul", items: [
      "持牌地產代理**可委任自己**管理其辦事處；如有多於一個辦事處，他只可管理**其中一個**；",
      "如持牌地產代理受僱於另一代理並以**營業員身分**工作，則第 38(1)(a) 條不適用於他；",
      "兩名或以上地產代理有**合夥關係**而在同一辦事處工作，該辦事處不視為「另一名代理的辦事處」。"
    ]},
    { t: "h", text: "經理的責任" },
    { t: "p", text: "如經理並非以「自己管理」方式獲委任，則第 36(1)(a)(i)–(vii) 條的責任**同樣適用於該經理**，猶如他是訂立代理協議的持牌地產代理。" },
    { t: "law", text: "第 38(1)(b)(ii) 條：任何人除非是持牌地產代理，否則不得**看來是**接受經理委任或**看來是**依據委任行事——違反此條屬第 55(1)(g) 條罪行。" },
    { t: "eg", text: "某分行由一名持牌營業員「看鋪」並自稱經理——該營業員違反第 38(1)(b)(ii) 條；僱用他的代理亦違反第 38(1)(a) 條。" }
  ],
  tip: "個案題常問「誰可出任新分行經理」：只有**持牌地產代理**可以；在同一公司工作十年的營業員也不可以。"
},

{
  id: "n2-7", part: 2, ref: ["2.3.9.4", "2.3.9.5", "2.3.9.6", "2.3.9.7"], title: "第 40 條通知、董事責任與收款責任", level: "第4級",
  blocks: [
    { t: "h", text: "第 40 條：31 天內須通知監管局的事項" },
    { t: "table", head: ["事項", "期限"], rows: [
      ["持牌人**終止從事**地產代理工作", "終止後 31 天內"],
      ["持牌地產代理**僱用**或**終止僱用**營業員", "僱用／終止日期起 31 天內"],
      ["**委任**或**終止委任**經理", "委任／終止日期起 31 天內"],
      ["公司持牌地產代理：**董事**的委任或終止", "委任／終止日期起 31 天內"],
      ["持牌地產代理**成為**或**終止為**合夥成員（而該合夥進行或擬進行地產代理工作）", "成為／終止日期起 31 天內"]
    ]},
    { t: "p", text: "通知須以**書面**作出，並載有監管局訂明的附加詳情。" },
    { t: "h", text: "董事的法律責任（第 42 條）" },
    { t: "p", text: "如公司觸犯條例所訂罪行，而該罪行證明是**經董事、經理、秘書或其他類似人員的同意或縱容**而犯，或是**可歸因於他們的疏忽**，則該人**同樣犯罪**，可被判處相同刑罰。這是「管理層責任」的基礎，亦是第 8 部份的考點。" },
    { t: "h", text: "對所收款項的法律責任（第 43 條）" },
    { t: "ul", items: [
      "持牌地產代理須按**客戶指示**處理為客戶收取的款項；",
      "不得將客戶款項與自己的款項**混同**；",
      "違反第 43(1) 或 (3) 條屬第 55(2)(c) 條罪行；違反第 43(2) 條屬第 55(2)(d) 條罪行。"
    ]},
    { t: "law", text: "第 39 條：禁止某些僱用（例如僱用無牌人士從事地產代理工作）。第 41 條：發出通知的方式。" },
    { t: "warn", text: "「31 天」由**事發日期**起計，不是由月底或通知監管局得悉之日起計。題目常用「兩個月內」作錯誤選項。" }
  ],
  tip: "五類 31 天通知口訣：**停業、僱員、經理、董事、合夥**。"
},

{
  id: "n2-8", part: 2, ref: ["2.3.9.8"], title: "廣告宣傳的規管", level: "第4級",
  blocks: [
    { t: "p", text: "廣告由《地產代理條例》第 44 條、《常規規例》第 9 條、《操守守則》及執業通告共同規管。「廣告」的定義非常廣泛：報章、電視、電台、海報、傳單、圖片、影片，以及**任何其他方式**（包括網上廣告、社交媒體帖文）。" },
    { t: "h", text: "核心禁令" },
    { t: "ul", items: [
      "不得發出載有**在要項上屬虛假或具誤導性**陳述或詳情的廣告；",
      "就賣方的住宅物業發出廣告前，須取得賣方的**書面同意**；",
      "不得以**有別於客戶指示**的價格、租金或條款宣傳該物業；",
      "擬**分租**的物業，廣告須明文述明該物業是擬分租的；",
      "物業**不再可供**出售／出租，或**代理協議終止**後（以較早者為準），須在切實可行範圍內**盡快移除**廣告；",
      "以**分銷放盤代理**身分行事者，同樣須遵守上述規定。"
    ]},
    { t: "h", text: "實務要點" },
    { t: "ul", items: [
      "廣告須顯示**代理的牌照號碼**及營業名稱；",
      "不得使用「**保證**」、「**必賺**」、「**最平**」等無法證實的字眼；",
      "樓盤照片不得為其他物業或經修改至誤導；",
      "「**獨家**」字眼須有實際的獨家代理協議支持。"
    ]},
    { t: "law", text: "第 44 條：廣告宣傳的規管權力。第 2 條對「廣告」的定義包括「任何其他方式」，因此**網上放盤、即時通訊群組**的宣傳同樣受規管。" },
    { t: "eg", text: "代理在社交媒體刊登某單位「實用 800 呎」，實際只有 600 呎——即使事後更正，已屬發出**具誤導性**廣告，可被紀律處分。" }
  ],
  tip: "「賣方口頭同意登廣告」不足夠——第 9(2) 條要求**書面同意**。"
},

{
  id: "n2-9", part: 2, ref: ["2.3.10"], title: "地產代理協議（第 45–48 條）", level: "第4級",
  blocks: [
    { t: "p", text: "地產代理協議（estate agency agreement）是代理與客戶之間訂明代理工作條款的文件。它不只是「合約」問題，更是**能否追討佣金**的關鍵。" },
    { t: "h", text: "第 45 條：沒有協議，不能起訴" },
    { t: "p", text: "凡代理**建議或承諾**為客戶進行地產代理工作（不論是否就某一物業、是否為佣金），只有在以下情況下，代理才具有起訴權或訴因去追討損害賠償或佣金：" },
    { t: "ol", items: [
      "代理與客戶之間已訂立並（如屬文件）**妥善簽立**一份**以訂明格式**作出、載有訂明詳情的代理協議；及",
      "代理在訂立及簽立該協議時**是持牌地產代理**。"
    ]},
    { t: "p", text: "第 45(2) 條進一步規定：代理亦只有在符合上述條件時，才可向其他人追討因取得或處置物業而已支付或須支付的**支出**。" },
    { t: "h", text: "第 46–48 條：格式、內容與副本" },
    { t: "ul", items: [
      "第 46 條：協議的**格式及內容**由規例訂明（即表格 3–6），並須包括有效期、佣金、雙方責任等；",
      "第 47 條：須向客戶提供**未簽立**的協議副本；",
      "第 48 條：協議簽立後，須向客戶提供**已簽立**的協議副本。"
    ]},
    { t: "h", text: "四種訂明協議" },
    { t: "table", head: ["表格", "用途"], rows: [
      ["表格 3", "與**賣方**訂立的地產代理協議（出售住宅物業）"],
      ["表格 4", "與**買方**訂立的地產代理協議（購買住宅物業）"],
      ["表格 5", "與**業主**訂立的地產代理協議（出租住宅物業）"],
      ["表格 6", "與**租客**訂立的地產代理協議（承租住宅物業）"]
    ]},
    { t: "law", text: "第 45 條的實施範圍限於**住宅物業**（部分生效公告）。非住宅物業雖不受第 45 條的起訴權限制，但操守守則仍要求使用書面協議。" },
    { t: "warn", text: "常見陷阱：代理口頭承諾「幫你搵到樓就收 1%」，但從未簽署表格 4——即使成功交易，代理**可能無法透過訴訟追討佣金**。" }
  ],
  tip: "「獨家代理」條款必須在協議中清楚列明，並向客戶解釋其後果（包括在獨家期內即使自行成交仍可能須付佣金）。"
},

{
  id: "n2-10", part: 2, ref: ["2.3.11"], title: "訂明表格 1–6 的運用", level: "第4級",
  blocks: [
    { t: "table", head: ["表格", "名稱", "何時使用"], rows: [
      ["表格 1", "物業資料表格（Property Information Form）", "賣方委託出售**住宅物業**時，由賣方填寫並由代理核實，向準買家提供"],
      ["表格 2", "出租資料表格（Letting Information Form）", "業主委託出租住宅物業時使用"],
      ["表格 3", "地產代理協議（賣方）", "賣方委託代理出售住宅物業"],
      ["表格 4", "地產代理協議（買方）", "買方委託代理購買住宅物業"],
      ["表格 5", "地產代理協議（業主）", "業主委託代理出租住宅物業"],
      ["表格 6", "地產代理協議（租客）", "租客委託代理承租住宅物業"]
    ]},
    { t: "h", text: "表格 1 的主要內容" },
    { t: "ul", items: [
      "物業地址、**實用面積**（以差餉物業估價署或佔用許可證等為依據）；",
      "**擁有權**及**產權負擔**（例如按揭、釘契）；",
      "**用途限制**（住宅／商業、政府租契條件）；",
      "**落成年份**；",
      "**財務責任**（管理費、差餉、地租）；",
      "**賣方的陳述**：結構性增建或改建、已知的修葺或改善命令。"
    ]},
    { t: "p", text: "表格 1 由**賣方**作出陳述，代理的角色是**核實**（在合理範圍內）並向買方提供。代理不可代賣方「填大」資料，亦不可隱瞞已知的僭建。" },
    { t: "law", text: "第 36(2)(g) 條要求賣方就**結構上的增建或改建**及**規定或建議進行的修葺／改善**作出聲明；第 36(7) 條聲明：條例**不要求**代理或賣方**保證**該聲明準確。" },
    { t: "warn", text: "表格 1 不等於「保證樓契無問題」。代理仍須查冊，並在發現異常時建議客戶徵詢法律意見。" }
  ],
  tip: "記法：**1 資料、2 出租資料；3 賣、4 買、5 業主、6 租客**。奇數多為「供方」（賣方／業主），偶數多為「求方」（買方／租客）。"
},

{
  id: "n2-11", part: 2, ref: ["2.3.12", "2.3.13"], title: "調查、投訴、紀律制裁與上訴", level: "第4級",
  blocks: [
    { t: "h", text: "調查（第 28 條）" },
    { t: "p", text: "監管局可委任**調查員**調查持牌人是否違反條例或操守要求。持牌人有責任在合理要求下**交出紀錄**、**解釋文件**，並讓調查員在合理時間查閱。妨礙調查或拒絕遵從屬罪行。" },
    { t: "h", text: "投訴（第 29 條）" },
    { t: "p", text: "任何人可向監管局投訴；監管局亦可主動轉介。投訴成立與否，須視乎是否有**充分理據支持**。" },
    { t: "h", text: "紀律制裁權（第 30 條）——必須熟記" },
    { t: "table", head: ["制裁", "上限／說明"], rows: [
      ["訓誡或譴責", "—"],
      ["附加條件於牌照", "可就牌照附加指明條件"],
      ["更改已附加的條件", "—"],
      ["暫時吊銷牌照", "為期**不超過 2 年**的指明期間"],
      ["撤銷牌照", "—"],
      ["罰款", "不超過 **$300,000** 的指明款額"],
      ["命令支付費用", "監管局／紀律委員會／調查員／投訴人或持牌人的全部或部分程序費用"]
    ]},
    { t: "ul", items: [
      "行使權力前，須給予持牌人及受影響人士**合理陳詞機會**；",
      "決定須在 **21 天內**以書面通知，並**說明理由**；如屬暫時吊銷，須說明期間；",
      "如行使附加條件、更改條件、吊銷或撤銷的權力，須在**憲報**刊登公告；",
      "即使已上訴或上訴期未屆滿，決定**仍然生效**；",
      "因暫時吊銷或撤銷而繳付的費用**不獲退還**；",
      "罰款及費用可作為**民事債項**追討。"
    ]},
    { t: "h", text: "上訴（第 31–34 條）" },
    { t: "p", text: "不服監管局或紀律委員會的決定，可向**上訴委員團**（Appeal Board Panel）組成的**審裁小組**（appeal tribunal）上訴。上訴委員團成員由**行政長官**委任。審裁程序包括聆訊、證人作供，並可維持、更改或推翻原決定。" },
    { t: "law", text: "第 30(3) 條的免責辯護：持牌人如證明已採取**一切合理步驟**並已盡**一切應盡的努力**以避免違規，則不得對其行使制裁權力。" },
    { t: "warn", text: "「紀律委員會可判處監禁」是錯的——監禁只可由**法庭**判處；監管局只能罰款、譴責、附加條件、吊銷或撤銷牌照。" }
  ],
  tip: "四個數字要背死：**2 年**（吊銷上限）、**$300,000**（罰款上限）、**21 天**（通知）、**5 年**（法庭取消資格上限，第 55(6) 條）。"
},

{
  id: "n2-12", part: 2, ref: ["2.3.14"], title: "第 55 條：罪行與罰則", level: "第4級",
  blocks: [
    { t: "h", text: "第 55(1) 條——適用於「任何人」" },
    { t: "ul", items: [
      "(a) 違反第 15(1) 或 (2) 條：**無牌經營**地產代理業務；",
      "(b) 違反第 16(1) 條：**無牌擔任營業員**；",
      "(c)(d) 在**牌照申請或續期**中作出虛假或具誤導性陳述／提供虛假資料；",
      "(e)(f) 沒有遵守第 28(5)／28(9) 條（調查中的要求）；",
      "(g) 違反第 38(1)(b)(ii) 條：**非持牌地產代理而看來是經理**；",
      "(h) 以虛假陳述充作遵守各項規定；",
      "(i) 拒絕以證人身分出席、交出文件或回答問題；",
      "(j) **妨礙**監管局或任何人執行職能；",
      "(k) 非執行職務而**揑改、毀損登記冊**或作新記項。"
    ]},
    { t: "h", text: "第 55(2) 條——適用於持牌人" },
    { t: "ul", items: [
      "(a) 使用**牌照上指明姓名或名稱以外**的名稱經營業務；",
      "(b) 沒有遵守第 39(1) 條（**禁止某些僱用**）；",
      "(c)(d) 沒有遵守第 43 條（**客戶款項**的處理）。"
    ]},
    { t: "h", text: "主要罰則" },
    { t: "table", head: ["罪行", "公訴", "簡易程序"], rows: [
      ["無牌經營（55(1)(a)）", "罰款 $500,000 及／或監禁 2 年", "第 6 級罰款及／或監禁 6 個月"],
      ["無牌任營業員、調查違規等（55(1)(b)(e)(f)(h)(i)(j)(k)）", "罰款 $200,000 及／或監禁 1 年", "第 6 級罰款及／或監禁 6 個月"],
      ["非持牌而看來是經理（55(1)(g)）", "罰款 $150,000 及／或監禁 6 個月", "第 5 級罰款及／或監禁 3 個月"],
      ["申請中作虛假陳述（55(1)(c)(d)）", "第 6 級罰款及／或監禁 1 年", "第 5 級罰款及／或監禁 6 個月"]
    ]},
    { t: "p", text: "第 55(6) 條：任何人被裁定犯了條例所訂罪行，法庭或裁判官可命令在**不超過 5 年**的期間內**取消其持有牌照的資格**；其持有的牌照自命令日期起**終止有效**。" },
    { t: "warn", text: "不要混淆「紀律制裁」（監管局，罰款上限 $300,000）與「刑事罰款」（法庭，最高 $500,000）。題目問「最高罰款額」時要先看是**紀律**還是**刑事**。" }
  ],
  tip: "記最高刑罰：無牌經營 = **$500,000 + 2 年**；其他多數 = **$200,000 + 1 年**。這兩個數字足以應付大部分題目。"
},

{
  id: "n2-13", part: 2, ref: ["2.3.15"], title: "佣金爭議的裁定（第 49–52 條）", level: "第4級",
  blocks: [
    { t: "p", text: "地產代理與客戶之間就**佣金**（或佣金的數額）產生的爭議，可交由監管局裁定，這是一個**快速、低成本**的機制，不必先上法庭。" },
    { t: "ul", items: [
      "監管局有**司法管轄權**就佣金爭議作出裁定，並須給予雙方陳詞機會；",
      "不服裁定，可於指定期間內向**區域法院**（District Court）提出上訴；",
      "監管局的裁定可在**區域法院登記**，登記後即成為區域法院的判決，可按判決執行方式追討；",
      "第 52 條：裁定一經登記，即屬最終及不可推翻（除非被撤銷）。"
    ]},
    { t: "h", text: "實務提示" },
    { t: "ul", items: [
      "佣金數額**由雙方議定**，法例沒有規定百分比；",
      "代理只有在符合第 45 條（已簽署訂明格式協議）的情況下，才可透過訴訟追討佣金；",
      "「**分銷放盤代理**」（sub-agent）不得向主代理的客戶直接要求佣金（《常規規例》第 14(1) 條）。"
    ]},
    { t: "law", text: "第 49 條：佣金爭議的裁定。第 50 條：向區域法院上訴。第 51 條：區域法院的司法管轄權。第 52 條：監管局裁定可在區域法院登記。" },
    { t: "eg", text: "代理與業主就「成交價 1%」還是「2%」爭持不下，雙方同意交由監管局裁定——監管局作出裁定後，業主仍可向區域法院上訴。" }
  ],
  tip: "佣金爭議的關鍵詞是「**裁定**」（determination）與「**區域法院**」。不要選「小額錢債審裁處」或「高等法院」。"
},

{
  id: "n2-14", part: 2, ref: ["2.4"], title: "操守守則（Code of Ethics）", level: "第4級",
  blocks: [
    { t: "p", text: "操守守則不是附屬法例，但違反守則可構成**違紀行為**，監管局可據此行使紀律制裁權。守則的核心是「**誠信、公平、專業、保障客戶**」。" },
    { t: "h", text: "七大範疇" },
    { t: "ol", items: [
      "**符合法律規定**：遵守《地產代理條例》、附屬規例、其他相關法例；",
      "**充分明瞭有關法例及規定**：持牌人須具備並更新知識；",
      "**專業知識及能力**：只接辦自己有能力處理的工作；",
      "**執業時的操守及道德標準及對客戶的責任**：誠實、公平、盡責；",
      "**應盡一切應盡的努力**（due diligence）：核實資料、跟進交易；",
      "**盡量減少利益衝突**：披露金錢及其他實益利益；",
      "**代理之間的關係**：不得惡意貶低同業、不得搶單、不得散播虛假資訊。"
    ]},
    { t: "h", text: "最常考的具體要求" },
    { t: "ul", items: [
      "向客戶**詳盡披露**因該物業可獲得的金錢或其他實益利益（包括佣金、回贈、發展商獎金）；",
      "**不得**作出失實或誤導陳述，包括誇大回贈、隱瞞僭建、虛構成交；",
      "**不得**在未經客戶同意下把客戶資料轉交第三者（包括轉介裝修、律師）；",
      "**不得**向客戶施加不當壓力或利用客戶的無知；",
      "**不得**與客戶有未披露的商業關係（例如代理是賣方公司的大股東）。"
    ]},
    { t: "law", text: "《常規規例》第 14(2) 條：如向客戶推薦其他人的服務而該推薦可為持牌人帶來金錢或其他實益權益，**必須在推薦前披露**，否則不得推薦。" },
    { t: "warn", text: "「應客戶要求介紹律師行」本身不違反守則；但如代理**從律師行收取回佣而沒有披露**，即屬違反。" }
  ],
  tip: "操守題的判斷標準：**有否披露？有否書面記錄？有否保障客戶利益？** 三個問題中任何一個答「否」，通常就是違規。"
},

{
  id: "n2-15", part: 2, ref: ["2.5", "2.6"], title: "常規規例與執業通告重點", level: "第4級",
  blocks: [
    { t: "p", text: "《地產代理常規（一般責任及香港住宅物業）規例》（第 511C 章）把操守原則變成**具體可執行的規定**，是第 2 部份個案題的主要來源。" },
    { t: "h", text: "必須記住的條文" },
    { t: "table", head: ["條文", "內容"], rows: [
      ["第 6 條", "**地產代理協議的使用**：為賣方行事須在（a）接獲指示後 **7 個工作日**內、（b）作廣告宣傳前、或（c）簽署買賣協議／租契前（**以最早者為準**）訂立代理協議；為買方行事則須在安排視察前或簽署協議前（以較早者為準）訂立；如客戶非由律師代表，訂立協議前須解釋各類委任的含意及每項條款"],

{
  id: "n3-1", part: 3, ref: ["3.1", "3.2", "3.3"], title: "普通法、衡平法與成文法", level: "第2級",

      { zh: "衡平法", en: "equity", d: "補充普通法的原則體系，源自衡平法院。提供普通法沒有的救濟，例如**強制履行**（specific performance）、**禁制令**（injunction）、**信託**（trust）。" },
      { zh: "成文法", en: "statute", d: "由**立法會**制定的條例（Ordinance），及由行政機關根據授權制定的**附屬法例**（subsidiary legislation）。" }
    ]},
    { t: "p", text: "三者的關係：成文法**優先**於普通法與衡平法；衡平法**優先**於普通法（如兩者衝突）。地產代理的實務同時受三者規管——《地產代理條例》是成文法，代理的受託責任來自衡平法，疏忽與失實陳述來自普通法。" },
    { t: "h", text: "為何代理要懂？" },
    { t: "ul", items: [

      "代理的**疏忽**與**失實陳述**責任，來自普通法判例；",
      "代理的**牌照、協議、廣告**責任，來自成文法。" ]},
    { t: "eg", text: "客戶要求代理交出因職務獲得的秘密利潤——這是衡平法上的「**不容許代理人從受託職位獲利**」原則，即使合約沒有寫明。" }
  ],
  tip: "「遵循先例」與「衡平法救濟」是最常考的兩組概念。記住：普通法＝金錢賠償為主；衡平法＝強制履行、禁制令、信託。"
},

{
  id: "n3-2", part: 3, ref: ["3.4", "3.4.1", "3.4.2"], title: "代理法：委任方式與代理的職責", level: "第2級",

      ["暗示委任", "從行為或情況推斷", "客戶多次讓某代理帶客睇樓並接受報價"],
      ["不容反悔", "委託人曾令第三者相信某人是其代理，事後不得否認", "公司讓某人以「經理」名片對外接洽"],

{
  id: "n3-3", part: 3, ref: ["3.4.3"], title: "代理委任的終止", level: "第2級",
  blocks: [

    { t: "ul", items: [

{
  id: "n3-4", part: 3, ref: ["3.5.1", "3.5.2"], title: "合約的成立：要約、接納、代價、意圖", level: "第2級",

    { t: "p", text: "合約須具備四個要素：**要約**（offer）、**接納**（acceptance）、**代價**（consideration）、**受法律約束的意圖**（intention to create legal relations）。" },

{
  id: "n3-5", part: 3, ref: ["3.5.3", "3.5.5", "3.5.7"], title: "物業合約、違約與補償", level: "第2級",

{

{
  id: "n3-7", part: 3, ref: ["3.6"], title: "疏忽（Negligence）與疏忽聲明", level: "第2級",

    { t: "p", text: "**疏忽**指行為人對受其責任的人負有**謹慎責任**（duty of care），卻**違反**該責任，並**導致**對方蒙受損失。" },
    { t: "h", text: "三個要素" },
    { t: "ol", items: [
      "**小心的責任**（duty of care）：可合理預見的損害、雙方關係足夠密切；",

    { t: "h", text: "疏忽聲明（negligent misstatement）" },
    { t: "p", text: "如專業人士作出**不準確的陳述**，而對方依賴該陳述蒙受損失，即使沒有合約關係，亦可能負上責任。要素包括：陳述、原告依賴、被告知悉原告的依賴、依賴合理、原告蒙受損失。" },

    ]},
    { t: "eg", text: "代理替客戶計算印花稅時計錯稅率，客戶因此被罰款——代理可能因疏忽而須賠償。" }
  ],
  tip: "問「疏忽的三個要素」時，緊記 duty → breach → damage。缺一不可。"
},

{
  id: "n3-8", part: 3, ref: ["3.7.1"], title: "《物業轉易及財產條例》（第 219 章）第 3、5、6 條", level: "第2級",
  blocks: [
    { t: "table", head: ["條文", "內容"], rows: [
      ["第 3 條", "**土地合約須以書面作出**：任何人不得根據土地售賣合約或其他土地處置合約提出訴訟，除非協議（或其備忘錄／摘記）以書面作出，並由**被告的一方**或其合法授權人簽署。不影響**部分履行**及法院頒令的售賣。"],
      ["第 5 條", "**某些文書須以書面作出**：土地**衡平法權益**的設定或處置須以書面作出並簽署；關乎土地的信託聲明亦須以書面宣告及證明（歸復、默示及法律構定信託除外）。"],
      ["第 6 條", "**口頭設定的土地權益**：只以口頭設定而未經書面簽署者，即使已付代價，其效力僅為**可隨時及隨意取消的權益**（即最多是隨意終止的租賃）。"]
    ]},
    { t: "h", text: "重要的例外：口頭租約" },
    { t: "p", text: "第 6(2) 條：口頭設定的租契**仍然有效**，但須同時符合三個條件：**承租人在管有時即生效**、租期**不超過 3 年**、租金為**在無須支付額外費用下可合理取得的最佳租金**（即市值租金，沒有頂手費）。" },
    { t: "law", text: "第 3(2) 條：本條不影響與**部分履行**有關的法律，或由法院頒令的售賣。第 6(1) 條的效力：口頭權益只是「隨意終止」的權益。" },
    { t: "eg", text: "業主口頭答應租客租用單位 2 年、月租 $15,000、即時交鎖匙——符合第 6(2) 條，租約有效。若租期 4 年，則口頭租約不受保障。" }
  ],
  tip: "三個數字要記住：第 3 條（書面）、第 5 條（衡平法權益及信託）、第 6 條（口頭 → 隨意終止；例外：≤3 年、即時管有、市值租金）。"
},

{
  id: "n3-9", part: 3, ref: ["3.7.2"], title: "《土地註冊條例》（第 128 章）：優先次序與註冊", level: "第2級",
  blocks: [
    { t: "p", text: "香港實行**契約註冊制度**（registration of deeds），不是業權註冊制度（Torrens system）。土地註冊處登記的是**文書**（契據），而不是「誰是業主」的最終證明。因此查冊只能顯示**已註冊的文書**，不能保證業權完整。" },
    { t: "h", text: "核心規則" },
    { t: "ul", items: [
      "**已註冊**的文書按其**註冊日期**先後決定優先次序；",
      "**未註冊**的文書，對其後的**承讓人**（不論有否付出代價）而言，**不得對抗**已註冊的文書；",
      "**知悉**未註冊文書的存在，**不影響**已註冊文書的優先權（第 4 條）；",
      "文書須於簽立後**指定期限內**註冊（第 5 條），逾期會影響優先權。"
    ]},
    { t: "law", text: "第 3 條：已註冊文書的優先次序及不註冊的後果。第 4 條：未註冊文書的通知不影響已註冊文書。第 5 條：註冊期限。第 5A 條：已註冊押記令及待決案件的優先權。" },
    { t: "warn", text: "「**知悉**未註冊的按揭」不會令已註冊的買家失去優先權——這是契約註冊制度與通知原則的關鍵分別。"
    },
    { t: "eg", text: "業主先後把同一單位按給甲銀行（未註冊）和乙銀行（已註冊）。乙銀行雖然後知，仍享有優先權。" }
  ],
  tip: "記住「**先註冊先得**」（first to register），而不是「先簽署先得」。"
},

{
  id: "n3-10", part: 3, ref: ["3.7.3"], title: "《房屋條例》（第 283 章）：資助房屋的轉讓限制", level: "第2級",
  blocks: [
    { t: "p", text: "居屋、綠置居、租置計劃等資助房屋，受《房屋條例》及**政府租契條件**雙重限制。核心是**轉讓限制期**（alienation restriction period）內，業主不可自由轉讓、出租或按揭。" },
    { t: "table", head: ["條文", "內容"], rows: [
      ["第 17A 條", "房屋委員會可**售賣土地**；並可就售賣訂立條件"],
      ["第 17B 條", "**無效的讓與**：違反轉讓限制的讓與（assignment）**屬無效**"],
      ["第 27A 條", "**非法讓與**：明知而參與違反限制的讓與，屬**罪行**"],
      ["附表", "列明轉讓限制的具體內容（例如限制期、補價安排）"]
    ]},
    { t: "h", text: "實務上的三種情況" },
    { t: "ol", items: [
      "**限制期內**：一般不可轉讓；特殊情況（如繼承、離婚）須向房屋署申請；",
      "**限制期屆滿後**：可在**補地價**（補價）後於公開市場出售；未補價者只可售予**合資格人士**（白居二、綠表）；",
      "**未補價單位出租**：一般屬違反租契條件，可能導致**釘契**或收回單位。"
    ]},
    { t: "law", text: "第 283 章第 17A、17B、27A 條及附表。違反限制的讓與**無效**，且參與者可能**負上刑事責任**。" },
    { t: "eg", text: "代理安排客戶在限制期內以「私人協議」轉讓未補價居屋——該讓與**無效**，代理及雙方均可能違反第 27A 條，代理更會被紀律處分。" }
  ],
  tip: "個案題若見「未補地價居屋」、「限制期內」、「私下轉讓」，答案幾乎一定是「不可」或「無效／違法」。"
},

{
  id: "n3-11", part: 3, ref: ["3.7.4"], title: "《個人資料（私隱）條例》（第 486 章）與直接促銷", level: "第2級",
  blocks: [
    { t: "h", text: "六項保障資料原則（DPP）" },
    { t: "table", head: ["原則", "內容"], rows: [
      ["DPP1 收集", "須為**合法目的**、以**合法及公平**方式收集；收集時須告知用途及是否必須提供"],
      ["DPP2 準確及保留", "須準確、保存不超過所需時間"],
      ["DPP3 使用", "使用（包括轉移）須與**原收集目的**相符，除非取得**同意**"],
      ["DPP4 保安", "須採取**切實可行**的保安措施"],
      ["DPP5 開放", "須公開**私隱政策**及資料種類"],
      ["DPP6 查閱及改正", "資料當事人有權**查閱**及**改正**其個人資料"]
    ]},
    { t: "h", text: "直接促銷（第 35A–35M 條）" },
    { t: "ul", items: [
      "使用個人資料作**直接促銷**，須取得資料當事人的**同意**（opt-in）；",
      "首次使用時須告知當事人有權**拒絕**，並提供**免費**的拒絕途徑；",
      "當事人拒絕後，資料使用者**不得再**使用其資料作直接促銷；",
      "違反可構成**罪行**，最高罰款 $500,000 及監禁 3 年（視條文而定）；",
      "查閱資料要求須在 **40 日內**回覆（可延長）。"
    ]},
    { t: "law", text: "第 2 條：個人資料的定義。第 35A–35M 條：直接促銷的規管。附表 1：六項保障資料原則。" },
    { t: "eg", text: "代理把客戶的電話號碼交給合作裝修公司推銷——屬於**使用**及**轉移**個人資料作直接促銷，須事先取得客戶**明確同意**，否則違法。" }
  ],
  tip: "「客戶沒有反對」不等於「同意」。直接促銷必須**積極取得同意**（opt-in），沉默不是同意。"
},

{
  id: "n3-12", part: 3, ref: ["3.7.5", "3.7.6", "3.7.7"], title: "《不合情理合約條例》、《防止賄賂條例》、《失實陳述條例》", level: "第2級",
  blocks: [
    { t: "h", text: "《不合情理合約條例》（第 458 章）第 6 條" },
    { t: "p", text: "如法院裁定某合約或條款**不合情理**（unconscionable），可**拒絕執行**、**修改**或**限制**該條款。判斷時會考慮：雙方的**議價能力**、客戶是否**明白**條款、是否受到**不當影響**或壓力、條款是否**一面倒**。" },
    { t: "h", text: "《防止賄賂條例》（第 201 章）第 5 及 9 條" },
    { t: "ul", items: [
      "第 5 條：為**合約事務**（包括招標、拍賣）給予或接受利益，屬罪行；",
      "第 9 條：**代理人的貪污交易**——代理人（agent）未經其**主事人**（principal）同意，索取或接受利益，即屬犯罪；提供利益者亦犯罪；",
      "地產代理是客戶的**代理人**，收受發展商或銀行的未披露利益，可能違反第 9 條。"
    ]},
    { t: "h", text: "《失實陳述條例》（第 284 章）第 3 條" },
    { t: "p", text: "第 3(1) 條：如某人因另一方的**非欺詐性失實陳述**而訂立合約並蒙受損失，作出陳述者須負**損害賠償**責任，**除非**他能證明自己在訂約時有**合理理由相信**、並且確實相信所陳述的事實為真。第 3(2) 條：他方可**撤銷合約**；法院在特定情況下可判**損害賠償代替撤銷**。免責條款須符合《管制免責條款條例》（第 71 章）第 3(1) 條的**合理標準**。" },
    { t: "law", text: "第 458 章第 6 條：法院可拒絕執行不合情理的合約。第 201 章第 5、9 條。第 284 章第 3(1)、(2) 條。第 71 章第 3(1) 條：「合理標準」的驗證。" },
    { t: "eg", text: "代理每月向銀行職員支付 $2,000 以換取較高的估價——同時違反《防止賄賂條例》第 9 條及操守守則。" }
  ],
  tip: "《防止賄賂條例》第 9 條的關鍵詞是「**代理人**」與「**主事人同意**」。任何未經客戶同意的利益，都可能構成罪行。"
},

{
  id: "n3-13", part: 3, ref: ["3.7.8"], title: "《一手住宅物業銷售條例》（第 621 章）", level: "第2級",
  blocks: [
    { t: "p", text: "此條例規管**新盤**（未落成或未出售的一手住宅單位）的銷售，目的是確保資訊**準確、及時、透明**。地產代理銷售一手樓時必須熟悉。" },
    { t: "h", text: "必須記住的規定" },
    { t: "table", head: ["事項", "規定"], rows: [
      ["實用面積", "須按條例定義計算及表達（包括牆壁厚度的一定比例），並在售樓說明書及價單列明"],
      ["售樓說明書", "須在出售前提供；須載有條例規定的資料（位置圖、布局圖、面積、用途、批地年期等）"],
      ["價單", "須在出售日期前**最少 3 日**供公眾**免費領取**，並在售樓處及指定網站提供"],
      ["示範單位", "量度方式須符合規定；不得誤導"],
      ["臨時合約及正式合約", "買方須在簽署臨時合約後**5 個工作日**內簽署買賣合約；如買方如此做，**擁有人**須在該日期後**8 個工作日**內簽署；如買方逾期，臨時合約**終止**、訂金**沒收**"],
      ["成交紀錄冊", "賣方須備存並供公眾**免費閱覽**；須記錄成交資料"],
      ["廣告", "不得載有虛假或具誤導性的陳述；不得未經批准使用發展商名稱等"],
      ["失實陳述及虛假資料", "屬罪行，可處罰款及監禁"],
      ["電子資料庫", "監管局／政府設立的電子資料庫，供查閱一手住宅物業的資料"]
    ]},
    { t: "law", text: "第 8(1) 條：實用面積。第 15、16、20(2)、22、24(1)、24(5)、25 條：售樓說明書。第 29、31、32、34、35(1)、35(3) 條：價單及購樓意向登記。第 42 條：示範單位量度。第 47、49 條：銷售安排。第 52(1)、53 條：臨時合約及合約。第 58、60、61 條：成交紀錄冊。第 70、71、73(7)、74 條：廣告。第 75、76、78 條：失實陳述及虛假資料的處罰。第 89 條：電子資料庫。" },
    { t: "warn", text: "「5 個工作日」是**買方**簽正式合約的期限；「8 個工作日」是**擁有人**（賣方）的期限。兩者不要調轉。" }
  ],
  tip: "一手樓四大數字：**3 日**（價單）、**5 個工作日**（買方簽約）、**8 個工作日**（賣方簽約）、**24 小時**（部分資料更新）。"
},

{
  id: "n3-14", part: 3, ref: ["3.8"], title: "物業轉易流程：由臨時合約到完成交易", level: "第2級",
  blocks: [
    { t: "p", text: "香港二手住宅交易的一般流程（實務慣例，非全部由法例規定）：" },
    { t: "ol", items: [
      "**簽署臨時買賣合約**（provisional agreement）：買方支付**細訂**（通常樓價 3–5%）；合約即時具約束力（除非另訂「以正式合約為準」）；",
      "**簽署正式買賣合約**（formal agreement）：一般在臨時合約後 **14 天**內簽署，買方支付**大訂**（連細訂合共約 10%）；",
      "**業權查核**：買方律師審查業權（title），提出**業權質詢**（requisitions）；",
      "**安排按揭**：買方向銀行申請按揭，銀行進行估價及審批；",
      "**完成交易**（completion）：簽署**轉讓契**（assignment）及按揭契，支付樓價餘款，交收鎖匙；",
      "**註冊**：律師將轉讓契及按揭契送交土地註冊處註冊。"
    ]},
    { t: "h", text: "代理在流程中的角色" },
    { t: "ul", items: [
      "安排簽署臨時合約、解釋條款（如客戶無律師代表）；",
      "提醒客戶**簽約前**查冊及看清楚**產權負擔**；",
      "轉介律師及銀行（如客戶要求），但**不得**強迫或收取未披露的回佣；",
      "跟進交易進度，但不應提供**法律意見**。"
    ]},
    { t: "law", text: "《常規規例》第 13 條：簽署買賣協議或租契前，須安排**土地查冊**並向買方提供結果文本；如客戶沒有律師代表，須解釋每項條文。" },
    { t: "eg", text: "代理催促客戶在未看查冊結果前簽臨時合約——即使客戶最終同意，代理亦可能因未履行第 13 條及「應盡的努力」而違規。" }
  ],
  tip: "「**細訂**」在臨時合約時支付；「**大訂**」在正式合約時支付，兩者合計一般約樓價 10%。"
},

{
  id: "n3-15", part: 3, ref: ["3.9"], title: "按揭（Mortgage）實務", level: "第2級",
  blocks: [
    { t: "h", text: "按揭的形式" },
    { t: "ul", items: [
      "**法定押記**（legal charge）：最常見，以契據形式設定；",
      "**衡平法按揭**（equitable mortgage）：例如以存放業權契據方式設定；",
      "**浮動押記**（floating charge）：適用於公司資產，包括日後取得的物業。"
    ]},
    { t: "h", text: "主要條款" },
    { t: "ul", items: [
      "貸款額、利率（**浮息** HIBOR-based／P-rate-based，或**定息**）、還款期；",
      "**按揭成數**（LTV）：受金管局指引限制；",
      "**供款與收入比率**（DSR）及**壓力測試**；",
      "提早還款罰息、逾期還款費用；",
      "違約時承按人的**出售權**（power of sale）。"
    ]},
    { t: "h", text: "批核的一般考慮" },
    { t: "ol", items: ["物業估價（銀行委託估價師）；", "借款人收入及還款能力；", "信貸紀錄；", "物業類型及樓齡（影響按揭年期）；", "是否符合按揭保險計劃的資格。"]},
    { t: "law", text: "《物業轉易及財產條例》（第 219 章）第 44 條：法定產業權的按揭。第 45 條：按揭優先清償。第 53 條：承按人所作售賣。第 56 條：藉經簽署的收據解除按揭。" },
    { t: "warn", text: "代理**不可**提供按揭意見或保證獲批。若代理聲稱「一定批到九成」，可能構成失實陳述。" }
  ],
  tip: "「浮息」隨市場利率變動；「定息」在指定期內固定。壓力測試是**加息 2%** 後仍符合供款比率（按金管局指引）。"
},

{
  id: "n3-16", part: 3, ref: ["3.10"], title: "物業相關稅項", level: "第2級",
  blocks: [

  q: "下列哪些情況**可能違反**《地產代理條例》第 15 或 16 條？(i) 未領牌的公司在報章刊登廣告代客放盤並收取佣金 (ii) 持牌營業員以個人名義與業主簽署代理協議並自行收取佣金 (iii) 持牌地產代理僱用無牌人士帶客睇樓 (iv) 律師在執業過程中處理物業買賣文件",
  o: ["只有 (i) 和 (ii)", "只有 (i)、(ii) 和 (iii)", "只有 (ii) 和 (iv)", "只有 (iii) 和 (iv)", "(i)、(ii)、(iii) 和 (iv)"],
  a: 1, why: "(i) 無牌經營業務，違反第 15 條；(ii) 營業員只可以受僱身分工作，不可自行經營業務或收取佣金，違反第 15／16 條；(iii) 僱用無牌人士從事地產代理工作，違反第 39(1) 條及第 16 條的精神。(iv) 律師在執業過程中處理相關文件屬第 2(2)(b) 條的**豁免**，不違反條例。", note: "第 2(2)、15、16、39 條"
},
{
  id: "p2-04", p: 2, ref: "s.19-21", tag: "發牌條件", lvl: 4,
  q: "就申請**地產代理（個人）牌照**，下列哪些是必須符合的條件？(i) 完成中學五年級或同等程度教育 (ii) 申請當日年滿 18 歲 (iii) 在申請前 12 個月內通過資格考試 (iv) 持有大學學位",
  o: ["只有 (i) 和 (ii)", "只有 (i)、(ii) 和 (iii)", "只有 (ii)、(iii) 和 (iv)", "只有 (i)、(iii) 和 (iv)", "(i)、(ii)、(iii) 和 (iv)"],
  a: 1, why: "基本發牌條件為：中五學歷、年滿 18 歲、申請前 12 個月內通過資格考試，以及獲監管局認為是「適當人選」。**(iv) 大學學位並非必要條件**。", note: "第 19–21 條；《發牌規例》第 6、7 條"
},
{
  id: "p2-05", p: 2, ref: "s.7 (511A)", tag: "發牌條件", lvl: 4,
  q: "某人的資格考試合格成績已發出 **14 個月**，他現在申請地產代理（個人）牌照。下列哪項正確？",
  o: ["仍可申請，因為成績永久有效", "不可申請，因為成績只在合格後 12 個月內有效", "只可申請營業員牌照", "須重新繳付牌照費即可", "可由監管局酌情豁免"],
  a: 1, why: "資格考試成績只可用於**合格後 12 個月內**的牌照申請。超過 12 個月，須重新報考。此規定見《發牌規例》及考試手冊。", note: "《發牌規例》第 7 條；考試手冊"
},
{
  id: "p2-06", p: 2, ref: "s.23 (511A)", tag: "續期", lvl: 4,
  q: "持牌人的牌照將於 12 月 31 日屆滿。他應在何時提出**續期申請**？",
  o: ["屆滿前 6 個月至 3 個月", "屆滿前 3 個月至 1 個月", "屆滿前 31 天內", "屆滿後 1 個月內", "任何時間均可"],
  a: 1, why: "《發牌規例》第 9 條：牌照續期申請須於有效期屆滿前 **3 個月至 1 個月**的期間內提出，或於監管局書面准許的其他期間提出。", note: "《發牌規例》第 9 條"
},
{
  id: "p2-07", p: 2, ref: "s.14", tag: "登記地址", lvl: 4,
  q: "關於「登記地址」（registered address），下列哪項**最正確**？",
  o: ["必須與營業地點相同", "是持牌人可接收監管局文件的通訊地址，可與營業地點不同", "只適用於公司持牌人", "必須是商業大廈地址", "由監管局隨機編配"],
  a: 1, why: "登記地址是持牌人的**通訊地址**，用作送達文件，可以是住宅或商業地址，與營業地點（須有營業詳情說明書）不同。更改登記地址須通知監管局。", note: "第 14 條"
},
{
  id: "p2-08", p: 2, ref: "s.13", tag: "登記冊", lvl: 4,
  q: "下列哪項**不屬於**監管局備存的登記冊所記載的內容？",
  o: ["持牌人的牌照號碼", "牌照的有效期", "暫時吊銷期間及撤銷日期", "持牌人的信貸評級", "營業詳情說明書的營業地點"],
  a: 3, why: "登記冊記載牌照號碼、姓名／名稱、登記地址、有效期、暫時吊銷期間、撤銷日期、終止從業日期，以及營業詳情說明書的資料。**信貸評級**不屬登記冊內容。", note: "第 13 條；《發牌規例》附表"
},
{
  id: "p2-09", p: 2, ref: "s.38", tag: "有效控制", lvl: 4,
  q: "某持牌地產代理公司開設新分行。下列哪些是**必須**符合的要求？(i) 為新分行取得營業詳情說明書 (ii) 委任一名**持地產代理牌照**的個人為分行經理 (iii) 該經理通常在该分行以經理身分行事 (iv) 該經理可同時管理另一間代理公司的分行",
  o: ["只有 (i) 和 (ii)", "只有 (i)、(ii) 和 (iii)", "只有 (ii) 和 (iv)", "只有 (iii) 和 (iv)", "(i)、(ii)、(iii) 和 (iv)"],
  a: 1, why: "第 38 條要求每個辦事處由一名持**地產代理牌照**的個人任經理，在該辦事處通常以經理身分行事並管理業務；分行亦須有營業詳情說明書。(iv) 錯誤：一名經理不可同時控制另一名代理的辦事處。", note: "第 38 條"
},
{
  id: "p2-10", p: 2, ref: "s.38", tag: "有效控制", lvl: 4,
  q: "某分行經理因事離港三個月，期間由一名**持牌營業員**代為「看鋪」並自稱經理。下列哪項正確？",
  o: ["可以，因為該營業員已持牌", "不可以，因為經理職位必須由持地產代理牌照的人出任", "可以，只要通知監管局", "可以，只要該營業員有五年經驗", "不可以，因為分行不可由任何人管理"],
  a: 1, why: "第 38(1)(a) 條規定經理須為**持地產代理牌照**的個人；第 38(1)(b)(ii) 條更規定任何人除非是持牌地產代理，否則不得**看來是**接受委任或依據委任行事（第 55(1)(g) 條罪行）。營業員即使持牌亦不符合資格。", note: "第 38(1)(a)、(b)(ii)、55(1)(g) 條"
},
{
  id: "p2-11", p: 2, ref: "s.36", tag: "物業資料", lvl: 4,
  q: "根據第 36 條，持牌地產代理就其所訂立代理協議的住宅物業，須履行下列哪些責任？(i) 管有或控制訂明的資料 (ii) 在合理範圍內確保信納資料準確 (iii) 將接獲的每一項要約通知賣方客戶（除客戶以明示方式指示無須通知） (iv) 向客戶披露自己對該物業的金錢或其他實益權益",
  o: ["只有 (i) 和 (ii)", "只有 (i)、(ii) 和 (iii)", "只有 (ii) 和 (iv)", "只有 (i)、(iii) 和 (iv)", "(i)、(ii)、(iii) 和 (iv)"],
  a: 4, why: "第 36(1)(a) 條共七項責任，包括：(i) 管有或控制訂明資料；(ii) 在合理範圍內確保信納準確；(iii) 通知每一項要約（除客戶明示指示無須通知）；(iv) 披露金錢及其他實益權益。全部正確。", note: "第 36(1)(a) 條"
},
{
  id: "p2-12", p: 2, ref: "s.36(4)", tag: "物業資料", lvl: 4,
  q: "代理沒有遵守第 36(1) 條的規定，導致買方蒙受損失。下列哪項**最正確**？",
  o: ["只有監管局可作出紀律處分，買方無權追討", "沒有遵守規定即構成**訴因**，買方可追討損害賠償", "買方只能投訴，不能興訟", "代理只須退還佣金", "代理須負刑事責任，但無民事責任"],
  a: 1, why: "第 36(4) 條：凡持牌地產代理沒有遵守適用於他的第 36(1) 條任何規定，而導致客戶蒙受損失或損害，**沒有遵守該等規定即構成訴因**，可追討損害賠償或其他濟助。同時亦可招致紀律處分。", note: "第 36(4) 條"
},
{
  id: "p2-13", p: 2, ref: "s.36(5)", tag: "物業資料", lvl: 4,
  q: "就第 36 條的法律程序，下列哪項是持牌人的**免責辯護**？",
  o: ["他已委任律師處理", "他已採取一切合理步驟並已盡一切應盡的努力避免違規", "他不知道法例規定", "客戶沒有主動查詢", "他已收取佣金"],
  a: 1, why: "第 36(5) 條及第 30(3) 條均規定：如持牌人證明已採取**一切合理步驟**並已盡**一切應盡的努力**避免違規，即為免責辯護。若涉及資料準確性，證明已倚賴訂明來源、倚賴合理並已採取可行步驟，即視為已證明免責。", note: "第 36(5)、30(3) 條"
},
{
  id: "p2-14", p: 2, ref: "s.36(2)", tag: "物業資料", lvl: 4,
  q: "下列哪項**不是**第 36(2) 條所指的「訂明資料」？",
  o: ["物業的總計或全部面積", "物業的落成年份（以佔用許可證為準）", "政府租契的未滿年期及續期權利", "單位的風水評分", "賣方就結構上的增建或改建所作的聲明"],
  a: 3, why: "第 36(2) 條列出的訂明資料包括擁有權及產權負擔、面積、落成年份、用途限制、租契未滿年期及續期權利、建議租契年期，以及賣方就結構增建及修葺的聲明。**風水評分**不屬訂明資料。", note: "第 36(2) 條"
},
{
  id: "p2-15", p: 2, ref: "s.40", tag: "通知", lvl: 4,
  q: "持牌地產代理公司有以下變動。哪一項**不須**在 31 天內以書面通知監管局？",
  o: ["僱用一名新營業員", "終止僱用一名營業員", "委任一名新分行經理", "公司更改內部電腦系統", "公司委任一名新董事"],
  a: 3, why: "第 40 條規定須在 31 天內通知的事項為：持牌人終止從業、僱用或終止僱用營業員、委任或終止委任經理、公司董事的委任或終止，以及成為或終止為合夥成員。**更改內部電腦系統**不屬通知事項。", note: "第 40 條"
},
{
  id: "p2-16", p: 2, ref: "s.40", tag: "通知", lvl: 4,
  q: "持牌人於 3 月 1 日終止從事地產代理工作。他最遲應在何時通知監管局？",
  o: ["3 月 15 日", "3 月 31 日", "4 月 1 日", "4 月 30 日", "毋須通知"],
  a: 2, why: "第 40(1) 條：持牌人終止從事地產代理工作，須在自終止起計的 **31 天**期間屆滿前以書面通知監管局。計算期間時，事發當日（3 月 1 日）不計算在內，由 3 月 2 日起計 31 天，即 **4 月 1 日**。", note: "第 40(1) 條；《釋義及通則條例》"
},
{
  id: "p2-17", p: 2, ref: "s.42", tag: "董事責任", lvl: 4,
  q: "某持牌地產代理公司觸犯《地產代理條例》的罪行，而該罪行是經公司**董事**同意而犯。下列哪項正確？",
  o: ["只有公司須負責", "只有董事須負責，公司不受影響", "公司及該董事均可能犯罪，董事可被判處相同刑罰", "董事只須負民事責任", "公司須即時清盤"],
  a: 2, why: "第 42 條：如公司觸犯條例所訂罪行，而該罪行證明是經**董事、經理、秘書或其他類似人員的同意或縱容**而犯，或是可歸因於他們的疏忽，則該人**同樣犯罪**，可被判處相同刑罰。", note: "第 42 條"
},
{
  id: "p2-18", p: 2, ref: "s.30", tag: "紀律處分", lvl: 4,
  q: "投訴成立後，監管局或紀律委員會可採取下列哪些紀律處分？(i) 譴責持牌人 (ii) 判處罰款 $500,000 (iii) 暫時吊銷牌照三年 (iv) 撤銷牌照 (v) 在牌照上附加條件",
  o: ["只有 (i)、(iii) 和 (iv)", "只有 (i)、(iv) 和 (v)", "只有 (ii)、(iii) 和 (iv)", "只有 (i)、(ii) 和 (v)", "(i)、(ii)、(iii)、(iv) 和 (v)"],
  a: 1, why: "第 30 條的制裁包括：訓誡或譴責、附加條件、更改條件、暫時吊銷（**不超過 2 年**）、撤銷牌照、罰款（**不超過 $300,000**）、命令支付費用。(ii) $500,000 超過罰款上限；(iii) 三年超過吊銷上限。", note: "第 30(1) 條"
},
{
  id: "p2-19", p: 2, ref: "s.30(5)", tag: "紀律處分", lvl: 4,
  q: "監管局作出紀律決定後，須在多少天內以書面通知持牌人並說明理由？",
  o: ["7 天", "14 天", "21 天", "31 天", "60 天"],
  a: 2, why: "第 30(5)(a)(i) 條：監管局須自有關決定日期起計 **21 天**內，將決定以書面通知持牌人及受影響人士，並須說明理由；如屬暫時吊銷，須說明期間。", note: "第 30(5) 條"
},
{
  id: "p2-20", p: 2, ref: "s.30", tag: "紀律處分", lvl: 4,
  q: "關於紀律制裁，下列哪項**正確**？",
  o: ["持牌人上訴期間，制裁自動暫停生效", "牌照被撤銷時，已繳的牌照費可獲退還", "即使持牌人已提出上訴，制裁仍自通知日期起生效", "罰款最高 $500,000", "監管局可判處監禁"],
  a: 2, why: "第 30(5)(b) 條：權力的行使自通知日期起生效（或通知所指明的較遲日期），**即使**持牌人已上訴、上訴期未屆滿或公告未刊登，仍會生效。費用不退還（第 30(6) 條）；罰款上限 $300,000；監管局不可判監禁。", note: "第 30(5)(b)、(6) 條"
},
{
  id: "p2-21", p: 2, ref: "s.31-34", tag: "上訴", lvl: 4,
  q: "持牌人不服紀律委員會的決定，應向下列哪一個機構提出上訴？",
  o: ["行政長官會同行政會議", "上訴委員團組成的審裁小組", "區域法院", "高等法院原訟法庭", "立法會"],
  a: 1, why: "第 31–34 條：不服監管局或紀律委員會的決定，可向**上訴委員團**（成員由行政長官委任）組成的**審裁小組**上訴。至於**佣金爭議**的裁定，上訴則向**區域法院**提出——兩者不要混淆。", note: "第 31–34、50 條"
},
{
  id: "p2-22", p: 2, ref: "s.55(1)", tag: "罪行", lvl: 4,
  q: "下列哪些行為屬第 55(1) 條的罪行？(i) 無牌經營地產代理業務 (ii) 在牌照申請中提供虛假資料 (iii) 妨礙監管局執行職能 (iv) 持牌人使用牌照以外的名稱經營業務",
  o: ["只有 (i) 和 (ii)", "只有 (i)、(ii) 和 (iii)", "只有 (ii)、(iii) 和 (iv)", "只有 (i) 和 (iv)", "(i)、(ii)、(iii) 和 (iv)"],
  a: 1, why: "(i)(ii)(iii) 均屬第 55(1) 條（任何人）的罪行。(iv) 使用牌照以外的名稱屬第 55(**2**)(a) 條，是針對**持牌人**的罪行，不在第 55(1) 條之內。", note: "第 55(1)、(2) 條"
},
{
  id: "p2-23", p: 2, ref: "s.55(3)", tag: "罪行", lvl: 4,
  q: "無牌經營地產代理業務（第 55(1)(a) 條），一經循公訴程序定罪，最高刑罰是：",
  o: ["罰款 $100,000 及監禁 6 個月", "罰款 $200,000 及監禁 1 年", "罰款 $300,000 及監禁 3 年", "罰款 $500,000 及監禁 2 年", "罰款 $1,000,000 及監禁 5 年"],
  a: 3, why: "第 55(3)(a) 條：犯第 55(1)(a) 條（無牌經營）的罪行，一經循公訴程序定罪，可處罰款 **$500,000** 或監禁 **2 年**（或兼處）。這是條例中最重的刑罰。", note: "第 55(3)(a) 條"
},
{
  id: "p2-24", p: 2, ref: "s.55(6)", tag: "罪行", lvl: 4,
  q: "任何人被裁定犯了《地產代理條例》所訂罪行，法庭可命令取消其持有牌照的資格，最長期間為：",
  o: ["1 年", "2 年", "3 年", "5 年", "永久"],
  a: 3, why: "第 55(6)(a) 條：法庭或裁判官可命令在自定罪日期起計**不超過 5 年**的期間取消該人持有牌照的資格；其持有的牌照自命令日期起終止有效。", note: "第 55(6) 條"
},
{
  id: "p2-25", p: 2, ref: "s.45", tag: "代理協議", lvl: 4,
  q: "代理口頭答應替業主放盤，雙方從未簽署任何文件。交易成功後業主拒絕支付佣金。下列哪項**最正確**？",
  o: ["代理可憑口頭協議入稟追討佣金", "代理可能無法透過訴訟追討佣金，因為未符合第 45 條的規定", "業主一定須支付佣金，因為交易已完成", "代理只可向監管局投訴，不能興訟", "口頭協議自動無效，代理可沒收訂金"],
  a: 1, why: "第 45 條：代理只在此情況下才具有起訴權——(a) 已訂立並妥善簽立**以訂明格式**作出、載有訂明詳情的代理協議；及 (b) 簽立時代理是持牌地產代理。口頭協議不符合規定，代理**可能無法透過訴訟追討佣金**。", note: "第 45 條"
},
{
  id: "p2-26", p: 2, ref: "s.47, s.48", tag: "代理協議", lvl: 4,
  q: "關於提供地產代理協議副本，下列哪項**正確**？",
  o: ["只須在成交後提供一份", "第 47 條要求提供未簽立的協議副本，第 48 條要求提供已簽立的協議副本", "只有客戶主動要求時才須提供", "副本須由監管局核證", "口頭協議亦須提供副本"],
  a: 1, why: "第 47 條：須向客戶提供**未簽立**的地產代理協議副本；第 48 條：協議簽立後，須向客戶提供**已簽立**的協議副本。這是保障客戶知情權的規定。", note: "第 47、48 條"
},
{
  id: "p2-27", p: 2, ref: "表格 1-6", tag: "訂明表格", lvl: 4,
  q: "業主委託代理**出租**其住宅單位，應使用哪一份訂明表格？",
  o: ["表格 1", "表格 2", "表格 3", "表格 5", "表格 6"],
  a: 3, why: "表格 5 是與**業主**訂立的地產代理協議（出租住宅物業）。表格 2 是出租資料表格（由業主填報物業資料），兩者不同：**表格 5 是代理協議，表格 2 是資料表格**。", note: "《常規規例》訂明表格"
},
{
  id: "p2-28", p: 2, ref: "表格 1", tag: "訂明表格", lvl: 4,
  q: "關於「物業資料表格」（表格 1），下列哪項**最正確**？",
  o: ["由代理填寫並負上全部法律責任", "由賣方填寫，代理在合理範圍內核實並向買方提供", "由買方填寫", "由律師填寫", "只適用於一手住宅物業"],
  a: 1, why: "表格 1 是**賣方的陳述**，由賣方填寫；代理的角色是在合理範圍內**核實**（第 36(1)(a)(ii) 條）並向買方提供。第 36(7) 條聲明：條例不要求代理或賣方**保證**該聲明準確。", note: "第 36(2)(g)、36(7) 條"
},
{
  id: "p2-29", p: 2, ref: "s.9 (511C)", tag: "廣告", lvl: 4,
  q: "代理就某住宅物業刊登廣告，下列哪些做法**違反**《常規規例》第 9 條？(i) 未取得賣方書面同意即刊登廣告 (ii) 以低於賣方指示的價格刊登「吸客價」 (iii) 物業已售出後仍未移除廣告 (iv) 在廣告中列明代理的牌照號碼",
  o: ["只有 (i) 和 (ii)", "只有 (i)、(ii) 和 (iii)", "只有 (ii)、(iii) 和 (iv)", "只有 (iii) 和 (iv)", "(i)、(ii)、(iii) 和 (iv)"],
  a: 1, why: "第 9(2) 條要求賣方**書面同意**才可發出廣告；(3) 不得以有別於客戶指示的價格宣傳；(5) 物業不再可供出售後須盡快移除廣告。(iv) 列明牌照號碼是**正確**做法，不違規。", note: "《常規規例》第 9 條"
},
{
  id: "p2-30", p: 2, ref: "s.10 (511C)", tag: "視察", lvl: 4,
  q: "代理帶買方視察單位時，下列哪項**不符合**《常規規例》的規定？",
  o: ["在賣方事先同意下安排視察", "陪同買方視察", "在買方指示下不陪同視察", "未經賣方同意下把鎖匙交給買方自行參觀", "在簽署協議前擬備連同物業處置物品的書面清單"],
  a: 3, why: "第 10(b) 條：未經住宅物業的賣方**事先同意**，不得安排任何人視察和查看該物業。把鎖匙交給買方自行參觀，既未經同意，亦無代理陪同，違反第 10(a)(b) 條。", note: "《常規規例》第 10 條"
},
{
  id: "p2-31", p: 2, ref: "s.12 (511C)", tag: "客戶款項", lvl: 4,
  q: "代理收到買方支付的臨時訂金 $50,000。下列哪些做法**符合**《常規規例》第 12 條？(i) 即時發出書面收據 (ii) 存入公司一般營運戶口 (iii) 存入認可機構的信託戶口 (iv) 保留收據副本最少 3 年",
  o: ["只有 (i) 和 (ii)", "只有 (i)、(iii) 和 (iv)", "只有 (ii) 和 (iv)", "只有 (iii) 和 (iv)", "(i)、(ii)、(iii) 和 (iv)"],
  a: 1, why: "第 12 條：須即時發出書面收據並保留副本**最少 3 年**；客戶款項須存入**認可機構的信託戶口**，不可存入公司一般戶口（否則屬混同款項）。(ii) 違反規定。", note: "《常規規例》第 12 條"
},
{
  id: "p2-32", p: 2, ref: "s.12(7) (511C)", tag: "客戶款項", lvl: 4,
  q: "買方把訂金支票交給代理，其後賣方不接受要約。代理應怎樣處理該支票？",
  o: ["保留至有新買家為止", "轉交賣方作為補償", "在切實可行範圍內盡快歸還買方", "存入公司信託戶口 six 個月", "用作支付代理的廣告費"],
  a: 2, why: "第 12(7)(c) 條：如買方購買或承租物業的要約**不獲賣方接受**，持牌地產代理須在切實可行範圍內**盡快將買方的支票或訂金歸還買方**。", note: "《常規規例》第 12(7)(c) 條"
},
{
  id: "p2-33", p: 2, ref: "s.13 (511C)", tag: "協議及查冊", lvl: 4,
  q: "客戶沒有聘請律師，準備簽署臨時買賣合約。根據《常規規例》第 13 條，代理應：",
  o: ["代客戶簽署合約", "向客戶解釋每項條文，並在客戶不明白時建議尋求法律意見", "只把合約交給客戶自行閱讀", "要求客戶簽署免責聲明", "拒絕協助客戶"],
  a: 1, why: "第 13(1) 條：在並非由律師代表的客戶訂立住宅物業買賣協議或租契之前，代理須**解釋每項條文的涵義**、促使其注意重要條款，如客戶不明白，須**建議尋求法律意見**。代理不可代客戶簽署或提供法律意見。", note: "《常規規例》第 13(1) 條"
},
{
  id: "p2-34", p: 2, ref: "s.14 (511C)", tag: "佣金", lvl: 4,
  q: "代理向客戶推薦某律師行，並從律師行收取轉介費。下列哪項**正確**？",
  o: ["只要收費合理即可", "必須在推薦前向客戶披露該利益，否則不得推薦", "只須在成交後披露", "轉介費屬行業慣例，毋須披露", "只須向監管局申報"],
  a: 1, why: "第 14(2) 條：如向客戶推薦其他人的服務而該推薦可能對持牌人帶來金錢或其他實益權益，持牌人**在推薦前必須向客戶披露**該等權益，否則不得作出該推薦。這亦是操守守則「披露利益」的要求。", note: "《常規規例》第 14(2) 條"
},
{
  id: "p2-35", p: 2, ref: "s.14(1) (511C)", tag: "佣金", lvl: 4,
  q: "甲代理是主代理，乙代理是分銷放盤代理。乙代理可否直接向甲代理的客戶（賣方）要求支付佣金？",
  o: ["可以，只要事先通知甲代理", "可以，只要佣金數額合理", "不可以，分銷放盤代理不得向主代理的客戶要求佣金", "可以，但只限一半佣金", "不可以，因為分銷代理無權收取任何佣金"],
  a: 2, why: "第 14(1) 條：以**分銷放盤代理**身分行事的持牌人，**不得向主代理的有關客戶要求支付任何佣金**。分銷代理的佣金應向主代理追討。", note: "《常規規例》第 14(1) 條"
},
{
  id: "p2-36", p: 2, ref: "s.49-52", tag: "佣金爭議", lvl: 4,
  q: "代理與業主就佣金數額發生爭議，雙方同意交由監管局裁定。業主不服裁定，可向哪個法院上訴？",
  o: ["小額錢債審裁處", "區域法院", "高等法院原訟法庭", "終審法院", "土地審裁處"],
  a: 1, why: "第 50 條：不服監管局就佣金爭議所作的裁定，可向**區域法院**提出上訴。第 52 條：裁定可在區域法院登記，登記後即成為區域法院的判決。", note: "第 49–52 條"
},
{
  id: "p2-37", p: 2, ref: "s.15 (511C)", tag: "有效控制", lvl: 4,
  q: "下列哪一項**最能**符合《常規規例》第 15 條「有效控制」的要求？",
  o: ["在員工手冊寫上「必須遵守法例」", "設立書面程序、指定合規負責人、定期抽查檔案並記錄", "每月開會提醒同事小心", "要求員工自行簽署承諾書", "只在發生投訴後才檢討"],
  a: 1, why: "第 15 條要求持牌地產代理設立**妥善的程序或制度**以監督和管理業務，確保僱員遵守條例。可稽核的制度（書面程序、責任人、抽查、記錄）才是有效控制；口頭提醒或一般承諾不足以證明。", note: "《常規規例》第 15 條"
},
{
  id: "p2-38", p: 2, ref: "操守守則", tag: "操守", lvl: 4,
  q: "代理游說買方購入一個由某公司擁有的物業，而代理本身是該公司的大股東，卻沒有告知買方。代理**最可能**違反了甚麼？",
  o: ["《物業轉易及財產條例》", "操守守則中有關披露利益及避免利益衝突的規定", "《城市規劃條例》", "《建築物管理條例》", "沒有任何違反，因為代理有權投資"],
  a: 1, why: "操守守則要求持牌人**向各方詳盡披露**因該物業可獲得的金錢或其他實益利益，並**盡量減少利益衝突**。代理隱瞞大股東身分，亦可能違反第 36(1)(a)(vi) 條的披露責任。", note: "操守守則；第 36(1)(a)(vi) 條"
},
{
  id: "p2-39", p: 2, ref: "操守守則", tag: "操守", lvl: 4,
  q: "下列哪些行為**可能違反**操守守則？(i) 誇大現金回贈金額 (ii) 未經客戶同意把客戶電話交給裝修公司 (iii) 向客戶訛稱競爭對手「被釘牌」 (iv) 應客戶要求介紹律師行",
  o: ["只有 (i) 和 (ii)", "只有 (ii) 和 (iii)", "只有 (i)、(ii) 和 (iii)", "只有 (i)、(iii) 和 (iv)", "(i)、(ii)、(iii) 和 (iv)"],
  a: 2, why: "(i) 失實陳述；(ii) 未經同意轉移個人資料作促銷，違反私隱條例及操守守則；(iii) 惡意貶低同業、散播虛假資訊。(iv) **應客戶要求**介紹律師行本身不違規（除非收取未披露的利益）。", note: "操守守則；《常規規例》第 14(2) 條"
},
{
  id: "p2-40", p: 2, ref: "2.1", tag: "監管局", lvl: 4,
  q: "關於地產代理監管局，下列哪項**正確**？",
  o: ["是政府部門，職員屬公務員", "是根據《地產代理條例》設立的法定機構", "由立法會直接管理", "只負責審批牌照，不負責紀律處分", "可自行制定《地產代理條例》"],
  a: 1, why: "監管局是根據《地產代理條例》設立的**法定機構**（並非政府部門），負責發牌、規管、調查、紀律處分及行業推廣。制定條例是立法會的權力。", note: "第 4、5、6 條"
},

/* ===================== 第 4 部份：土地註冊、查冊 ===================== */
{
  id: "p4-01", p: 4, ref: "4.2", tag: "註冊制度", lvl: 4,
  q: "香港的土地註冊制度屬於下列哪一種？",
  o: ["業權註冊制度（Torrens system）", "契約註冊制度（registration of deeds）", "混合制度", "土地佔用制度", "毋須註冊"],
  a: 1, why: "香港實行**契約註冊制度**：土地註冊處登記的是**文書**（契據），而不是業權。因此查冊只顯示已註冊的文書，不保證業權完整，須由律師審查業權鏈。", note: "第 4.2 部份；《土地註冊條例》"
},
{
  id: "p4-02", p: 4, ref: "4.1", tag: "查冊結構", lvl: 4,
  q: "一份土地登記冊通常**不包括**下列哪一部分？",
  o: ["物業資料（Property Particulars）", "業主資料（Owner Particulars）", "產權負擔（Incumbrances）", "等待註冊的契約（Deeds Pending Registration）", "業主的信貸報告"],
  a: 4, why: "土地登記冊分為四部分：物業資料、業主資料、產權負擔、等待註冊的契約。**信貸報告**不是土地登記冊的內容（信貸紀錄由信貸資料服務機構提供）。", note: "第 4.1 部份"
},
{
  id: "p4-03", p: 4, ref: "4.1.2", tag: "擁有形式", lvl: 4,
  q: "查冊顯示業主為「A and B as JOINT TENANTS」。A 去世後，其業權應如何處理？",
  o: ["由 A 的遺產繼承人繼承", "自動歸 B 所有（生存者取得權）", "由法院拍賣", "須由 A 的遺囑指定", "業權自動歸政府"],
  a: 1, why: "聯權共有（joint tenants）的特徵是「**生存者取得權**」（right of survivorship）：一方去世，業權**自動**歸生存的一方，不經遺產承辦。這與分權共有（tenants in common）不同。", note: "《物業轉易及財產條例》第 11 條"
},
{
  id: "p4-04", p: 4, ref: "4.1.2", tag: "擁有形式", lvl: 4,
  q: "單位由三人以「分權共有」（tenants in common）形式持有，各佔三分之一。其中一人想出售其份數，下列哪項**最正確**？",
  o: ["必須其餘兩人同意才可出售", "他可出售其三分之一份數，但須留意其他共有人可能有的優先購買權", "他不可出售，因為物業不可分割", "他必須先取得監管局批准", "他只能把份數轉讓給政府"],
  a: 1, why: "分權共有人的份數可**獨立處置**（包括出售或依遺囑繼承），但實務上須查看是否有公契或協議訂明其他共有人的優先購買權。聯權共有才須所有共有人共同處置。", note: "第 4.1.2 部份"
},
{
  id: "p4-05", p: 4, ref: "4.1.4", tag: "註冊摘要", lvl: 4,
  q: "土地查冊中的「註冊摘要」（memorial）通常**不包括**下列哪項？",
  o: ["註冊摘要編號", "文書日期及註冊日期", "文書性質（如 ASSIGNMENT、MORTGAGE）", "業主的婚姻狀況", "代價（consideration）"],
  a: 3, why: "註冊摘要記載：註冊摘要編號、文書日期、註冊日期、文書性質、各方及代價。**業主的婚姻狀況**不屬註冊摘要內容。", note: "第 4.1.4 部份"
},
{
  id: "p4-06", p: 4, ref: "4.1.3", tag: "產權負擔", lvl: 4,
  q: "查冊的 Incumbrances 部分顯示一項 `MORTGAGE`，但沒有相應的 `DISCHARGE`。代理應怎樣理解？",
  o: ["按揭已自動解除", "按揭仍然有效，須在成交時由賣方清還並取得解除文件", "該按揭與買家無關", "須由買家承擔該按揭", "可視為已清還，毋須理會"],
  a: 1, why: "有 MORTGAGE 而無 DISCHARGE，表示按揭**仍然有效**。成交時賣方須以售價清還按揭，並由銀行發出解除文件（discharge／receipt）送交註冊。代理應提醒客戶及律師處理。", note: "第 4.1.3 部份；第 219 章第 56 條"
},
{
  id: "p4-07", p: 4, ref: "4.2.1", tag: "查冊類型", lvl: 4,
  q: "下列哪種情況**最需要**進行「歷史查冊」（historical search）？",
  o: ["首次委託出售一個新落成單位", "買家想了解單位的裝修", "物業曾多次轉手，業權文件出現斷層", "業主想查詢管理費", "代理想了解樓價走勢"],
  a: 2, why: "歷史查冊用於審查**過往的轉讓紀錄**，以核實業權鏈。當物業多次轉手、文件不完整、涉及遺產或祖堂時，須做歷史查冊。一般現時查冊只顯示現況。", note: "第 4.2.1 部份"
},
{
  id: "p4-08", p: 4, ref: "4.2.2", tag: "查冊方法", lvl: 4,
  q: "代理可透過下列哪些途徑進行土地查冊？(i) 綜合註冊資訊系統（IRIS） (ii) 親身到土地註冊處 (iii) 透過律師代查 (iv) 向監管局查詢",
  o: ["只有 (i) 和 (ii)", "只有 (i)、(ii) 和 (iii)", "只有 (ii) 和 (iv)", "只有 (iii) 和 (iv)", "(i)、(ii)、(iii) 和 (iv)"],
  a: 1, why: "查冊可透過 IRIS、親身到土地註冊處，或透過律師／第三者代查。**監管局不提供土地查冊服務**，故 (iv) 錯誤。查冊須繳付政府費用。", note: "第 4.2.2 部份"
},
{
  id: "p4-09", p: 4, ref: "4.3.2", tag: "查冊分析", lvl: 4,
  q: "查冊顯示一項「等待註冊的契約」（deeds pending registration），內容為買賣合約。下列哪項**最正確**？",
  o: ["該合約一定無效", "可能代表業主已與他人簽約，屬重大交易風險", "只影響按揭，不影響買賣", "代表交易已完成", "代理可自行刪除該紀錄"],
  a: 1, why: "等待註冊的契約指已送交土地註冊處但**未完成註冊**的文書。若為買賣合約，可能表示業主已與另一買家簽約（「一樓二賣」風險），代理應立即停止推銷並建議客戶徵詢法律意見。", note: "第 4.1.4、4.3 部份"
},
{
  id: "p4-10", p: 4, ref: "4.3.3", tag: "法律意見", lvl: 4,
  q: "下列哪些情況，代理**應建議**客戶徵詢法律意見？(i) 賣方並非註冊業主 (ii) 查冊顯示有未解除的押記令 (iii) 物業涉及遺產承辦 (iv) 客戶想了解管理費金額",
  o: ["只有 (i) 和 (ii)", "只有 (i)、(ii) 和 (iii)", "只有 (ii)、(iii) 和 (iv)", "只有 (i) 和 (iv)", "(i)、(ii)、(iii) 和 (iv)"],
  a: 1, why: "(i)(ii)(iii) 均涉及業權或法律風險，代理應建議客戶徵詢律師。(iv) 管理費屬一般物業資料，代理可自行向客戶說明，不必因此轉介律師。", note: "第 4.3.3 部份；《常規規例》第 13 條"
},
{
  id: "p4-11", p: 4, ref: "4.4.1", tag: "統計資料", lvl: 2,
  q: "私人住宅售價指數及租金指數由下列哪個機構公布？",
  o: ["土地註冊處", "差餉物業估價署", "政府統計處", "地政總署", "城市規劃委員會"],
  a: 1, why: "**差餉物業估價署**公布私人住宅的售價指數、租金指數、空置率等。土地註冊處公布買賣合約數目；政府統計處公布人口及住戶統計。", note: "第 4.4 部份"
},
{
  id: "p4-12", p: 4, ref: "4.4.3", tag: "統計資料", lvl: 2,
  q: "物業買賣合約的數目及金額，主要由下列哪個機構公布？",
  o: ["差餉物業估價署", "土地註冊處", "房屋局", "屋宇署", "稅務局"],
  a: 1, why: "**土地註冊處**每月公布送交註冊的買賣合約數目及金額，是判斷成交量的主要指標。", note: "第 4.4.3 部份"
},
{
  id: "p4-13", p: 4, ref: "4.1.3", tag: "產權負擔", lvl: 4,
  q: "「佔用許可證」（Occupation Permit）在查冊中的作用是：",
  o: ["證明業主已繳清管理費", "證明建築物可合法佔用，並用作核實落成年份", "證明物業已解除按揭", "證明物業符合城市規劃", "證明業主已繳印花稅"],
  a: 1, why: "佔用許可證（俗稱「入伙紙」）由建築事務監督根據《建築物條例》發出，證明建築物可合法佔用；第 36(2)(c) 條亦以它作為核實**落成年份**的依據。", note: "第 4.1.3 部份；第 36(2)(c) 條"
},
{
  id: "p4-14", p: 4, ref: "4.1.3", tag: "產權負擔", lvl: 4,
  q: "「大廈公契」（Deed of Mutual Covenant）在土地查冊中屬於：",
  o: ["物業資料", "業主資料", "產權負擔", "等待註冊的契約", "統計資料"],
  a: 2, why: "大廈公契是影響物業的已註冊文書，列於 **Incumbrances（產權負擔）** 部分。它規定各單位的使用權、管理費分攤及轉讓限制。", note: "第 4.1.3 部份"
},
{
  id: "p4-15", p: 4, ref: "4.3.1", tag: "查冊分析", lvl: 4,
  q: "查冊顯示物業有一項「CHARGING ORDER」（押記令）。這通常代表：",
  o: ["物業已轉讓給政府", "債權人或政府對物業的申索已登記（俗稱「釘契」）", "物業已出租", "業主已破產", "物業已符合規劃用途"],
  a: 1, why: "押記令（charging order）是法院或政府就欠款對物業作出的申索登記，俗稱「**釘契**」。未解除前通常難以完成交易或申請按揭。", note: "第 4.1.3 部份"
},
{
  id: "p4-16", p: 4, ref: "4.5", tag: "資料系統", lvl: 2,
  q: "下列哪一項**不是**政府提供的物業資料來源？",
  o: ["土地註冊處", "差餉物業估價署", "屋宇署", "地政總署", "私人地產代理的盤源系統"],
  a: 4, why: "私人地產代理的盤源系統屬**商業資料供應商**，不是政府來源。土地註冊處、差估署、屋宇署、地政總署均為政府部門。", note: "第 4.5 部份"
},
{
  id: "p4-17", p: 4, ref: "4.2.1", tag: "查冊類型", lvl: 4,
  q: "「現時查冊」與「歷史查冊」的主要分別是：",
  o: ["現時查冊收費較高", "現時查冊顯示現時業主及產權負擔，歷史查冊顯示過往轉讓紀錄", "歷史查冊只適用於商業物業", "現時查冊必須由律師進行", "兩者完全相同"],
  a: 1, why: "**現時查冊**顯示物業現時的業主、產權負擔及等待註冊的契約；**歷史查冊**顯示過往的轉讓及已解除的負擔，用於審查業權鏈。", note: "第 4.2.1 部份"
},
{
  id: "p4-18", p: 4, ref: "4.1.1", tag: "物業資料", lvl: 4,
  q: "查冊「物業資料」部分顯示「Government Lease: 99 years from 1 July 1923 (expired)」。代理應：",
  o: ["忽略，因為批約年期不影響交易", "告知客戶批約已屆滿，並建議查核是否已續期或新批", "自行決定樓價折讓", "要求客戶即時補地價", "假設政府會自動續期"],
  a: 1, why: "批約屆滿直接影響業權的穩定性。代理應如實告知客戶，並建議由律師查核是否有續期安排或新批地契，不應自行假設或作出保證。", note: "第 4.1.1 部份"
},
{
  id: "p4-19", p: 4, ref: "4.1.2", tag: "擁有形式", lvl: 4,
  q: "查冊顯示業主為「XX 有限公司」，代理除土地查冊外，還應進行：",
  o: ["風水查勘", "公司查冊，以確認公司狀態、董事及已登記押記", "稅務查冊", "婚姻查冊", "破產查冊（只查個人）"],
  a: 1, why: "當業主是公司時，除土地查冊外，須做**公司查冊**，確認公司是否仍註冊（LIVE）、董事名單，以及有否已登記的押記（charges）。如公司清盤，其處置資產的能力會受限制。", note: "第 4.2 部份"
},
{
  id: "p4-20", p: 4, ref: "4.3", tag: "查冊分析", lvl: 4,
  q: "代理在簽署臨時買賣合約前已做查冊，但到成交前才發現新增了一項按揭。這說明：",
  o: ["查冊結果永久有效", "查冊只反映查冊當日的情況，成交前應再查冊", "代理一定違反法例", "按揭一定無效", "土地註冊處出錯"],
  a: 1, why: "查冊結果只反映**查冊日期**的狀況。由查冊到成交期間，業主仍可能再按揭或再出售，因此成交前應**再查一次**，律師亦會在完成交易前更新查冊。", note: "第 4.3 部份"
},
{
  id: "p4-21", p: 4, ref: "4.1.4", tag: "註冊摘要", lvl: 4,
  q: "下列哪一項文書性質（Nature）最可能表示業權**已轉移**給現時業主？",
  o: ["MORTGAGE", "ASSIGNMENT", "OCCUPATION PERMIT", "DEED OF MUTUAL COVENANT", "CHARGING ORDER"],
  a: 1, why: "**ASSIGNMENT（轉讓契）**是完成交易時簽署、轉移法定業權的文書。MORTGAGE 是按揭、OCCUPATION PERMIT 是佔用許可證、DMC 是大廈公契、CHARGING ORDER 是押記令。", note: "第 4.1.4 部份"
},
{
  id: "p4-22", p: 4, ref: "4.3.2", tag: "查冊分析", lvl: 4,
  q: "代理發現查冊顯示的地址與客戶提供的地址**不完全一致**（例如樓層寫法不同）。最適當的處理是：",
  o: ["自行修改查冊結果", "以地段編號核對，並要求律師確認是否同一物業", "忽略差異", "取消交易", "要求客戶自行處理"],
  a: 1, why: "地址寫法常有差異，應以**地段編號（Lot No.）**及所佔份數核對，並由律師確認是否同一物業。代理不應自行修改查冊文件或忽略差異。", note: "第 4.3 部份"
},

/* ===================== 第 7 部份：租務 ===================== */
{
  id: "p7-01", p: 7, ref: "7.1", tag: "租約種類", lvl: 4,
  q: "「租賃」與「特許」（licence）的主要分別是：",
  o: ["租金高低", "租客是否享有獨有管有（exclusive possession）", "租約是否公證", "業主是否公司", "租期長短"],
  a: 1, why: "租賃與特許的分水嶺是**獨有管有**：租客如享有排他性的佔用權（可排除其他人包括業主），即屬租賃；如只是獲准許使用（例如酒店房間、共用辦公室），則屬特許。", note: "第 7.3.1 部份"
},
{
  id: "p7-02", p: 7, ref: "7.1", tag: "租約種類", lvl: 4,
  q: "下列哪一種租約會**自動延續**，直至一方給予適當通知終止？",
  o: ["固定期限租約", "週期性租約（periodic tenancy）", "隨意終止租約", "容忍租約", "分租租約"],
  a: 1, why: "**週期性租約**（例如按月或按年）會自動延續，直至一方給予法定或約定的**通知期**終止。固定期限租約在期滿時自動終止（除續租條款外）。", note: "第 7.1 部份"
},
{
  id: "p7-03", p: 7, ref: "s.6 (219)", tag: "口頭租約", lvl: 4,
  q: "業主與租客只以口頭協議租出單位，租期 2 年、即時交鎖匙、月租為市值租金。該租約：",
  o: ["完全無效", "有效，因符合《物業轉易及財產條例》第 6(2) 條的例外", "只可作 1 年", "須經監管局批准", "須以書面訂立才有效"],
  a: 1, why: "第 6(2) 條：口頭設定的租契如符合三個條件——**承租人在管有時即生效**、租期**不超過 3 年**、租金為**市值租金**（無須支付額外費用下可合理取得的最佳租金）——仍然有效。", note: "《物業轉易及財產條例》第 6(2) 條"
},
{
  id: "p7-04", p: 7, ref: "7.2", tag: "租約印花稅", lvl: 4,
  q: "月租 $20,000、租期 2 年的住宅租約，應繳印花稅約為：",
  o: ["$600", "$1,200", "$2,400", "$4,800", "$12,000"],
  a: 1, why: "租期 1 至 3 年，稅率為**年租的 0.5%**。年租 ＝ $20,000 × 12 ＝ $240,000；印花稅 ＝ $240,000 × 0.5% ＝ **$1,200**。", note: "第 7.2 部份；《印花稅條例》"
},
{
  id: "p7-05", p: 7, ref: "7.2", tag: "租約印花稅", lvl: 4,
  q: "租期 5 年的租約，印花稅稅率是：",
  o: ["租期內租金總額的 0.25%", "年租的 0.5%", "年租的 1%", "年租的 4.25%", "固定 $100"],
  a: 2, why: "租期**超逾 3 年**，稅率為**年租或平均年租的 1%**。0.25% 適用於不超逾 1 年或無指定租期；0.5% 適用於 1 至 3 年。", note: "第 7.2 部份"
},
{
  id: "p7-06", p: 7, ref: "7.3.2", tag: "租客權益", lvl: 4,
  q: "業主在租期內擅自更換門鎖，阻止租客進入單位。這**最可能**構成：",
  o: ["合法行使業權", "違反租客「管有而不受干擾」的權利，並可能構成非法剝奪管有", "正常的維修行為", "租約自動終止", "只屬民事糾紛，不涉及刑事"],
  a: 1, why: "租客享有**管有而不受干擾**（quiet enjoyment）的權利。業主更換門鎖阻止進入，屬干擾租客管有，可能構成**非法剝奪管有**（illegal eviction），屬刑事罪行，亦可能違反規管租賃的規定。", note: "第 7.3.2 部份；第 7 章第 IVA 部"
},
{
  id: "p7-07", p: 7, ref: "7.4.2", tag: "租客責任", lvl: 4,
  q: "租約屆滿時，租客應以甚麼狀態交還物業？",
  o: ["毋須清理，直接離開", "按租約規定的狀況交還，通常為「空置管有」及維修妥當", "只須交還鎖匙", "可保留部分傢俬作為補償", "須重新裝修"],
  a: 1, why: "租客須按租約規定的狀況交還物業，通常為**空置管有**（vacant possession）及維修妥當，並移除自己的物品。否則業主可從按金中扣除清理及維修費用。", note: "第 7.4.2 部份"
},
{
  id: "p7-08", p: 7, ref: "7.5.2", tag: "收回管有", lvl: 4,
  q: "租客欠租兩個月，業主想收回單位。下列哪項**最正確**？",
  o: ["業主可自行換鎖及丟棄租客物品", "業主須依租約及法律程序（通知、法院命令）收回管有", "業主可即時報警驅逐租客", "業主可斷水斷電迫遷", "業主可沒收租客全部財物"],
  a: 1, why: "即使租客欠租，業主亦須依**法律程序**收回管有：先依租約發出通知（如沒收租賃權條款），再向法院申請收樓令，由執達主任執行。自行換鎖、斷水斷電或丟棄物品，可能構成**非法剝奪管有**。", note: "第 7.5.2 部份"
},
{
  id: "p7-09", p: 7, ref: "7.6.1", tag: "維修責任", lvl: 4,
  q: "單位外牆滲水，導致室內牆身發霉。一般情況下，維修責任誰屬？",
  o: ["租客，因為在單位內發生", "業主，因為屬結構及外牆維修範圍", "管理公司，因為屬公用地方", "政府，因為屬樓宇安全", "雙方各半"],
  a: 1, why: "住宅租約一般隱含條款，要求業主保持**結構及外牆**維修妥當。外牆滲水屬結構及外牆問題，一般由業主負責；如因租客改動導致，則可能由租客負責。", note: "第 7.6.1 部份"
},
{
  id: "p7-10", p: 7, ref: "7.7", tag: "終止租約", lvl: 4,
  q: "「退租協議」（surrender）與「沒收租賃權」（forfeiture）的分別是：",
  o: ["兩者完全相同", "退租協議是雙方同意終止；沒收租賃權是業主因租客違約而單方終止", "退租協議只適用於商業租約", "沒收租賃權須經監管局批准", "退租協議須法院命令"],
  a: 1, why: "**退租協議**是業主與租客**雙方同意**提早終止租約；**沒收租賃權**是業主依租約的沒收條款，因租客**違約**而**單方**終止，通常須先發通知並依程序。", note: "第 7.7 部份"
},
{
  id: "p7-11", p: 7, ref: "7.7.3", tag: "終止租約", lvl: 4,
  q: "租約訂明「任何一方可於租期屆滿前給予兩個月書面通知終止租約」。這條款稱為：",
  o: ["續租權", "提早終止條文（break clause）", "沒收租賃權條款", "復原條款", "租金檢討條款"],
  a: 1, why: "**提早終止條文**（break clause）容許一方或雙方在指定時間給予通知後提早終止租約。續租權（option to renew）則是續約的權利。", note: "第 7.7.3 部份"
},
{
  id: "p7-12", p: 7, ref: "7.8", tag: "續租", lvl: 4,
  q: "租約設有「續租權」（option to renew），租客希望續租。下列哪項**最正確**？",
  o: ["租客可默示續租，毋須通知", "租客須在租約指明的期限內以書面通知行使續租權", "業主可隨時拒絕，毋須理由", "續租權自動失效", "須經監管局批准"],
  a: 1, why: "如租約設有續租權，租客須依租約指明的**期限及方式**（通常為書面通知）行使；逾期未行使，續租權可能失效。代理應提醒客戶留意期限。", note: "第 7.8 部份"
},
{
  id: "p7-13", p: 7, ref: "第 IVA 部", tag: "規管租賃", lvl: 4,
  q: "關於分間單位（劏房）的「規管租賃」，下列哪項**正確**？",

 },

  "why": "按揭是作為金錢或金錢等值償還保證的土地抵押，按揭人一般保留管有；「一切款項」按揭（all monies）擔保借款人對承按人的所有現有及將來債務，故再融資或加按時舊按揭可能仍涵蓋新債務。按揭人享有贖回權（equity of redemption），清還欠款後可要求承按人發出解除文件並送交註冊；轉按時新銀行清還舊按揭，舊銀行發出解除文件，新按揭送交註冊。承按人不會因按揭而成為註冊業主，只在一級按揭下可依條款行使管有或出售的權力。",
  "note": "按揭（第3部份 3.9）；《物業轉易及財產條例》(第219章) 第2條（法定押記的定義）"
 },

   "印花稅由代理公司負責繳付",
   "印花稅只在成交後才須繳付，並無時限",

  "why": "印花稅是就某些文書（包括住宅物業的買賣協議、轉讓契及租約）徵收的稅項，須在法定期限內加蓋印花。未加蓋印花的文書一般不得在民事法庭上作為證據；實務上，轉讓契亦須先加蓋印花，土地註冊處才會接受註冊，故「唔打印厘」不但不能逃稅，反而會令業權轉移及按揭無法妥善登記。繳付印花稅的責任在於文書的各方（通常由律師安排），代理應提醒客戶依時處理。",

 },

 },

            a: 1, why: "《常規規例》第 12(3) 條：持牌地產代理須將其為客戶或代客戶收取或持有的**所有款項**，存入在認可機構開立的**信託戶口**。存入一般營運戶口屬混同客戶款項，可招致紀律處分，嚴重者更可能觸犯第 43 條及第 55(2) 條。", note: "《常規規例》第 12(3) 條；第 43、55(2) 條" },
          { p: 2, ref: "s.12 (511C)", q: "阿明說「公司會計會處理收據」。就客戶款項的收據，法例要求是：",
            o: ["成交後一次過發出即可", "須**立即**向客戶發出書面收據，並保留副本**最少 3 年**", "只須在客戶要求時發出", "可用口頭確認代替", "只須在銀行月結單顯示"],
            a: 1, why: "《常規規例》第 12(2) 條：持牌地產代理須就所收取的任何款項**立即**向客戶發出書面收據，並在發出收據後將副本保留**最少 3 年**。「會計稍後處理」不符合「立即」的要求。", note: "《常規規例》第 12(2) 條" },
          { p: 2, ref: "表格 3", q: "陳先生委託恒安地產出售該住宅單位，應使用哪一份訂明協議？",
            o: ["表格 1", "表格 2", "表格 3", "表格 5", "表格 6"],
            a: 2, why: "表格 3 是與**賣方**訂立的地產代理協議（出售住宅物業）。表格 1 是物業資料表格、表格 2 是出租資料表格、表格 5 是業主出租委託、表格 6 是租客承租委託。", note: "《常規規例》訂明表格" },
          { p: 2, ref: "s.47, s.48", q: "恒安地產與陳先生簽署表格 3 後，下列哪項**正確**？",
            o: ["只須提供已簽立副本", "須在簽署前提供**未簽立**的副本，簽署後提供**已簽立**的副本", "毋須提供副本", "只須口頭說明條款", "副本須交監管局保存"],
            a: 1, why: "第 47 條要求向客戶提供**未簽立**的代理協議副本，讓客戶在簽署前細閱；第 48 條要求協議簽立後向客戶提供**已簽立**的副本。兩者都是保障客戶知情權的規定。", note: "第 47、48 條" },
          { p: 2, ref: "s.13 (511C)", q: "在張小姐簽署臨時買賣合約前，阿明**必須**：",
            o: ["代張小姐審查業權", "安排土地查冊並向買方提供查冊結果的文本", "代張小姐向銀行申請按揭", "替張小姐議定律師費", "向張小姐保證業權妥當"],
            a: 1, why: "《常規規例》第 13 條：持牌人須在訂立買賣協議或租契前，安排在**土地註冊處**進行**土地查冊**，並向買方提供查冊結果的**文本**。審查業權及提供法律意見屬律師的工作，代理不可代勞或作出保證。", note: "《常規規例》第 13 條" },
          { p: 2, ref: "s.38", q: "恒安地產的分行經理李小姐與營業員阿明，就「誰可出任分行經理」而言，下列哪項**正確**？",
            o: ["阿明有五年經驗，可出任經理", "只有持**地產代理牌照**的個人可出任經理，持營業員牌照者不可以", "任何持牌人均可出任經理", "經理毋須持牌", "經理可由公司股東出任，不論持牌與否"],
            a: 1, why: "第 38(1)(a) 條：辦事處須由一名持**地產代理牌照**的個人任經理。營業員牌照只可受僱從事代理工作，不可出任經理；非持牌人「看來是」經理更屬第 55(1)(g) 條罪行。", note: "第 38(1)(a)、(b)(ii) 條" },
          { p: 2, ref: "s.40", q: "恒安地產聘用阿明為營業員後，須於何時通知監管局？",
            o: ["聘用後 7 天內", "聘用後 31 天內", "聘用後 3 個月內", "年結時一併通知", "毋須通知"],
            a: 1, why: "第 40(2) 條：持牌地產代理僱用任何人為營業員，或終止僱用營業員，須在自僱用或終止日期起計的**31 天**期間屆滿前以書面通知監管局。", note: "第 40(2) 條" },
          { p: 2, ref: "s.45", q: "假設恒安地產從未與陳先生簽署表格 3，但交易最終完成。恒安地產能否透過訴訟追討佣金？",
            o: ["可以，因為交易已完成", "可能不可以，因為第 45 條要求具備訂明格式的已簽立代理協議", "可以，只要有成交紀錄", "可以，只要佣金合理", "不可以，因為佣金一律由法庭釐定"],
            a: 1, why: "第 45 條：代理只在此情況下才具有起訴權——已訂立並妥善簽立**以訂明格式**作出、載有訂明詳情的代理協議，且簽立時代理是持牌地產代理。沒有書面訂明協議，代理可能無法透過訴訟追討佣金。", note: "第 45 條" },
          { p: 2, ref: "s.36(1)(a)(vii)", q: "假設阿明同時代表陳先生（賣方）及張小姐（買方）。下列哪項**正確**？",
            o: ["不可以同時代表雙方", "可以，但須通知雙方，並應一方要求提供另一方就該物業提供的資料（除另一方明示指示不得提供）", "可以，但只可收取一方佣金", "只須通知賣方", "只須在成交後披露"],
            a: 1, why: "第 36(1)(a)(vii) 條：代理如就某物業**既為賣方又為買方行事**，須將其如此行事一事**通知該等客戶**，並應其中一方要求提供另一方就該物業提供的資料（除另一方以明示方式指示不得提供）。同時須披露利益。", note: "第 36(1)(a)(vii) 條" },
          { p: 2, ref: "s.30", q: "若阿明的行為被投訴並成立，下列哪項**不是**監管局或紀律委員會可作出的制裁？",
            o: ["譴責阿明", "在阿明的牌照上附加條件", "判處阿明罰款 $200,000", "判處阿明監禁三個月", "暫時吊銷阿明的牌照一年"],
            a: 3, why: "第 30 條的制裁包括訓誡／譴責、附加或更改條件、暫時吊銷（不超過 2 年）、撤銷牌照、罰款（不超過 $300,000）及命令支付費用。**監禁只可由法庭判處**，監管局及紀律委員會無權判監。", note: "第 30 條" },
          { p: 2, ref: "s.14(2) (511C)", q: "阿明向張小姐推薦一間律師行，並私下從該律師行收取 $3,000 轉介費。下列哪項**最正確**？",
            o: ["行業慣例，毋須披露", "須在推薦前向客戶披露該利益，否則不得作出推薦", "只須在成交後披露", "只須向公司申報", "只要收費低於市場價即可"],
            a: 1, why: "《常規規例》第 14(2) 條：如推薦可能對持牌人帶來金錢或其他實益權益，須**在推薦前向客戶披露**，否則不得推薦。這亦違反操守守則的披露利益要求。", note: "《常規規例》第 14(2) 條" },
          { p: 4, ref: "查冊分析", q: "就本個案，阿明**最應該**在何時建議客戶徵詢法律意見？",
            o: ["成交後", "發現聯權共有、押記令、按揭未解除及等待註冊的買賣合約時", "只在客戶主動要求時", "只有在客戶投訴時", "毋須建議，因為代理可自行處理"],
            a: 1, why: "查冊揭示多項重大業權風險（聯權共有但只有一人簽約、未解除按揭、押記令、另一份等待註冊的買賣合約）。代理應**即時**如實告知客戶，並建議徵詢律師意見，不可自行處理或淡化風險。", note: "第 4.3 部份；《常規規例》第 13 條" },
          { p: 2, ref: "s.9(5) (511C)", q: "假設交易最終告吹，單位不再出售。阿明應如何處理已刊登的廣告？",
            o: ["保留廣告，等待新買家", "在切實可行範圍內盡快移除廣告", "只把價格改低", "由買方負責移除", "毋須處理，廣告會自動失效"],
            a: 1, why: "《常規規例》第 9(5) 條：物業不再可供出售或購買或租賃後，或代理協議終止後（以較早者為準），持牌地產代理須在切實可行範圍內**盡快將所有由他發出或安排發出的廣告移去**。留著廣告可能誤導其他準買家。", note: "《常規規例》第 9(5) 條" },
          { p: 8, ref: "管理系統", q: "恒安地產要避免同類事件再發生，下列哪項措施**最有效**？",
            o: ["要求員工簽署承諾書", "設立書面程序：廣告須先取得賣方書面同意並由經理覆核、客戶款項即日存入信託戶口並發收據、查冊結果須存檔", "每月開會口頭提醒", "只在接獲投訴後調查", "把所有責任交由前線營業員承擔"],
            a: 1, why: "第 8 部份強調**可稽核的制度**：《常規規例》第 15 條要求持牌地產代理設立妥善程序或制度監督員工。書面程序、經理覆核、即日存入信託戶口、存檔記錄，都是可驗證的控制措施；口頭提醒或承諾書不足以證明有效控制。", note: "《常規規例》第 15 條" }
        ]
      }

            a: 1, why: "第 6(2) 條：口頭設定的租契如符合三個條件——**承租人在管有時即生效**、租期**不超過 3 年**、租金為**市值租金**（無須支付額外費用下可合理取得的最佳租金）——仍然有效。", note: "第 219 章第 6(2) 條" },

            o: ["不是，因為只有一個單位", "是，分間單位指組成建築物單位一部分的處所，其租賃受第 IVA 部規管", "只有在書面租約下才受規管", "只有租金超過 $10,000 才受規管", "只有商業單位才受規管"],
            a: 1, why: "「分間單位」（subdivided unit）指**組成建築物單位一部分的處所**。把單位分間出租，每間房均屬分間單位，其租賃受第 IVA 部規管（口頭租賃亦包括在內）。", note: "第 7 章第 120AA 條" },

            a: 1, why: "第 IVA 部：**規管周期**由連續**兩項**規管租賃組成，每項租期 **2 年**；首期租賃的租客有權獲授予次期租賃；業主不得在租期屆滿前終止；租金加幅受限制。", note: "第 7 章第 120AAO 條等" },
